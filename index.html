8，斜边是", "opts": ["10", "14", "48", "√28"], "exp": "6²＋8²＝100，斜边＝10。", "need": null, "fig": "rt68", "more": "用勾股定理：直角三角形中，两条直角边的平方和等于斜边的平方，a²＋b²＝c²。代入：6²＋8²＝36＋64＝100，所以 c²＝100，c＝√100＝10。记住一句话：求斜边用加法，先平方再相加，最后开平方。", "why": ["14 是 6＋8，直接把边长相加了。要先平方再相加：36＋64＝100，再开方得 10。", "48 是 6×8，把两边乘起来了。勾股定理是平方后相加：6²＋8²＝100。", "√28 是用 8²－6²＝28 算的。求斜边要用加法，求直角边才用减法。"]}, {"id": "m020", "kp": "数学/勾股定理/勾股定理与面积", "q": "直角三角形的斜边是 13，一条直角边是 5，另一条直角边是", "opts": ["12", "8", "18", "√194"], "exp": "13²－5²＝144，另一条直角边＝12。斜边最长，这里要用减法。", "need": null, "fig": "rt513", "more": "用勾股定理 a²＋b²＝c²，斜边是 c＝13。现在要求直角边，就用斜边的平方减去已知直角边的平方：b²＝13²－5²＝169－25＝144，所以 b＝√144＝12。记住一句话：斜边最长，求斜边用加法，求直角边用减法。", "why": ["8 是 13－5，直接把边长相减了。要先平方再相减：169－25＝144，再开方得 12。", "18 是 13＋5。直角边比斜边短，不可能比 13 还长。", "√194 是 13²＋5²＝194。13 是斜边，求直角边要用减法：13²－5²＝144。"]}, {"id": "m021", "kp": "数学/勾股定理/勾股定理与面积", "q": "三边长分别为 5、12、13 的三角形是", "opts": ["直角三角形", "锐角三角形", "钝角三角形", "等腰三角形"], "exp": "5²＋12²＝169＝13²，由勾股定理的逆定理知是直角三角形。", "need": null, "more": "用勾股定理的逆定理：如果三角形较短两边的平方和等于最长边的平方，它就是直角三角形。最长边是 13。算一算：5²＋12²＝25＋144＝169，而 13²＝169，两边相等。所以这是直角三角形（13 所对的角是直角）。", "why": ["锐角三角形三个角都是锐角。这里 5²＋12²＝13²，有一个角是直角。", "已经有一个直角了，三角形里不可能再有钝角。", "等腰三角形要有两条边相等，5、12、13 三条边都不一样长。"]}, {"id": "m022", "kp": "数学/实数/规律探究与分母有理化", "q": "把 1/√3 化简，结果是", "opts": ["√3/3", "√3", "3√3", "1/3"], "exp": "分子分母同乘 √3：√3/3。", "need": null, "more": "分母上有根号，要把根号去掉（分母有理化）。办法是分子、分母同时乘 √3，分数的值不变：1/√3＝(1×√3)/(√3×√3)＝√3/3。因为 √3×√3＝3，分母就没有根号了。记住一句话：分母是 √a，就上下同乘 √a。", "why": ["只给分子乘了 √3，分母忘了乘。上下要一起乘：√3/(√3×√3)＝√3/3。", "3√3 是把分母的 3 乘到分子上了。正确的是 √3 除以 3，写作 √3/3。", "分母乘成了 3，但分子忘了乘 √3。上下都乘 √3，分子是 √3。"]}, {"id": "m023", "kp": "数学/实数/规律探究与分母有理化", "q": "把 1/(√2＋1) 化简，结果是", "opts": ["√2－1", "√2＋1", "1－√2", "(√2－1)/3"], "exp": "分子分母同乘 (√2－1)，分母变成 2－1＝1。", "need": null, "more": "分母是 √2＋1，就给分子、分母同时乘 (√2－1)，用平方差公式：分母 (√2＋1)(√2－1)＝(√2)²－1²＝2－1＝1。分子是 1×(√2－1)＝√2－1。所以结果是 (√2－1)/1＝√2－1。记住一句话：分母是带根号的两项相加，就上下同乘把＋改成－的式子。", "why": ["这是把分母原样搬到分子上了。验算：1/(√2＋1) 比 1 小，而 √2＋1 比 2 还大。", "1－√2 是负数，可原式是正数。分母 2－1＝1，分子是 √2－1，符号不要弄反。", "分母算错了：(√2＋1)(√2－1)＝2－1＝1，不是 2＋1＝3。"]}, {"id": "m024", "kp": "数学/方程组/方程的解的含义", "q": "下列哪一组数是方程 2x－y＝3 的解？", "opts": ["x＝2，y＝1", "x＝1，y＝1", "x＝0，y＝3", "x＝1，y＝－2"], "exp": "代入检验：2×2－1＝3 ✓。其余三组代入都不等于 3。", "need": null, "more": "记住一句话：判断是不是方程的解，就把这组数代进去，看左边算出来等不等于右边。x＝2，y＝1：2×2－1＝4－1＝3，正好等于右边的 3，所以它是解。其他三组代进去都不等于 3。", "why": ["代入：2×1－1＝1，不等于 3，所以不是解。", "代入：2×0－3＝－3，不等于 3。注意是减去 y，符号别弄错。", "代入：2×1－(－2)＝2＋2＝4，不等于 3。减去负数要变成加。"]}, {"id": "m025", "kp": "数学/方程组/解方程组（代入、加减）", "q": "方程组 x＋y＝5，x－y＝1 的解是", "opts": ["x＝3，y＝2", "x＝2，y＝3", "x＝4，y＝1", "x＝3，y＝－2"], "exp": "两式相加：2x＝6，x＝3；代入得 y＝2。", "need": null, "more": "用加减消元法：两个方程里 y 的系数是 1 和 －1，两式相加 y 就消掉了。(x＋y)＋(x－y)＝5＋1，得 2x＝6，x＝3。再把 x＝3 代入 x＋y＝5，得 y＝2。验算：3－2＝1 ✓。所以解是 x＝3，y＝2。", "why": ["x、y 弄反了。代入第二个方程：2－3＝－1，不等于 1。", "只满足第一个方程：4＋1＝5，但 4－1＝3，不等于 1。两个方程都要满足。", "y 的符号错了。代入第一个方程：3＋(－2)＝1，不等于 5。"]}, {"id": "m026", "kp": "数学/方程组/解方程组（代入、加减）", "q": "用加减法解方程组 2x＋3y＝7 ①，2x－y＝3 ②，①－② 得", "opts": ["4y＝4", "2y＝4", "4y＝10", "2y＝10"], "exp": "3y－(－y)＝4y，7－3＝4。相减时每一项都要变号。", "need": null, "more": "①－② 就是左边减左边、右边减右边，第二个式子的每一项都要变号。左边：(2x＋3y)－(2x－y)＝2x＋3y－2x＋y＝4y。右边：7－3＝4。所以得 4y＝4。记住一句话：减去一个负数等于加上它，3y－(－y)＝3y＋y＝4y。", "why": ["3y－(－y) 算成了 3y－y＝2y。减去 －y 要变成加 y，得 4y。", "左边对了，右边却加成了 7＋3＝10。右边也要相减：7－3＝4。", "这是把两式相加了（3y＋(－y)＝2y，7＋3＝10），而且相加时 x 消不掉。题目要的是相减。"]}, {"id": "m027", "kp": "数学/方程组/解方程组（代入、加减）", "q": "把 y＝x－2 代入 3x－2y＝8，得到", "opts": ["3x－2x＋4＝8", "3x－2x－4＝8", "3x－2x－2＝8", "3x－x－2＝8"], "exp": "－2(x－2)＝－2x＋4，括号里每一项都要乘。", "need": null, "more": "代入时把 y 换成整个 (x－2)，一定要带括号：3x－2(x－2)＝8。去括号时 －2 要乘括号里的每一项：－2×x＝－2x，－2×(－2)＝＋4。", "why": ["－2×(－2)＝＋4，负负得正，这里写成了 －4。", "－2 只乘了 x，没有乘后面的 －2。", "y 前面的系数 2 丢了，而且符号也没变。"]}, {"id": "m028", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 x 元，涨价 10% 后的价格是", "opts": ["1.1x 元", "(x＋10) 元", "0.1x 元", "(x＋0.1) 元"], "exp": "涨 10% 是乘以 (1＋10%)＝1.1。", "need": null, "more": "“涨价 10%”是指在原价的基础上多出原价的 10%：x＋10%×x＝x＋0.1x＝1.1x。百分数是“原价的百分之几”，不是几元钱。", "why": ["x＋10 是“涨了 10 元”，不是涨 10%。", "0.1x 只是涨的那一部分，还要加上原价 x。", "0.1 要乘 x 才是涨的钱，不能直接加 0.1。"]}, {"id": "m029", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 x 元，先打八折，再降价 5 元，现在的价格是", "opts": ["(0.8x－5) 元", "0.8(x－5) 元", "(8x－5) 元", "(x－0.8－5) 元"], "exp": "打八折是乘 0.8，再降 5 元是减 5。", "need": null, "more": "按题目的先后顺序列：先打八折，x 变成 0.8x；再降 5 元，0.8x－5。顺序不同结果不同。", "why": ["0.8(x－5) 是“先降 5 元，再打八折”，顺序反了。", "打八折是乘 0.8（80%），不是乘 8。", "打八折是乘 0.8，不是减 0.8。"]}, {"id": "m030", "kp": "数学/方程组/调价、百分率应用题", "q": "去年有学生 x 人，今年比去年减少了 5%，今年有", "opts": ["0.95x 人", "(x－5) 人", "0.05x 人", "(x－0.05) 人"], "exp": "减少 5% 是乘以 (1－5%)＝0.95。", "need": null, "more": "记住一句话：减少 5%，就是今年只剩去年的 1－5%＝95%。所以今年人数＝x×(1－5%)＝x×0.95＝0.95x 人。也可以这样想：减少的人数是 5%×x＝0.05x，今年＝x－0.05x＝0.95x。", "why": ["减少的是 x 的 5%，不是 5 个人。减少的人数是 0.05x。", "0.05x 是减少了多少人，不是今年剩下的人数。今年＝x－0.05x＝0.95x。", "要减去的是 0.05x（x 的 5%），不是 0.05 这个数。"]}, {"id": "m031", "kp": "数学/方程组/购买与利润应用题", "q": "买 3 支钢笔和 2 本笔记本共 38 元，设钢笔每支 x 元、笔记本每本 y 元，方程是", "opts": ["3x＋2y＝38", "2x＋3y＝38", "x＋y＝38", "5(x＋y)＝38"], "exp": "单价×数量之和＝总价：3x＋2y＝38。", "need": null, "more": "记住一句话：总价＝单价×数量，买了几样东西，就把各自的总价加起来。3 支钢笔要 3×x＝3x 元，2 本笔记本要 2×y＝2y 元，加起来一共 38 元，所以方程是 3x＋2y＝38。", "why": ["数量配反了。钢笔 3 支对应 x，要写 3x；笔记本 2 本对应 y，要写 2y。", "x＋y 只是 1 支钢笔加 1 本笔记本的钱，没有乘数量。", "5(x＋y) 相当于买了 5 支钢笔和 5 本笔记本，和题目不符。"]}, {"id": "m032", "kp": "数学/方程组/方程组与一次函数图像", "q": "直线 y＝x＋1 与直线 y＝－x＋3 的交点坐标是", "opts": ["(1, 2)", "(2, 1)", "(1, 3)", "(2, 3)"], "exp": "联立：x＋1＝－x＋3，x＝1，y＝2。", "need": "第5章 二元一次方程与一次函数", "fig": "twolines_n", "more": "两条直线的交点同时在两条线上，所以交点的 y 值在两个式子里相等。令 x＋1＝－x＋3，移项得 2x＝2，x＝1。再代入 y＝x＋1，得 y＝2。验算：－1＋3＝2 ✓。交点是 (1, 2)。记住一句话：求交点，就把两个解析式联立成方程组来解。", "why": ["x、y 写反了。把 x＝2 代入 y＝x＋1 得 y＝3，不是 1，所以 (2, 1) 不在这条线上。", "x＝1 对了，但 y 算错了：代入 y＝x＋1 得 y＝2，不是 3。", "(2, 3) 只在 y＝x＋1 上，代入 y＝－x＋3 得 1，不是 3。交点要同时在两条线上。"]}, {"id": "m033", "kp": "数学/方程组/方程组与一次函数图像", "q": "两条直线平行时，它们对应的二元一次方程组", "opts": ["无解", "有唯一一组解", "有无数组解", "有两组解"], "exp": "平行没有交点，方程组无解。", "need": "第5章 二元一次方程与一次函数", "fig": "parallel", "more": "方程组的解就是两条直线的交点坐标。平行线没有交点，所以方程组没有解。相交→一组解；重合→无数组解；平行→无解。", "why": ["有唯一一组解对应两条直线相交于一点。", "有无数组解对应两条直线完全重合。", "两条直线最多只有一个交点，不会有两组解。"]}, {"id": "m034", "kp": "数学/方程组/方程组与一次函数图像", "q": "直线 l₁ 与 l₂ 交于点 (2, 3)，则它们对应的方程组的解是", "opts": ["x＝2，y＝3", "x＝3，y＝2", "x＝2，y＝－3", "无法确定"], "exp": "方程组的解就是交点坐标：横坐标是 x，纵坐标是 y。", "need": "第5章 二元一次方程与一次函数", "more": "记住一句话：两条直线的交点坐标，就是它们对应方程组的解。交点 (2, 3) 同时在两条直线上，所以 x＝2、y＝3 同时满足两个方程。坐标的写法是 (横坐标, 纵坐标)，也就是 (x, y)，所以解是 x＝2，y＝3。", "why": ["x、y 弄反了。坐标 (2, 3) 里前面的 2 是 x，后面的 3 是 y。", "y 的符号写错了。交点的纵坐标是 3，是正数，不是 －3。", "不知道具体方程也没关系，交点坐标就是方程组的解，可以确定。"]}, {"id": "m035", "kp": "数学/位置与坐标/点到坐标轴的距离", "q": "如图，点 P 到 x 轴的距离是", "opts": ["2", "3", "－3", "－2"], "exp": "P(－3, 2)。到 x 轴的距离看纵坐标：|2|＝2。", "need": null, "fig": "quad_q", "more": "先从图上读出 P 的坐标：P 在 x 轴的 －3 正上方，和 y 轴上的 2 一样高，所以 P(－3, 2)。到 x 轴的距离看纵坐标，取绝对值：|2|＝2。记住一句话：到 x 轴的距离管 y，到 y 轴的距离管 x，距离不带负号。", "why": ["3 是 P 到 y 轴的距离（看横坐标）。到 x 轴的距离要看纵坐标 2。", "－3 是 P 的横坐标，到 x 轴要看纵坐标；而且距离不能是负数。", "距离不能是负数，而且 P 在 x 轴上方，纵坐标是 2，不是 －2。"]}, {"id": "m036", "kp": "数学/位置与坐标/点到坐标轴的距离", "q": "如图，点 P 到 y 轴的距离是", "opts": ["3", "2", "－3", "5"], "exp": "P(－3, 2)。到 y 轴的距离看横坐标：|－3|＝3。距离不能是负数。", "need": null, "fig": "quad_q", "more": "先从图上读出 P 的坐标：P 在 x 轴的 －3 正上方，和 y 轴上的 2 一样高，所以 P(－3, 2)。到 y 轴的距离看横坐标，取绝对值：|－3|＝3。从 P 水平向右走到 y 轴，正好 3 格。记住一句话：距离不带负号。", "why": ["2 是 P 到 x 轴的距离（看纵坐标）。到 y 轴的距离要看横坐标。", "横坐标是 －3，但距离不能是负数，要取绝对值：|－3|＝3。", "5 是把 3 和 2 加起来了。到 y 轴的距离只看横坐标：3。"]}, {"id": "m037", "kp": "数学/一次函数/坐标系中的面积", "q": "如图，△ABC 的面积是", "opts": ["6", "12", "7", "4.5"], "exp": "底 AB＝3－(－1)＝4，高是点 C 到 x 轴的距离 3：½×4×3＝6。", "need": null, "fig": "area_q", "more": "先从图上读坐标：A(－1, 0)，B(3, 0)，C(1, 3)。A、B 都在 x 轴上，用 AB 当底：AB＝3－(－1)＝3＋1＝4。高是 C 到 x 轴的距离，看纵坐标：3。面积＝1/2×底×高＝1/2×4×3＝6。", "why": ["12 是 4×3，忘了乘 1/2。三角形面积是同底同高长方形的一半。", "7 是把底 4 和高 3 加起来了。面积要相乘再除以 2：1/2×4×3＝6。", "把底算成了 3。A 在 －1，B 在 3，AB＝3－(－1)＝4，不是 3。"]}, {"id": "m038", "kp": "数学/方程组/方程组与一次函数图像", "q": "如图，直线 l₁、l₂ 对应的二元一次方程组的解是", "opts": ["x＝1，y＝2", "x＝2，y＝1", "x＝－1，y＝3", "x＝3，y＝0"], "exp": "方程组的解就是两条直线交点的坐标：交点是 (1, 2)，横坐标是 x，纵坐标是 y。", "need": "第5章 二元一次方程与一次函数", "fig": "twolines_q", "more": "记住一句话：两条直线的交点坐标，就是方程组的解。从图上看，两条直线相交在加粗的那个点，从这点往下对着 x 轴的 1，往左对着 y 轴的 2，所以交点是 (1, 2)。横坐标是 x，纵坐标是 y，解是 x＝1，y＝2。", "why": ["x、y 弄反了。交点 (1, 2) 里，1 是 x，2 是 y。", "交点不在这里。从图上看，交点在 x 轴上 1 的正上方，高度是 2。", "(3, 0) 是 l₂ 和 x 轴的交点，不是 l₁ 和 l₂ 的交点。"]}, {"id": "m039", "kp": "数学/位置与坐标/点到坐标轴的距离", "q": "点 M 在第二象限，到 x 轴的距离是 3，到 y 轴的距离是 1，则 M 的坐标是", "opts": ["(－1, 3)", "(－3, 1)", "(1, －3)", "(3, －1)"], "exp": "到 x 轴的距离是 |y|＝3，到 y 轴的距离是 |x|＝1。第二象限 (－,＋)，所以是 (－1, 3)。", "need": null, "more": "先把距离翻译成坐标：到 x 轴的距离是 3，说明 |y|＝3；到 y 轴的距离是 1，说明 |x|＝1。再看象限：第二象限横坐标是负数、纵坐标是正数 (－,＋)。所以 x＝－1，y＝3，M(－1, 3)。记住一句话：到 x 轴的距离管 y，到 y 轴的距离管 x。", "why": ["x、y 弄反了。到 x 轴的距离 3 是 |y|，所以 y＝3；到 y 轴的距离 1 是 |x|，x＝－1。", "(1, －3) 横坐标正、纵坐标负，在第四象限。第二象限是 (－,＋)。", "(3, －1) 既把 x、y 弄反了，又跑到了第四象限。应该是 (－1, 3)。"]}, {"id": "m040", "kp": "数学/实数/平方根与算术平方根", "q": "√(9/25) 的值是", "opts": ["3/5", "±3/5", "9/25", "3/25"], "exp": "根号只表示算术平方根，结果不带 ±：√(9/25)＝3/5。这就是期中第 4 题。", "need": null, "more": "“√”只表示算术平方根，结果不带 ±。分数开平方，分子、分母分别开：√9＝3，√25＝5，所以 √(9/25)＝3/5。验算：(3/5)²＝9/25 ✓。记住一句话：问“平方根”才写 ±，看到根号 √ 只写正的。", "why": ["±3/5 是 9/25 的平方根。题目是 √(9/25)，根号只取正的 3/5。", "9/25 是根号里面的数，还没开方。要找平方等于 9/25 的数：3/5。", "只给分子开了方，分母也要开：√25＝5，结果是 3/5。"]}, {"id": "m041", "kp": "数学/实数/平方根与算术平方根", "q": "下列说法正确的是", "opts": ["负数没有平方根", "4 的平方根是 2", "√9＝±3", "0 没有平方根"], "exp": "负数没有平方根。4 的平方根是 ±2；√9＝3（不带 ±）；0 的平方根是 0。", "need": null, "more": "一句一句检查。任何数的平方都不会是负数，所以负数没有平方根，这句对。4 的平方根有两个：±2，只说 2 不完整。√9 表示算术平方根，只取正的：√9＝3。0×0＝0，所以 0 的平方根是 0。只有第一句正确。", "why": ["4 的平方根有两个：2 和 －2，要写 ±2。2 只是算术平方根。", "带根号 √ 只取正的那个：√9＝3。9 的平方根才是 ±3。", "0×0＝0，所以 0 的平方根就是 0。0 有平方根，而且只有一个。"]}, {"id": "m042", "kp": "数学/一次函数/自变量取值范围", "q": "函数 y＝√(x＋3) 中，自变量 x 的取值范围是", "opts": ["x≥－3", "x＞－3", "x≥3", "x≠－3"], "exp": "根号下不能是负数：x＋3≥0，所以 x≥－3。", "need": null, "more": "记住一句话：根号里面不能是负数，但可以是 0。所以 x＋3≥0，两边同时减 3，得 x≥－3。检验：x＝－3 时 y＝√0＝0，可以；x＝－4 时根号里是 －1，不行。", "why": ["漏掉了 x＝－3。这时 y＝√0＝0 是可以的，所以要带等号。", "移项时符号错了：x＋3≥0，3 移到右边变成 －3，得 x≥－3。比如 x＝0 也可以。", "x≠－3 是分母不能为 0 的写法。这里没有分母：x＝－3 可以，x＝－4 却不行。"]}, {"id": "m043", "kp": "数学/一次函数/自变量取值范围", "q": "函数 y＝1/(x＋1) 中，自变量 x 的取值范围是", "opts": ["x≠－1", "x≠1", "x＞－1", "x≥－1"], "exp": "分母不能为 0：x＋1≠0，所以 x≠－1。", "need": null, "more": "记住一句话：分母不能等于 0。令 x＋1≠0，两边同时减 1，得 x≠－1。除了 －1，其他数都可以：比如 x＝0 时 y＝1，x＝－2 时 y＝1/(－1)＝－1，都有意义。", "why": ["移项符号错了：x＋1＝0 时 x＝－1，不是 1。x＝1 时分母是 2，没问题。", "x 比 －1 小也可以，比如 x＝－2 时 y＝－1。这里没有根号，只要分母不为 0。", "x＝－1 时分母是 0，恰恰不行；而且比 －1 小的数也可以。"]}, {"id": "m044", "kp": "数学/一次函数/自变量取值范围", "q": "函数 y＝√(x－1)/(x－3) 中，自变量 x 的取值范围是", "opts": ["x≥1 且 x≠3", "x≥1", "x≠3", "x＞1 且 x≠3"], "exp": "根号下 x－1≥0，得 x≥1；分母 x－3≠0，得 x≠3。两个条件都要写，用“且”连接。", "need": null, "more": "这个式子里有两样东西要管。① 根号 √(x－1)：根号里面不能是负数，x－1≥0，得 x≥1（可以等于 1，因为 √0＝0 算得出来）。② 分母 x－3：分母不能是 0，x－3≠0，得 x≠3。两个条件要同时满足，写成：x≥1 且 x≠3。检查：x＝1 时 y＝0/(－2)＝0，可以；x＝3 时分母是 0，不行。", "why": ["x≥1 只管了根号，漏了分母：x＝3 时分母 x－3＝0，算不出来。", "x≠3 只管了分母，漏了根号：x＝0 时根号里是 －1，算不出来。", "根号在分子上，里面可以等于 0，所以是 x≥1，不是 x＞1。只有根号在分母上才不能取等号。"]}, {"id": "m045", "kp": "数学/一次函数/待定系数法", "q": "正比例函数 y＝kx 的图像经过点 (2, －6)，则 k 的值是", "opts": ["－3", "3", "－12", "－1/3"], "exp": "把点代入：－6＝2k，k＝－3。", "need": null, "more": "图像经过一个点，就说明这个点的坐标满足函数关系式。把 x＝2，y＝－6 代入 y＝kx：－6＝2k。两边同时除以 2，得 k＝－6÷2＝－3。验算：y＝－3×2＝－6 ✓。记住一句话：过哪个点，就把哪个点代进去。", "why": ["漏掉了负号。－6÷2＝－3，不是 3。验算：3×2＝6，不是 －6。", "－12 是把 2 和 －6 乘起来了。由 －6＝2k 求 k，要用除法：－6÷2。", "除反了，算成了 2÷(－6)。k＝y÷x＝－6÷2＝－3。"]}, {"id": "m046", "kp": "数学/一次函数/待定系数法", "q": "一次函数 y＝kx－1 的图像经过点 (2, 3)，则 k 的值是", "opts": ["2", "1", "－2", "4"], "exp": "代入：3＝2k－1，2k＝4，k＝2。验算：2×2－1＝3 ✓。", "need": null, "more": "经过点 (2, 3)，就是 x＝2 时 y＝3。代入 y＝kx－1：3＝2k－1。把 －1 移到左边变成 ＋1：2k＝4，k＝2。验算：2×2－1＝3 ✓。", "why": ["k＝1 时 2×1－1＝1，不等于 3。多半是移项时 3－1 了，应该是 3＋1。", "符号反了，代回去：－2×2－1＝－5，不是 3。", "4 是 2k 的值，还要除以 2。"]}, {"id": "m047", "kp": "数学/一次函数/待定系数法", "q": "一次函数 y＝2x＋b 的图像经过点 (1, －1)，则 b 的值是", "opts": ["－3", "1", "3", "－1"], "exp": "代入：－1＝2×1＋b，b＝－3。", "need": null, "more": "x＝1 时 y＝－1，代入 y＝2x＋b：－1＝2×1＋b，即 －1＝2＋b，b＝－1－2＝－3。验算：2×1＋(－3)＝－1 ✓。", "why": ["b＝1 时 2＋1＝3，不是 －1。移项 2 要变成 －2。", "符号反了：b＝－1－2＝－3。", "－1 是 y 的值，不是 b。代回去 2－1＝1≠－1。"]}, {"id": "m048", "kp": "数学/一次函数/待定系数法", "q": "直线 y＝kx＋b 与 y 轴交于点 (0, －2)，并且经过点 (3, 4)，它的表达式是", "opts": ["y＝2x－2", "y＝－2x－2", "y＝2x＋2", "y＝x－2"], "exp": "与 y 轴交于 (0, －2)，所以 b＝－2。再代入 (3, 4)：4＝3k－2，k＝2。", "need": null, "fig": "line_m2", "more": "两步：① 与 y 轴的交点 (0, －2) 直接告诉我们 b＝－2（x＝0 时 y＝b）；② 再把 (3, 4) 代入 y＝kx－2：4＝3k－2，3k＝6，k＝2。所以 y＝2x－2。验算：2×3－2＝4 ✓。", "why": ["k 的符号错了：代入 (3, 4)，－2×3－2＝－8，不是 4。", "b 的符号错了：与 y 轴交于 (0, －2)，b 应是 －2。", "k＝1 时 3－2＝1，不是 4。3k＝6，k＝2。"]}, {"id": "m049", "kp": "数学/一次函数/利润计算", "q": "某商品每件进价 20 元，售价 28 元，每件的利润是", "opts": ["8 元", "48 元", "28 元", "20 元"], "exp": "每件利润＝售价－进价＝28－20＝8 元。", "need": null, "more": "记住一句话：每件利润＝售价－进价。进价是商店买进来花的钱，售价是卖给顾客收的钱，两者的差就是赚的钱。这里售价 28 元，进价 20 元，所以每件利润＝28－20＝8 元。", "why": ["48 元是 28＋20，把售价和进价加起来了。利润要用减法。", "28 元是售价，是收到的钱，还没扣掉进价 20 元。", "20 元是进价，是买进来花出去的钱，不是赚的钱。"]}, {"id": "m050", "kp": "数学/一次函数/利润计算", "q": "某商品每件成本 15 元，售价 25 元，一天卖出 40 件，这一天的总利润是", "opts": ["400 元", "1000 元", "600 元", "1600 元"], "exp": "先算每件赚 25－15＝10 元，再乘件数：10×40＝400 元。1000 元是总收入，不是利润。", "need": null, "more": "分两步算。第一步，每件利润＝售价－成本＝25－15＝10 元。第二步，总利润＝每件利润×件数＝10×40＝400 元。记住一句话：先算每件赚多少，再乘件数；卖得的总钱数不是利润。", "why": ["1000 元是 25×40，是一天卖得的总收入，还没减去成本。", "600 元是 15×40，是 40 件的总成本，不是利润。", "1600 元是 (25＋15)×40，把售价和成本加起来了。利润要用减法。"]}, {"id": "m051", "kp": "数学/一次函数/利润计算", "q": "某商品每件进价 50 元，卖出 30 件共获利 360 元，每件的售价是", "opts": ["62 元", "12 元", "38 元", "60 元"], "exp": "每件利润＝360÷30＝12 元，售价＝进价＋利润＝50＋12＝62 元。", "need": null, "more": "这次是反过来求售价，分两步。第一步，30 件一共赚 360 元，每件赚 360÷30＝12 元。第二步，售价＝进价＋每件利润＝50＋12＝62 元。验算：(62－50)×30＝12×30＝360 元 ✓。", "why": ["12 元是每件的利润，不是售价。售价还要加上进价：50＋12＝62 元。", "38 元是 50－12。卖东西要赚钱，售价应该比进价高，要用加法。", "售价 60 元每件只赚 10 元，30 件赚 300 元，不是 360 元。每件应赚 360÷30＝12 元。"]}, {"id": "m052", "kp": "数学/一次函数/利润计算", "q": "某商品每件进价 a 元，售价 b 元，卖出 n 件，总利润是", "opts": ["(b－a)n 元", "(a－b)n 元", "bn 元", "(b－a＋n) 元"], "exp": "每件利润是 (b－a) 元，n 件的总利润是 (b－a)n 元。", "need": null, "more": "和数字题一样，只是把数换成了字母。第一步，每件利润＝售价－进价＝(b－a) 元。第二步，总利润＝每件利润×件数＝(b－a)×n＝(b－a)n 元。拿不准时可以代数试试：进价 20、售价 28、卖 10 件，(28－20)×10＝80 元。", "why": ["减反了。利润是售价减进价，(a－b) 是进价减售价。", "bn 是总收入（售价×件数），还没减去进价。", "(b－a) 后面要乘 n，不是加 n。件数和每件利润是相乘的关系。"]}, {"id": "m053", "kp": "数学/一次函数/利润计算", "q": "某水果每千克进价 6 元，售价 10 元。要获得 200 元利润，需要卖出", "opts": ["50 千克", "20 千克", "25 千克", "12.5 千克"], "exp": "每千克利润 10－6＝4 元，200÷4＝50 千克。", "need": null, "more": "这道题用“总利润＝每千克利润×千克数”。第一步，先算每千克赚多少：售价－进价＝10－6＝4（元）。第二步，要赚 200 元，就看 200 里有几个 4：200÷4＝50（千克）。验算：50×4＝200 元 ✓。记住一句话：利润＝售价－进价，不能直接拿售价去算。所以答案是 50 千克。", "why": ["20 千克是 200÷10，把售价 10 元当成了每千克的利润。每千克其实只赚 10－6＝4 元。", "卖 25 千克只赚 25×4＝100 元，只有要求的一半。应该用 200÷4＝50。", "12.5 千克是算出 50 以后又多除了一次 4。验算：12.5×4＝50 元，太少了。"]}, {"id": "m054", "kp": "数学/一次函数/分段函数反求", "q": "某市水费：每月用水不超过 10 吨，每吨 3 元；超过 10 吨的部分每吨 5 元。某户用水 14 吨，应交水费", "opts": ["50 元", "42 元", "70 元", "20 元"], "exp": "前 10 吨：10×3＝30 元；超过的 4 吨：4×5＝20 元；共 50 元。", "need": null, "fig": "water", "more": "分两段算再相加：前 10 吨按 3 元，10×3＝30 元；超过的部分是 14－10＝4 吨，按 5 元，4×5＝20 元；一共 30＋20＝50 元。", "why": ["42 是 14×3，全部按 3 元算了，超过的 4 吨应按 5 元。", "70 是 14×5，全部按 5 元算了，前 10 吨只要 3 元。", "20 只是超过部分的钱，还要加上前 10 吨的 30 元。"]}, {"id": "m055", "kp": "数学/一次函数/分段函数反求", "q": "某市水费：每月用水不超过 10 吨，每吨 3 元；超过 10 吨的部分每吨 5 元。某户交了 45 元水费，用水", "opts": ["13 吨", "15 吨", "9 吨", "12 吨"], "exp": "先判断：用满 10 吨是 30 元，45＞30，所以超过了 10 吨。超过部分 (45－30)÷5＝3 吨，共 13 吨。", "need": null, "fig": "water", "more": "已知钱数求吨数，先找分界：正好用 10 吨是 30 元。45 元比 30 元多，说明超过了 10 吨。多出的钱 45－30＝15 元，每吨 5 元，多用了 15÷5＝3 吨，一共 10＋3＝13 吨。验算：30＋3×5＝45 ✓。", "why": ["15 是 45÷3，全部按 3 元算了。超过 10 吨的部分是 5 元一吨。", "9 是 45÷5，全部按 5 元算了。前 10 吨是 3 元一吨。", "12 吨的水费是 30＋2×5＝40 元，不是 45 元。"]}, {"id": "m056", "kp": "数学/一次函数/分段函数反求", "q": "某市水费：每月用水不超过 10 吨，每吨 3 元；超过 10 吨的部分每吨 5 元。某户交了 24 元水费，用水", "opts": ["8 吨", "4.8 吨", "10 吨", "12 吨"], "exp": "先判断：用满 10 吨是 30 元，24＜30，没有超过 10 吨，按每吨 3 元算：24÷3＝8 吨。", "need": null, "fig": "water", "more": "先找分界：正好用 10 吨是 30 元。24 元比 30 元少，说明没超过 10 吨，全部按 3 元算：24÷3＝8 吨。", "why": ["4.8 是 24÷5。没超过 10 吨时每吨是 3 元，不是 5 元。", "10 吨要交 30 元，不是 24 元。", "12 吨已经超过 10 吨，要交 40 元。"]}, {"id": "m057", "kp": "数学/一次函数/分段函数反求", "q": "某市水费：每月用水不超过 10 吨，每吨 3 元；超过 10 吨的部分每吨 5 元。用水 x 吨（x＞10）时，水费 y（元）的表达式是", "opts": ["y＝30＋5(x－10)", "y＝5x", "y＝30＋5x", "y＝3x＋5(x－10)"], "exp": "前 10 吨固定 30 元，超过的部分是 (x－10) 吨，每吨 5 元：y＝30＋5(x－10)。", "need": null, "fig": "water", "more": "分两段算钱。前 10 吨：每吨 3 元，一共 3×10＝30 元，这是固定的。超过的部分：一共用了 x 吨，超过的是 (x－10) 吨，每吨 5 元，是 5(x－10) 元。加起来：y＝30＋5(x－10)，化简是 y＝5x－20。用一个数检验：x＝12 时，前 10 吨 30 元，超过 2 吨 10 元，共 40 元；5×12－20＝40，对。", "why": ["y＝5x 是把全部 x 吨都按 5 元算了，前 10 吨其实每吨只收 3 元。", "y＝30＋5x 是把 x 吨又全算了一遍 5 元，应该只算超过的 (x－10) 吨。", "前 10 吨的钱是 3×10＝30，不是 3x：x 是总吨数，3x 就把超过的部分也按 3 元算了一遍。"]}, {"id": "m058", "kp": "数学/位置与坐标/最短路径（对称）", "q": "点 (－2, 5) 关于 y 轴对称的点的坐标是", "opts": ["(2, 5)", "(－2, －5)", "(2, －5)", "(5, －2)"], "exp": "关于 y 轴对称：纵坐标不变，横坐标变相反数，得 (2, 5)。", "need": null, "fig": "pm25", "more": "记住一句话：关于 y 轴对称，就是沿 y 轴左右对折——高低不变，左右换边。所以纵坐标（第二个数）不变，横坐标（第一个数）变成相反数。点 (－2, 5)：横坐标 －2 变成 2，纵坐标 5 不变，得到 (2, 5)。在图上看，(－2, 5) 在 y 轴左边 2 格，对称点就在右边 2 格、一样高的地方。", "why": ["(－2, －5) 是关于 x 轴对称的点（上下翻）。关于 y 轴是左右翻，应该改横坐标。", "(2, －5) 两个数都变了号，这是关于原点对称。关于 y 轴只改横坐标。", "(5, －2) 把横、纵坐标的位置对调了。对称不会交换两个数的位置。"]}, {"id": "m059", "kp": "数学/位置与坐标/最短路径（对称）", "q": "点 A(1, 3) 关于 x 轴的对称点 A′ 的坐标是", "opts": ["(1, －3)", "(－1, 3)", "(－1, －3)", "(3, 1)"], "exp": "关于 x 轴对称：横坐标不变，纵坐标变相反数，得 (1, －3)。", "need": null, "fig": "p13", "more": "记住一句话：关于 x 轴对称，就是沿 x 轴上下对折——左右位置不变，上下换边。所以横坐标（第一个数）不变，纵坐标（第二个数）变成相反数。A(1, 3)：横坐标 1 不变，纵坐标 3 变成 －3，得到 A′(1, －3)。在图上看，A 在 x 轴上方 3 格，A′ 就在它正下方、x 轴下方 3 格。", "why": ["(－1, 3) 是关于 y 轴对称的点（左右翻）。关于 x 轴是上下翻，应该改纵坐标。", "(－1, －3) 两个数都变了号，这是关于原点对称。关于 x 轴只改纵坐标。", "(3, 1) 把横、纵坐标的位置对调了。对称点不会把两个数对调。"]}, {"id": "m060", "kp": "数学/位置与坐标/最短路径（对称）", "q": "A(0, 2)、B(4, 1) 在 x 轴的同侧，P 是 x 轴上的动点，PA＋PB 的最小值是", "opts": ["5", "√17", "3", "7"], "exp": "作 A 关于 x 轴的对称点 A′(0, －2)，最小值＝A′B＝√(4²＋3²)＝5。√17 是 AB 的长，不是答案。", "need": null, "fig": "ab_x", "more": "A、B 在 x 轴同侧，先作 A 关于 x 轴的对称点 A′(0, －2)。因为 PA＝PA′，所以 PA＋PB＝PA′＋PB；当 A′、P、B 在一条直线上时最短，最小值就是线段 A′B 的长。用勾股定理算 A′B：横着差 4－0＝4，竖着差 1－(－2)＝3，A′B＝√(4²＋3²)＝√25＝5。所以答案是 5。", "why": ["√17 是 AB 的长。P 在 x 轴上，A、P、B 连不成一条直线，PA＋PB 一定比 AB 长。", "3 只算了竖直方向的差 1－(－2)＝3，忘了横向还差 4，要用勾股定理。", "7 是把 4 和 3 直接相加了。A′B 是直角三角形的斜边，要算 √(4²＋3²)＝5。"]}, {"id": "m061", "kp": "数学/位置与坐标/最短路径（对称）", "q": "用“作对称点”的方法求 PA＋PB 的最小值，最后的依据是", "opts": ["两点之间线段最短", "垂线段最短", "两点确定一条直线", "三角形的内角和是 180°"], "exp": "作对称点后 PA＋PB＝PA′＋PB，A′、P、B 在一条直线上时最短，依据是两点之间线段最短。", "need": null, "fig": "shortest_q", "more": "作对称点以后，因为 PA＝PA′，所以 PA＋PB 就变成了 PA′＋PB，也就是从 A′ 经过 P 走到 B 的路线长。A′ 和 B 在直线 l 的两侧，连接 A′B，交 l 于点 P，这时路线是一条线段，最短。依据就是：两点之间，线段最短。记住一句话：作对称点，是为了把“折线”拉成“线段”。", "why": ["垂线段最短说的是“直线外一点到直线”的距离。这里比的是 A′ 到 B 的路线长短。", "两点确定一条直线说的是过两点能画几条直线，它不比较长短。", "三角形内角和讲的是角的度数，跟线段的长短没有关系。"]}, {"id": "m062", "kp": "数学/一次函数/坐标系中的面积", "q": "直线 y＝2x＋4 与 x 轴的交点坐标是", "opts": ["(－2, 0)", "(2, 0)", "(0, 4)", "(0, －2)"], "exp": "与 x 轴的交点令 y＝0：2x＋4＝0，x＝－2，交点 (－2, 0)。", "need": null, "more": "记住一句话：x 轴上的点，纵坐标都是 0。所以求直线与 x 轴的交点，就令 y＝0。代入：0＝2x＋4，移项得 2x＝－4，两边除以 2，x＝－2。交点的横坐标是 －2、纵坐标是 0，写成 (－2, 0)。验算：2×(－2)＋4＝0 ✓。", "why": ["移项后 2x＝－4，x 是 －2，不是 2。代回检验：2×2＋4＝8≠0。", "(0, 4) 是令 x＝0 得到的，那是与 y 轴的交点，不是与 x 轴的交点。", "(0, －2) 把 －2 写到纵坐标的位置了。x 轴上的点纵坐标是 0，要写 (－2, 0)。"]}, {"id": "m063", "kp": "数学/一次函数/坐标系中的面积", "q": "直线 y＝－x＋3 与 y 轴的交点坐标是", "opts": ["(0, 3)", "(3, 0)", "(0, －3)", "(－3, 0)"], "exp": "与 y 轴的交点令 x＝0：y＝3，交点 (0, 3)。(3, 0) 是与 x 轴的交点。", "need": null, "more": "记住一句话：y 轴上的点，横坐标都是 0。所以求直线与 y 轴的交点，就令 x＝0。代入：y＝－0＋3＝3。交点的横坐标是 0、纵坐标是 3，写成 (0, 3)。小窍门：y＝kx＋b 里的 b，就是直线与 y 轴交点的纵坐标，这里 b＝3。", "why": ["(3, 0) 是令 y＝0 求出的，那是与 x 轴的交点，不是与 y 轴的交点。", "x＝0 时 y＝－0＋3＝3，是正的。负号只跟着 x，不跟着 3。", "(－3, 0) 既把轴弄错了，又把符号弄错了。y 轴上的点横坐标是 0。"]}, {"id": "m064", "kp": "数学/一次函数/坐标系中的面积", "q": "直线 y＝2x＋4 与两条坐标轴围成的三角形的面积是", "opts": ["4", "8", "2", "16"], "exp": "与 x 轴交于 (－2, 0)，与 y 轴交于 (0, 4)。两条直角边长是 2 和 4，面积＝2×4÷2＝4。", "need": null, "fig": "line2x4", "more": "先求两个交点。令 y＝0：2x＋4＝0，x＝－2，与 x 轴交于 (－2, 0)；令 x＝0：y＝4，与 y 轴交于 (0, 4)。这两点和原点 O 围成一个直角三角形，两条直角边在坐标轴上，长度是 2 和 4（长度不能是负的，－2 要取 2）。面积＝两条直角边相乘÷2＝2×4÷2＝4。", "why": ["8 是 2×4，忘了除以 2。三角形面积是“底×高÷2”。", "2 只用了一条边（比如 4÷2）。两条直角边 2 和 4 都要用上：2×4÷2＝4。", "16 是把“÷2”错成了“×2”（2×4×2），或者把两条边都当成了 4。"]}, {"id": "m065", "kp": "数学/一次函数/坐标系中的面积", "q": "A(－1, 0)，B(3, 0)，C(2, －5)，三角形 ABC 的面积是", "opts": ["10", "20", "5", "7.5"], "exp": "AB 在 x 轴上，底＝3－(－1)＝4；高＝C 到 x 轴的距离＝|－5|＝5；面积＝4×5÷2＝10。", "need": null, "fig": "area_neg", "more": "AB 在 x 轴上，就把 AB 当底。底＝右边点的横坐标－左边点的横坐标＝3－(－1)＝3＋1＝4。高是点 C 到 x 轴的距离，就是 C 纵坐标的绝对值：|－5|＝5（距离不能是负数）。面积＝底×高÷2＝4×5÷2＝10。记住一句话：x 轴上两点的距离＝大横坐标－小横坐标。", "why": ["20 是 4×5，忘了除以 2。三角形面积＝底×高÷2。", "5 是把底算成了 3－1＝2。A 的横坐标是 －1，要算 3－(－1)＝4。", "7.5 是 3×5÷2，把底当成了 3。A 在原点左边 1 格，底还要加 1，是 4。"]}, {"id": "m066", "kp": "数学/勾股定理/勾股定理与面积", "q": "直角三角形的两条直角边分别是 5 和 12，斜边是", "opts": ["13", "17", "√119", "60"], "exp": "c²＝5²＋12²＝25＋144＝169，c＝13。", "need": null, "fig": "rt512", "more": "用勾股定理：直角三角形两条直角边的平方和，等于斜边的平方，a²＋b²＝c²。代入：c²＝5²＋12²＝25＋144＝169。哪个正数的平方是 169？13×13＝169，所以 c＝√169＝13。记住：5、12、13 是一组常见的勾股数。", "why": ["17 是 5＋12。斜边不是两条直角边直接相加，要先平方、再相加、再开方。", "√119 是 12²－5²＝144－25，把 12 当成了斜边。5 和 12 都是直角边，平方要相加。", "60 是 5×12，那是两条直角边的乘积（面积的 2 倍），不是斜边。"]}, {"id": "m067", "kp": "数学/勾股定理/勾股定理与面积", "q": "下列各组数中，能作为直角三角形三边长的是", "opts": ["8、15、17", "4、5、6", "2、3、4", "5、6、7"], "exp": "8²＋15²＝64＋225＝289＝17²，满足勾股定理的逆定理。其余三组都不满足。", "need": null, "more": "用勾股定理的逆定理：较短两边的平方和等于最长边的平方，就是直角三角形。逐个算：8²＋15²＝64＋225＝289，17²＝289，相等 ✓。4²＋5²＝41，6²＝36，不等；2²＋3²＝13，4²＝16，不等；5²＋6²＝61，7²＝49，不等。所以选 8、15、17。", "why": ["4²＋5²＝16＋25＝41，6²＝36，不相等。三个连着的整数不一定行，3、4、5 只是特例。", "2²＋3²＝4＋9＝13，4²＝16，不相等，所以不是直角三角形。", "5²＋6²＝25＋36＝61，7²＝49，不相等，所以不是直角三角形。"]}, {"id": "m068", "kp": "数学/勾股定理/勾股定理与面积", "q": "直角三角形的两条直角边分别是 3 和 4，它的面积是", "opts": ["6", "12", "10", "7.5"], "exp": "直角三角形的面积＝两条直角边的乘积÷2＝3×4÷2＝6。不要用斜边 5 去算。", "need": null, "fig": "rt34", "more": "直角三角形里，两条直角边互相垂直，一条当底，另一条就是高。所以面积＝两条直角边相乘÷2＝3×4÷2＝6。斜边是 5，但斜边上的高既不是 3 也不是 4，所以不能拿 5 去乘。记住一句话：直角三角形的面积，用两条直角边算。", "why": ["12 是 3×4，忘了除以 2。三角形面积要“÷2”。", "10 是 4×5÷2，用了斜边 5。斜边和直角边 4 不垂直，4 不是斜边上的高。", "7.5 是 3×5÷2，用了斜边 5。斜边和 3 不垂直，不能这样算。"]}, {"id": "m069", "kp": "数学/实数/规律探究与分母有理化", "q": "把 2/√2 化简，结果是", "opts": ["√2", "2√2", "√2/2", "1"], "exp": "分子分母同乘 √2：2√2/2＝√2。", "need": null, "more": "分母里有根号，要“分母有理化”：分子、分母同时乘分母里的 √2，分数的值不变。分母：√2×√2＝2；分子：2×√2＝2√2。得到 2√2/2，分子分母都约掉 2，结果是 √2。验算：√2×√2＝2，所以 2÷√2＝√2 ✓。", "why": ["分子乘了 √2，可分母也变成了 2，还要再除以 2：2√2/2＝√2。", "√2/2 是 1/√2 化简的结果，分子、分母弄反了。2/√2 比 1 大，√2/2 比 1 小。", "1 是把 √2 当成 2 来约分了。√2 约等于 1.414，不等于 2。"]}, {"id": "m070", "kp": "数学/实数/规律探究与分母有理化", "q": "把 1/(√3－√2) 化简，结果是", "opts": ["√3＋√2", "√3－√2", "(√3＋√2)/5", "1"], "exp": "分子分母同乘 (√3＋√2)，分母＝3－2＝1，结果是 √3＋√2。", "need": null, "more": "分母是 √3－√2，就给分子、分母同乘 √3＋√2。分母用平方差公式：(√3－√2)(√3＋√2)＝(√3)²－(√2)²＝3－2＝1。分子：1×(√3＋√2)＝√3＋√2。分母是 1，所以结果就是 √3＋√2。记住一句话：分母是“√a－√b”，就乘“√a＋√b”。", "why": ["√3－√2 是原来的分母。1/(√3－√2) 是它的倒数，不等于它本身。", "分母算成了 3＋2＝5。平方差公式是相减：(√3)²－(√2)²＝3－2＝1。", "分母是 1 没错，但分子是 √3＋√2，不是 1。结果是 √3＋√2。"]}, {"id": "m071", "kp": "数学/实数/规律探究与分母有理化", "q": "把 6/√3 化简，结果是", "opts": ["2√3", "6√3", "√3/2", "3√3"], "exp": "分子分母同乘 √3：6√3/3＝2√3。", "need": null, "more": "分母有理化：分子、分母同乘 √3。分母：√3×√3＝3；分子：6×√3＝6√3。得到 6√3/3，再约分：6÷3＝2，结果是 2√3。验算：2√3×√3＝2×3＝6，说明 6÷√3＝2√3 ✓。记住：分母乘完变成 3，最后一定要约分。", "why": ["6√3 只乘了分子，没有除以分母 3。应该是 6√3/3＝2√3。", "√3/2 还不到 1，而 6÷√3 大约是 6÷1.73，比 3 还大，所以不对。", "3√3 是把 6√3 除以 2 了。√3×√3＝3，分母是 3，要除以 3。"]}, {"id": "m072", "kp": "数学/实数/规律探究与分母有理化", "q": "计算 1/(√2＋1)＋1/(√3＋√2) 的结果是", "opts": ["√3－1", "√3＋1", "√3－√2", "2"], "exp": "第一项＝√2－1，第二项＝√3－√2，相加时 √2 抵消，得 √3－1。", "need": null, "more": "两项分别分母有理化。第一项 1/(√2＋1)，分子分母同乘 (√2－1)，分母＝2－1＝1，得 √2－1。第二项 1/(√3＋√2)，同乘 (√3－√2)，分母＝3－2＝1，得 √3－√2。相加：(√2－1)＋(√3－√2)＝√3－1，中间的 √2 和 －√2 抵消了。", "why": ["符号错了。第一项是 √2－1，带着 －1，加起来是 √3－1，不是 ＋1。", "√3－√2 只是第二项的结果，漏加了第一项 √2－1。", "2 可能是把每一项都当成了 1。其实第一项 √2－1 约等于 0.414，不是 1。"]}, {"id": "m073", "kp": "数学/方程组/方程的解的含义", "q": "已知 x＝2，y＝1 是方程 ax－y＝5 的解，则 a 的值是", "opts": ["3", "2", "6", "－3"], "exp": "把解代入：2a－1＝5，2a＝6，a＝3。", "need": null, "more": "“x＝2，y＝1 是方程的解”，意思是把它们代进去，等式成立。代入 ax－y＝5：a×2－1＝5，即 2a－1＝5。移项：2a＝5＋1＝6。两边除以 2：a＝3。验算：3×2－1＝5 ✓。记住一句话：知道解求字母，就把解代进去，变成只含这个字母的方程。", "why": ["移项没变号，算成了 2a＝5－1＝4。－1 移到右边要变成 ＋1：2a＝6。", "6 是 2a 的值，还要两边除以 2，a＝3。", "代回检验：(－3)×2－1＝－7≠5。2a＝6 时 a 是正的 3。"]}, {"id": "m074", "kp": "数学/方程组/方程的解的含义", "q": "下列哪一组数是方程组 x＋y＝4，x－y＝2 的解？", "opts": ["x＝3，y＝1", "x＝1，y＝3", "x＝2，y＝2", "x＝4，y＝0"], "exp": "两个方程都要代：3＋1＝4 ✓，3－1＝2 ✓。其他几组只满足第一个方程，不满足第二个。", "need": null, "more": "方程组的解必须让两个方程同时成立，所以每一组数都要代进两个方程去验。x＝3，y＝1：3＋1＝4 ✓，3－1＝2 ✓。", "why": ["1＋3＝4 ✓，但 1－3＝－2，不是 2。x 和 y 放反了。", "2＋2＝4 ✓，但 2－2＝0，不是 2。", "4＋0＝4 ✓，但 4－0＝4，不是 2。"]}, {"id": "m075", "kp": "数学/方程组/方程的解的含义", "q": "二元一次方程 x＋y＝5 的解有", "opts": ["无数组", "1 组", "2 组", "5 组"], "exp": "一个二元一次方程有无数组解：x 每取一个值，y 就有一个对应的值。", "need": null, "more": "x＋y＝5 有两个未知数，却只有一个方程，管不住两个数。x 随便取一个值，y 就跟着定下来：x＝0，y＝5；x＝1，y＝4；x＝0.5，y＝4.5；x＝－1，y＝6……x 能取的数有无穷多个，所以解有无数组。记住一句话：一个二元一次方程有无数组解；两个方程组成方程组，才通常只有一组解。", "why": ["只有一组解的通常是“二元一次方程组”（两个方程）。单独一个方程有无数组解。", "没有规定只能有 2 组。x 可以取任何数，每取一个就多一组解。", "不止 5 组。x 还能取小数和负数，比如 x＝0.5，y＝4.5，所以有无数组。"]}, {"id": "m076", "kp": "数学/方程组/方程的解的含义", "q": "已知 x＝－1，y＝2 是方程 3x＋my＝1 的解，则 m 的值是", "opts": ["2", "－1", "1", "－2"], "exp": "代入：3×(－1)＋2m＝1，－3＋2m＝1，m＝2。代入负数要加括号。", "need": null, "more": "把解代入方程，负数要加括号：3×(－1)＋m×2＝1，即 －3＋2m＝1。移项，－3 移到右边变成 ＋3：2m＝1＋3＝4。两边除以 2：m＝2。验算：3×(－1)＋2×2＝－3＋4＝1 ✓。记住一句话：代入负数要加括号，移项要变号。", "why": ["移项没变号：2m＝1－3＝－2，m＝－1。－3 移到右边要变成 ＋3：2m＝4。", "可能漏了 3x 里的 3，算成 －1＋2m＝1。代回检验：3×(－1)＋2×1＝－1≠1。", "代回检验：3×(－1)＋(－2)×2＝－7≠1。正确的是 2m＝4，m＝2。"]}, {"id": "m077", "kp": "数学/方程组/方程的解的含义", "q": "下列哪一组数不是方程 x＋2y＝7 的解？", "opts": ["x＝2，y＝3", "x＝1，y＝3", "x＝3，y＝2", "x＝5，y＝1"], "exp": "逐个代入：2＋2×3＝8≠7，所以它不是解。其余三组代入都等于 7。", "need": null, "more": "判断一组数是不是方程的解，就把它代进去，看左边是不是等于 7。注意 y 前面有 2，要乘 2。x＝2，y＝3：2＋2×3＝8≠7，不是解。x＝1，y＝3：1＋6＝7 ✓；x＝3，y＝2：3＋4＝7 ✓；x＝5，y＝1：5＋2＝7 ✓。题目问“不是解”的，所以选 x＝2，y＝3。", "why": ["代入：1＋2×3＝7，等式成立，它是解。题目问的是“不是”解的那一组。", "代入：3＋2×2＝7，等式成立，它是解。别忘了 y 要乘 2。", "代入：5＋2×1＝7，等式成立，它是解，所以不能选。"]}, {"id": "m078", "kp": "数学/方程组/解方程组（代入、加减）", "q": "方程组 y＝2x，x＋y＝9 的解是", "opts": ["x＝3，y＝6", "x＝6，y＝3", "x＝2，y＝4", "x＝4.5，y＝4.5"], "exp": "把 y＝2x 代入 x＋y＝9：3x＝9，x＝3，y＝6。", "need": null, "more": "用代入消元法：第一个方程已经告诉我们 y＝2x，就把 x＋y＝9 里的 y 换成 2x：x＋2x＝9，3x＝9，x＝3。再把 x＝3 代回 y＝2x：y＝2×3＝6。验算：6＝2×3 ✓，3＋6＝9 ✓。记住一句话：方程组的解要同时满足两个方程。", "why": ["x、y 写反了。检验 y＝2x：3＝2×6 不成立。", "它满足 y＝2x，但 2＋4＝6≠9，不满足第二个方程。", "它满足 x＋y＝9，但 4.5≠2×4.5，不满足 y＝2x。"]}, {"id": "m079", "kp": "数学/方程组/解方程组（代入、加减）", "q": "方程组 2x＋y＝7，x－y＝2 的解是", "opts": ["x＝3，y＝1", "x＝1，y＝3", "x＝2，y＝3", "x＝3，y＝－1"], "exp": "两式相加消去 y：3x＝9，x＝3；代入 x－y＝2 得 y＝1。验算：2×3＋1＝7 ✓。", "need": null, "more": "用加减消元法：两个方程里 y 的系数是 ＋1 和 －1，相加正好消掉 y。(2x＋y)＋(x－y)＝7＋2，得 3x＝9，x＝3。再代入 x－y＝2：3－y＝2，y＝1。验算：2×3＋1＝7 ✓，3－1＝2 ✓。所以解是 x＝3，y＝1。", "why": ["x、y 写反了。检验第一个方程：2×1＋3＝5≠7。", "它满足 2×2＋3＝7，但 2－3＝－1≠2，不满足第二个方程。", "解 3－y＝2 时符号错了：－y＝－1，所以 y＝1。检验：3－(－1)＝4≠2。"]}, {"id": "m080", "kp": "数学/方程组/解方程组（代入、加减）", "q": "解方程组 3x＋2y＝8 ①，x－2y＝4 ②，①＋② 得", "opts": ["4x＝12", "2x＝12", "4x＝4", "4x－4y＝12"], "exp": "y 的系数是 2 和 －2，互为相反数，相加消去 y：3x＋x＝8＋4，即 4x＝12。", "need": null, "more": "①＋② 就是左边加左边、右边加右边。左边：(3x＋2y)＋(x－2y)＝3x＋x＋2y－2y＝4x，因为 2y 和 －2y 互为相反数，加起来是 0，y 被消掉了。右边：8＋4＝12。所以得 4x＝12。记住一句话：系数互为相反数就相加，系数相同就相减。", "why": ["左边 x 的部分是 3x＋x＝4x，不是 3x－x＝2x。是相加，不是相减。", "右边也要相加：8＋4＝12，不是 8－4＝4。", "2y＋(－2y)＝0，y 正好被消掉了，不会剩下 －4y。"]}, {"id": "m081", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 200 元，打九折后的价格是", "opts": ["180 元", "191 元", "20 元", "110 元"], "exp": "打九折就是乘 0.9：200×0.9＝180 元。", "need": null, "more": "“打几折”就是按原价的十分之几卖。打九折＝原价×90%＝原价×0.9。所以 200×0.9＝180（元）。也可以这样想：便宜了 10%，200×0.1＝20 元，200－20＝180 元。记住一句话：打九折是乘 0.9，不是减 9。", "why": ["191 是 200－9，把“九折”当成了减 9 元。打九折是乘 0.9。", "20 元是便宜掉的钱（200×0.1），不是打折后的价格。", "110 是 200－90，把九折当成了减 90 元。应该是 200×0.9＝180。"]}, {"id": "m082", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 x 元，降价 20% 后是 160 元，可列方程", "opts": ["0.8x＝160", "x－20＝160", "0.2x＝160", "1.2x＝160"], "exp": "降价 20% 后是原价的 80%：0.8x＝160。百分数用乘，不是直接减 20。", "need": null, "more": "降价 20%，是降了原价的 20%，也就是降了 0.2x 元。剩下的是 x－0.2x＝0.8x，即原价的 80%。现价是 160 元，所以列方程 0.8x＝160（解得 x＝200）。记住一句话：降价 a%，现价＝原价×(1－a%)；涨价 a%，现价＝原价×(1＋a%)。", "why": ["降价 20% 不是降 20 元。百分数要乘原价：降了 0.2x 元。", "0.2x 是降掉的钱，不是降价后的价格。降价后剩 0.8x。", "1.2x 是涨价 20% 以后的价格。降价要用 1－20%＝0.8。"]}, {"id": "m083", "kp": "数学/方程组/调价、百分率应用题", "q": "甲商品原价 x 元，涨价 10%；乙商品原价 y 元，降价 5 元。调价后两件商品共 100 元，可列方程", "opts": ["1.1x＋(y－5)＝100", "(x＋10)＋(y－5)＝100", "1.1x＋0.95y＝100", "0.1x＋(y－5)＝100"], "exp": "涨 10% 是乘 1.1；降 5 元是减 5。百分数用乘，具体钱数用加减。", "need": null, "more": "两件商品分开看。甲：涨价 10%，新价格＝x×(1＋10%)＝1.1x。乙：降价 5 元，是具体的钱数，直接减：y－5。两件加起来是 100 元：1.1x＋(y－5)＝100。记住一句话：百分数用乘，具体钱数用加减。", "why": ["涨价 10% 不是涨 10 元。10% 要乘原价，新价格是 1.1x。", "乙降的是 5 元，不是 5%。具体的钱数直接减：y－5。", "0.1x 只是甲涨的那部分钱，新价格是 x＋0.1x＝1.1x。"]}, {"id": "m084", "kp": "数学/方程组/购买与利润应用题", "q": "买甲、乙两种笔记本共 20 本，共花 110 元。甲每本 5 元，乙每本 6 元。设甲买 x 本、乙买 y 本，方程组是", "opts": ["x＋y＝20，5x＋6y＝110", "x＋y＝110，5x＋6y＝20", "x＋y＝20，6x＋5y＝110", "x＋y＝20，11(x＋y)＝110"], "exp": "一个方程管数量：x＋y＝20；一个方程管钱：5x＋6y＝110。", "need": null, "more": "这类题要找两个等量关系：一个管“数量”，一个管“钱”。数量：甲的本数＋乙的本数＝20，即 x＋y＝20。钱：甲每本 5 元，买 x 本花 5x 元；乙每本 6 元，买 y 本花 6y 元，一共 110 元，所以 5x＋6y＝110。合起来就是 x＋y＝20，5x＋6y＝110。", "why": ["把 20 和 110 弄反了。20 是本数，110 是钱数，x＋y 应该等于本数 20。", "单价配错了。甲是 x 本、每本 5 元，要写 5x；乙要写 6y。", "11(x＋y) 相当于每本都是 11 元。两种本子单价不同，要分开乘：5x＋6y。"]}, {"id": "m085", "kp": "数学/方程组/购买与利润应用题", "q": "鸡兔同笼，共有 10 个头、28 只脚。鸡有", "opts": ["6 只", "4 只", "7 只", "5 只"], "exp": "设鸡 x 只、兔 y 只：x＋y＝10，2x＋4y＝28。解得 x＝6，y＝4。题目问的是鸡，答 6 只。", "need": null, "more": "设鸡 x 只、兔 y 只。头：每只一个头，x＋y＝10。脚：鸡 2 只脚、兔 4 只脚，2x＋4y＝28。第一个方程两边乘 2：2x＋2y＝20，用第二个减它：2y＝8，y＝4。再代回：x＝10－4＝6。验算：6×2＋4×4＝12＋16＝28 ✓。题目问鸡，答 6 只。", "why": ["4 只是兔的只数。题目问的是鸡，要看清问的是谁。", "鸡 7 只、兔 3 只，脚是 7×2＋3×4＝26 只，不是 28 只。", "鸡、兔各 5 只，脚是 5×2＋5×4＝30 只，不是 28 只。"]}, {"id": "m086", "kp": "数学/方程组/购买与利润应用题", "q": "甲种商品每件利润 5 元，乙种商品每件利润 8 元，卖出甲 10 件、乙 20 件，总利润是", "opts": ["210 元", "390 元", "130 元", "260 元"], "exp": "分开算再相加：5×10＋8×20＝50＋160＝210 元。", "need": null, "more": "两种商品每件利润不一样，要分开算再相加。甲：每件 5 元，卖 10 件，利润 5×10＝50 元。乙：每件 8 元，卖 20 件，利润 8×20＝160 元。总利润＝50＋160＝210 元。记住一句话：单价不同的东西，各算各的，最后再加起来。", "why": ["390 是 (5＋8)×(10＋20)＝13×30，把利润和件数都混在一起乘了。", "130 是 (5＋8)×10，把乙也当成只卖了 10 件。乙卖了 20 件，要分开算。", "260 是 (5＋8)×20，把甲也当成卖了 20 件。甲只卖了 10 件。"]}, {"id": "m087", "kp": "数学/方程组/购买与利润应用题", "q": "买 2 支铅笔和 1 块橡皮共 5 元，买 1 支铅笔和 1 块橡皮共 3 元。一支铅笔的价格是", "opts": ["2 元", "1 元", "3 元", "1.5 元"], "exp": "设铅笔 x 元、橡皮 y 元：2x＋y＝5，x＋y＝3。两式相减得 x＝2。", "need": null, "more": "设铅笔每支 x 元，橡皮每块 y 元：2x＋y＝5 ①，x＋y＝3 ②。y 的系数相同，用 ①－② 消掉 y：(2x＋y)－(x＋y)＝5－3，得 x＝2。也可以这样想：两次买的东西只差 1 支铅笔，钱差 5－3＝2 元，所以一支铅笔 2 元。橡皮是 3－2＝1 元。", "why": ["1 元是橡皮的价格（y＝3－2＝1）。题目问的是铅笔。", "3 元是 1 支铅笔加 1 块橡皮一共的钱，不是一支铅笔的价格。", "1.5 元是把 3 元平均分了，可铅笔和橡皮价格不一样。检验：2×1.5＋1.5＝4.5≠5。"]}, {"id": "m088", "kp": "数学/方程组/购买与利润应用题", "q": "40 名同学去划船，大船每条坐 6 人，小船每条坐 4 人，共租了 8 条船，每条船都坐满。大船租了", "opts": ["4 条", "6 条", "2 条", "5 条"], "exp": "设大船 x 条、小船 y 条：x＋y＝8，6x＋4y＝40。解得 x＝4，y＝4。", "need": null, "more": "设大船 x 条、小船 y 条。船数：x＋y＝8。人数：大船坐 6 人、小船坐 4 人，6x＋4y＝40。第一个方程乘 4：4x＋4y＝32，用第二个减它：2x＝8，x＝4。小船 y＝8－4＝4。验算：4×6＋4×4＝24＋16＝40 ✓。所以大船租了 4 条。", "why": ["大船 6 条、小船 2 条，能坐 6×6＋2×4＝44 人，不是 40 人。", "大船 2 条、小船 6 条，能坐 2×6＋6×4＝36 人，不是 40 人。", "大船 5 条、小船 3 条，能坐 5×6＋3×4＝42 人，不是 40 人。"]}, {"id": "m089", "kp": "数学/方程组/方程组与一次函数图像", "q": "二元一次方程 x＋y＝3 对应的一次函数是", "opts": ["y＝－x＋3", "y＝x＋3", "y＝x－3", "y＝－x－3"], "exp": "把 x 移到右边：y＝－x＋3。", "need": "第5章 二元一次方程与一次函数", "more": "把二元一次方程写成一次函数，就是变成“y＝……”的样子，把 y 单独留在左边。x＋y＝3，把 x 从左边移到右边，移项要变号：y＝3－x，再按习惯写成 y＝－x＋3。检验：x＝1 时 y＝2，1＋2＝3 ✓。记住一句话：移项要变号。", "why": ["移项时 x 没变号。x 从左边移到右边要变成 －x。", "x 和 3 的符号都弄反了。应是 y＝3－x，也就是 y＝－x＋3。", "3 本来就在右边，没有移动，不用变号，还是 ＋3。只有 x 移项要变号。"]}, {"id": "m090", "kp": "数学/方程组/方程组与一次函数图像", "q": "直线 y＝2x 与直线 y＝x＋2 的交点坐标是", "opts": ["(2, 4)", "(4, 2)", "(2, 2)", "(1, 2)"], "exp": "联立：2x＝x＋2，x＝2，y＝4。交点 (2, 4)，横坐标写在前面。", "need": "第5章 二元一次方程与一次函数", "fig": "twolines_24", "more": "两条直线的交点同时在两条直线上，所以它的坐标要同时满足两个式子。两个式子的 y 相等：2x＝x＋2，移项得 x＝2。再代入 y＝2x：y＝2×2＝4。交点是 (2, 4)。检验另一条：2＋2＝4 ✓。记住一句话：坐标是横坐标在前、纵坐标在后。", "why": ["横、纵坐标写反了。x＝2 写在前面，y＝4 写在后面：(2, 4)。", "x＝2 求对了，但没算 y。要把 x＝2 代入 y＝2x，得 y＝4。", "(1, 2) 只在 y＝2x 上；代入 y＝x＋2：1＋2＝3≠2，不在第二条直线上。"]}, {"id": "m091", "kp": "数学/勾股定理/弦图", "q": "弦图由四个全等的直角三角形围成。若每个直角三角形的两条直角边分别是 3 和 4，则大正方形的面积是", "opts": ["25", "49", "12", "7"], "exp": "大正方形的边长是直角三角形的斜边 c，面积＝c²＝3²＋4²＝25。", "need": null, "fig": "xiantu_q", "more": "看图：大正方形的每条边，正好是一个直角三角形的斜边 c，所以大正方形的面积＝c²。用勾股定理：c²＝a²＋b²＝3²＋4²＝9＋16＝25。也可以用拼图来算：4 个三角形面积是 4×(3×4÷2)＝24，中间小正方形边长 4－3＝1，面积是 1，加起来 24＋1＝25。", "why": ["49 是 (3＋4)²，把大正方形的边长当成了 3＋4。这张弦图里大正方形的边长是斜边 c。", "12 是 3×4，只是两个三角形的面积，不是整个大正方形。", "7 是 3＋4，既不是边长也不是面积。面积是边长的平方：c²＝25。"]}, {"id": "m092", "kp": "数学/勾股定理/弦图", "q": "弦图中每个直角三角形的两条直角边分别是 5 和 12，则中间小正方形的面积是", "opts": ["49", "7", "169", "60"], "exp": "小正方形的边长＝12－5＝7，面积＝7²＝49。7 是边长，不是面积。", "need": null, "fig": "xiantu_q", "more": "弦图是 4 个一样的直角三角形围着中间一个小正方形。小正方形的边长＝长直角边－短直角边＝12－5＝7，面积＝7²＝49。也可以用面积验算：大正方形面积＝斜边²＝5²＋12²＝169，4 个三角形面积＝4×(½×5×12)＝120，小正方形＝169－120＝49，两种算法结果一样。", "why": ["7 是小正方形的边长（12－5），题目问的是面积，还要再平方：7²＝49。", "169 是大正方形的面积（5²＋12²），还要减去 4 个三角形的面积 120。", "60 是 5×12，是两个直角三角形拼起来的面积，不是小正方形的面积。"]}, {"id": "m093", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 13，小正方形的面积是 1。设直角三角形的两条直角边为 a、b，则 (a＋b)² 的值是", "opts": ["25", "14", "12", "5"], "exp": "a²＋b²＝13；四个三角形面积之和 2ab＝13－1＝12。所以 (a＋b)²＝a²＋b²＋2ab＝13＋12＝25。", "need": null, "fig": "xiantu_q", "more": "大正方形的边长是斜边 c，所以 a²＋b²＝c²＝13。大正方形＝4 个直角三角形＋中间的小正方形，所以 4 个三角形的面积＝13－1＝12。每个三角形面积是 ab÷2，4 个就是 2ab，所以 2ab＝12。再用完全平方公式：(a＋b)²＝a²＋2ab＋b²＝13＋12＝25。", "why": ["14 是 13＋1，把小正方形的面积加上去了。应该加的是 2ab＝12。", "12 只是 2ab，还要加上 a²＋b²＝13，得 25。", "5 是 a＋b 的值（因为 5²＝25），题目问的是 (a＋b)²。"]}, {"id": "m094", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 25，每个直角三角形的面积是 6，则小正方形的面积是", "opts": ["1", "19", "13", "4"], "exp": "小正方形面积＝大正方形面积－四个三角形面积＝25－4×6＝1。", "need": null, "fig": "xiantu_q", "more": "弦图是 4 个一样的直角三角形围着中间一个小正方形，拼成一个大正方形。所以：大正方形＝4 个三角形＋小正方形。小正方形＝25－4×6＝25－24＝1。", "why": ["19 是 25－6，只减了 1 个三角形，一共有 4 个。", "13 不对：要减去 4 个三角形的面积 24。", "4 是三角形的个数，不是面积。"]}, {"id": "m095", "kp": "数学/勾股定理/弦图", "q": "弦图中，直角三角形的两条直角边是 a、b。已经算出 (a＋b)²＝49，则 a＋b 的值是", "opts": ["7", "49", "14", "24.5"], "exp": "(a＋b)² 是 49，所以 a＋b＝√49＝7。要分清“平方”和“它本身”。", "need": null, "fig": "xiantu_q", "more": "题目给的是 (a＋b) 的平方等于 49，问的是 a＋b 本身。哪个正数的平方是 49？是 7。因为 a、b 都是正数，所以 a＋b＝7。", "why": ["49 是 (a＋b)²，不是 a＋b。", "14 是 7×2，把“平方”当成“乘 2”了。", "24.5 是 49÷2。开平方不是除以 2。"]}, {"id": "m096", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 100，小正方形的面积是 4，则每个直角三角形的面积是", "opts": ["24", "96", "48", "26"], "exp": "四个三角形面积之和＝100－4＝96，每个是 96÷4＝24。", "need": null, "fig": "xiantu_q", "more": "大正方形＝4 个三角形＋小正方形。4 个三角形一共 100－4＝96，每个是 96÷4＝24。", "why": ["96 是 4 个三角形的总面积，还要除以 4。", "48 是 96÷2，三角形有 4 个，要除以 4。", "26 不对：先 100－4＝96，再 96÷4＝24。"]}, {"id": "m097", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(1, 3)、B(3, 1)。直线 y＝x＋b 与线段 AB 有公共点，则 b 的取值范围是", "opts": ["－2≤b≤2", "－2＜b＜2", "b≥－2", "b≤2"], "exp": "过 A：3＝1＋b，b＝2；过 B：1＝3＋b，b＝－2。范围在两个值之间，端点也算公共点，所以带等号：－2≤b≤2。", "need": null, "more": "直线 y＝x＋b 随着 b 变化会上下平移。先求两个“临界”位置：经过 A(1, 3)：3＝1＋b，b＝2；经过 B(3, 1)：1＝3＋b，b＝－2。直线在这两个位置之间平移时都能碰到线段 AB，而经过端点也算有公共点，所以要带等号：－2≤b≤2。", "why": ["漏了等号。经过端点 A 或 B 时也有公共点，b＝2、b＝－2 都可以。", "b＞2 时直线跑到 A 的上方，碰不到线段。b 最大只能到 2。", "b＜－2 时直线跑到 B 的下方，碰不到线段。b 最小只能到 －2。"]}, {"id": "m098", "kp": "数学/一次函数/直线与线段有公共点", "q": "直线恰好经过线段的一个端点，这时直线与线段", "opts": ["有公共点，所以范围两边要写“≤”", "没有公共点，所以范围两边写“＜”", "有两个公共点", "无法判断有没有公共点"], "exp": "端点是线段的一部分，经过端点就是有公共点。所以答案写 ≤，不要漏等号。", "need": null, "more": "线段包括它的两个端点。直线经过线段的一个端点，这个端点就同时在直线上和线段上，所以有公共点。因此求“有公共点”的范围时，端点对应的那个值也要算进去，两边写“≤”。记住一句话：端点也是线段上的点，别漏了等号。", "why": ["端点是线段的一部分，经过端点就有公共点，所以要写“≤”。", "直线只经过一个端点，只有这一个公共点，不是两个。", "可以判断：端点就在线段上，直线经过它，一定有公共点。"]}, {"id": "m099", "kp": "数学/一次函数/直线与线段有公共点", "q": "直线 y＝2x＋b 经过点 A(1, 4) 时，b 的值是", "opts": ["2", "6", "－2", "3"], "exp": "把 A 代入：4＝2×1＋b，b＝2。", "need": null, "more": "直线经过点 A，意思是把 A 的坐标代进去，等式成立。A(1, 4) 表示 x＝1、y＝4。代入 y＝2x＋b：4＝2×1＋b，即 4＝2＋b。移项：b＝4－2＝2。验算：2×1＋2＝4 ✓。记住一句话：点在直线上，就把点的坐标代入解析式。", "why": ["6 是 4＋2，移项没变号。从 4＝2＋b 得 b＝4－2＝2。", "－2 是 2－4，减反了。应该是 b＝4－2＝2。", "3 是 4－1，忘了 x 前面的 2。2x 要算成 2×1＝2。"]}, {"id": "m100", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(1, 3)、B(3, 1)。直线 y＝kx 与线段 AB 有公共点，则 k 的取值范围是", "opts": ["1/3≤k≤3", "1/3＜k＜3", "k≥3", "1≤k≤3"], "exp": "过 A：3＝k，k＝3；过 B：1＝3k，k＝1/3。范围在两个值之间并带等号，小的写左边：1/3≤k≤3。", "need": null, "more": "直线 y＝kx 一定经过原点，k 变化时它绕着原点转。先求两个临界位置：过 A(1, 3)：3＝k×1，k＝3；过 B(3, 1)：1＝3k，k＝1/3。直线在这两个位置之间转动时都能碰到线段 AB，端点也算，所以带等号。小的数写左边：1/3≤k≤3。", "why": ["漏了等号。直线经过端点 A 或 B 时也有公共点。", "k＞3 时直线比 OA 还陡，碰不到线段 AB；而且漏掉了 1/3 这一端。", "过 B 时 1＝3k，k＝1/3，不是 1。1/3 比 1 小，范围要从 1/3 开始。"]}, {"id": "m101", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(0, 2)、B(4, 2)。直线 y＝－x＋b 与线段 AB 有公共点，则 b 的取值范围是", "opts": ["2≤b≤6", "2＜b＜6", "－2≤b≤2", "b≤6"], "exp": "过 A：2＝0＋b，b＝2；过 B：2＝－4＋b，b＝6。所以 2≤b≤6。", "need": null, "more": "分别把两个端点代入 y＝－x＋b。过 A(0, 2)：2＝－0＋b，b＝2；过 B(4, 2)：2＝－4＋b，移项 b＝2＋4＝6。直线在这两个位置之间平移时都和线段 AB 有公共点，端点也算，所以带等号：2≤b≤6。", "why": ["漏了等号。直线经过端点 A 或 B 时也有公共点。", "过 B 时算错了：2＝－4＋b，b＝2＋4＝6，不是 －2。可能把 －x 当成了 x。", "b＜2 时直线在线段下方，碰不到线段，所以还要有 b≥2。"]}, {"id": "m102", "kp": "数学/一次函数/直线与线段有公共点", "q": "求“直线与线段 AB 有公共点时 b 的范围”，第一步应该", "opts": ["把 A、B 两个端点分别代入直线，各求出一个 b 的值", "只把线段的中点代入直线", "令 x＝0 求出 b", "先求线段 AB 的长度"], "exp": "两个端点各代一次，得到 b 的两个值，范围就在这两个值之间（带等号）。", "need": null, "more": "直线和线段有公共点，范围的两个“边界”，就是直线刚好经过两个端点的时候。所以第一步：把 A 的坐标代入直线，求出一个 b；再把 B 的坐标代入，求出另一个 b。然后范围就在这两个值之间，端点也算，带等号，小的写左边。", "why": ["代入中点只能得到一个 b 的值，那只是其中一种情况，得不到范围。", "令 x＝0 求的是直线和 y 轴的交点，跟线段 AB 没有关系。", "线段的长度和直线能不能碰到线段没有关系，求出来也用不上。"]}, {"id": "m103", "kp": "数学/方程组/问什么答什么", "q": "设去年有 x 人参加，解方程得 x＝200。已知今年比去年多 10%，题目问“今年有多少人参加”，应答", "opts": ["220 人", "200 人", "210 人", "20 人"], "exp": "x 是去年的人数。今年＝200×(1＋10%)＝220 人。解出 x 之后要回头看题目问的是什么。", "need": null, "more": "解方程得到的 x 是你自己“设”的那个量。设的是去年，题目问的是今年，所以还要算一步：200×(1＋10%)＝200×1.1＝220 人。", "why": ["200 是去年的人数，题目问的是今年。", "210 是加了 10 人。多 10% 是多 200×10%＝20 人。", "20 只是多出来的人数，还要加上去年的 200。"]}, {"id": "m104", "kp": "数学/方程组/问什么答什么", "q": "设每桌坐 x 人，共 8 桌且都坐满，解得 x＝6。题目问“一共有多少人”，应答", "opts": ["48 人", "6 人", "8 人", "14 人"], "exp": "x 是每桌的人数，总人数＝6×8＝48 人。", "need": null, "more": "x 是每桌的人数。题目问一共多少人：每桌 6 人，8 桌，6×8＝48 人。", "why": ["6 是每桌的人数（x），不是总人数。", "8 是桌数。", "14 是 6＋8。每桌 6 人、共 8 桌要用乘法。"]}, {"id": "m105", "kp": "数学/方程组/问什么答什么", "q": "每 3 人共用一只饭碗。设饭碗有 x 只，解得 x＝20。题目问“共有多少人”，应答", "opts": ["60 人", "20 人", "23 人", "17 人"], "exp": "x 是饭碗数，人数＝3×20＝60 人。和作业里的“古寺”题一样：解出 x 之后还要再算一步。", "need": null, "more": "x 是饭碗的只数。每 3 个人用一只碗，20 只碗对应 3×20＝60 人。", "why": ["20 是饭碗数（x），题目问的是人数。", "23 是 20＋3。每只碗对应 3 个人，要用乘法。", "17 是 20－3，这里应该用乘法。"]}, {"id": "m106", "kp": "数学/方程组/问什么答什么", "q": "解出方程组之后，接下来最应该做的是", "opts": ["回头读题目的最后一句，看问的是什么，检验后写“答”", "直接把 x、y 的值抄到答的位置", "再列一个方程组", "把 x、y 相加作为答案"], "exp": "应用题六步：审→设→列→解→验→答。问的不一定是 x、y 本身。", "need": null, "more": "应用题六步：审→设→列→解→验→答。解出 x、y 之后，回到题目最后一句看它问的是什么（可能是今年的、总数、另一个量），算出来、检验合理，再写“答”。", "why": ["x、y 是你设的量，题目问的不一定就是它们。", "方程组已经解完了，不需要再列。", "题目没有让把 x、y 相加，要看问的是什么。"]}, {"id": "m107", "kp": "数学/方程组/问什么答什么", "q": "鸡兔同笼，共 8 个头、22 只脚。设鸡 x 只、兔 y 只，题目问“兔有多少只”，应答", "opts": ["3 只", "5 只", "4 只", "6 只"], "exp": "x＋y＝8，2x＋4y＝22，解得 x＝5，y＝3。问的是兔，答 y＝3 只，不要答成鸡的 5 只。", "need": null, "more": "x＋y＝8（头），2x＋4y＝22（脚）。由第一个式子 x＝8－y，代入：2(8－y)＋4y＝22，16＋2y＝22，y＝3，x＝5。x 是鸡，y 是兔，问的是兔：3 只。验算：5×2＋3×4＝22 ✓。", "why": ["5 只是鸡的数量（x），题目问的是兔。", "鸡 4 只、兔 4 只的话脚是 8＋16＝24 只，不是 22。", "兔 6 只、鸡 2 只的话脚是 4＋24＝28 只，不是 22。"]}, {"id": "m108", "kp": "数学/方程组/问什么答什么", "q": "设甲的速度是 x km/h，解得 x＝12。题目问“甲 3 小时走了多少千米”，应答", "opts": ["36 km", "12 km", "4 km", "15 km"], "exp": "x 是速度，路程＝速度×时间＝12×3＝36 km。", "need": null, "more": "x＝12 是速度（每小时走 12 km）。题目问 3 小时走的路程：路程＝速度×时间＝12×3＝36 km。", "why": ["12 是速度，不是路程，而且单位应是 km/h。", "4 是 12÷3。求路程要用乘法。", "15 是 12＋3。速度和时间不能相加。"]}, {"id": "m109", "kp": "数学/勾股定理/全等与勾股综合", "q": "下列条件中，不能判定两个三角形全等的是", "opts": ["两边和其中一边的对角分别相等（SSA）", "三边分别相等（SSS）", "两边和它们的夹角分别相等（SAS）", "两角和它们的夹边分别相等（ASA）"], "exp": "全等的判定有 SSS、SAS、ASA、AAS，直角三角形还有 HL。“边边角”不能判定全等。", "need": null, "more": "能判定全等的：SSS、SAS、ASA、AAS，直角三角形多一个 HL。注意 SAS 的角必须是两条边的“夹角”。如果角是其中一条边的对角（SSA，“边边角”），可以画出两个不同的三角形，所以不能判定。", "why": ["SSS 可以判定全等。", "SAS（两边及夹角）可以判定全等。", "ASA（两角及夹边）可以判定全等。"]}, {"id": "m110", "kp": "数学/勾股定理/全等与勾股综合", "q": "只能用来判定两个直角三角形全等的方法是", "opts": ["HL（斜边和一条直角边分别相等）", "SSS", "SAS", "AAS"], "exp": "HL 是直角三角形特有的判定方法；SSS、SAS、AAS 对所有三角形都适用。", "need": null, "more": "HL 是“斜边、直角边”，只有直角三角形才有斜边，所以它只能用于直角三角形。其他几种方法对任何三角形都能用。", "why": ["SSS 对所有三角形都能用。", "SAS 对所有三角形都能用。", "AAS 对所有三角形都能用。"]}, {"id": "m111", "kp": "数学/勾股定理/全等与勾股综合", "q": "△ABC 中，∠ACB＝90°，AC＝BC。直线 l 经过点 C，A、B 在 l 的同侧，AD⊥l 于 D，BE⊥l 于 E。若 AD＝3，BE＝4，则 DE 的长是", "opts": ["7", "1", "5", "12"], "exp": "“一线三直角”：△ADC≌△CEB（AAS），所以 CD＝BE＝4，CE＝AD＝3，DE＝CD＋CE＝7。", "need": null, "fig": "k3_q", "more": "这是“一线三直角”模型。∠ADC＝∠CEB＝90°，∠DAC 和 ∠ECB 都与 ∠ACD 互余所以相等，再加上 AC＝CB，得 △ADC≌△CEB（AAS）。全等后对应边相等：CD＝BE＝4，CE＝AD＝3。D、E 在 C 的两侧，所以 DE＝CD＋CE＝4＋3＝7。", "why": ["1 是 4－3。A、B 在直线同侧时，D、E 在 C 的两边，要相加。", "5 是 AC 的长（3、4、5），题目问的是 DE。", "12 是 3×4，这里应是 3＋4。"]}, {"id": "m112", "kp": "数学/勾股定理/全等与勾股综合", "q": "△ABC 中，∠ACB＝90°，AC＝BC。直线 l 经过点 C，AD⊥l 于 D，BE⊥l 于 E，AD＝3，BE＝4。则 AC 的长是", "opts": ["5", "7", "25", "√7"], "exp": "△ADC≌△CEB，所以 CD＝BE＝4。在 Rt△ADC 中，AC²＝AD²＋CD²＝9＋16＝25，AC＝5。", "need": null, "fig": "k3_q", "more": "先用全等：△ADC≌△CEB，所以 CD＝BE＝4。再看直角三角形 ADC：两条直角边 AD＝3、CD＝4，斜边 AC²＝3²＋4²＝25，AC＝5。", "why": ["7 是 DE 的长（3＋4），题目问的是 AC。", "25 是 AC²，还要开平方。", "√7 是 4²－3² 再开方。AC 是斜边，应该用加法：3²＋4²。"]}, {"id": "m113", "kp": "数学/勾股定理/全等与勾股综合", "q": "长方形 ABCD 中，AB＝8，BC＝10。点 E 在 CD 上，沿 AE 折叠，使点 D 落在 BC 边上的点 F 处。则 CE 的长是", "opts": ["3", "4", "5", "6"], "exp": "AF＝AD＝10，BF＝√(10²－8²)＝6，FC＝4。设 CE＝x，则 EF＝DE＝8－x。在 Rt△ECF 中：x²＋4²＝(8－x)²，解得 x＝3。", "need": null, "fig": "fold_q", "more": "折叠前后对应的线段相等：AF＝AD＝10，EF＝DE。① 在 Rt△ABF 中：BF＝√(10²－8²)＝6，所以 FC＝10－6＝4。② 设 CE＝x，则 DE＝8－x，EF＝8－x。③ 在 Rt△ECF 中：x²＋4²＝(8－x)²，x²＋16＝64－16x＋x²，16x＝48，x＝3。", "why": ["4 是 FC 的长，不是 CE。", "5 是 DE（也是 EF）的长：8－3＝5。题目问的是 CE。", "6 是 BF 的长，不是 CE。"]}, {"id": "m114", "kp": "数学/勾股定理/全等与勾股综合", "q": "直角三角形的两条直角边分别是 6 和 8，则斜边上的高是", "opts": ["4.8", "5", "10", "2.4"], "exp": "斜边＝10。用面积：½×6×8＝½×10×h，h＝4.8。", "need": null, "more": "先求斜边：√(6²＋8²)＝10。同一个三角形的面积可以用两种方法算：½×6×8＝24，也等于 ½×斜边×斜边上的高＝½×10×h。所以 5h＝24，h＝4.8。", "why": ["5 是斜边的一半，不是斜边上的高。", "10 是斜边的长，不是高。", "2.4 少乘了 2：6×8÷10＝4.8。"]}, {"id": "m115", "kp": "数学/实数/无理数与估算", "q": "下列各数中，是无理数的是", "opts": ["√5", "√9", "22/7", "3.14"], "exp": "先把能算的算出来：√9＝3 是整数；22/7 是分数；3.14 是有限小数，它们都是有理数。√5 开方开不尽，是无理数。", "need": null, "more": "判断无理数分两步。① 先把能算的算出来：√9＝3，是整数。② 再看每个数是哪一类：3（整数）、22/7（分数）、3.14（有限小数）都是有理数；√5 找不到一个数的平方正好是 5（2²＝4，3²＝9），开方开不尽，是无限不循环小数，所以是无理数。", "why": ["√9＝3，开得尽，是整数，不是无理数。带根号不等于无理数，先算一下。", "22/7 是分数，分数都是有理数。它约等于 3.14，但不等于 π。", "3.14 是有限小数，可以写成 314/100，是有理数。π 才是无理数，3.14 只是 π 的近似值。"]}, {"id": "m116", "kp": "数学/实数/无理数与估算", "q": "估计 √19 的值在", "opts": ["4 和 5 之间", "3 和 4 之间", "5 和 6 之间", "18 和 20 之间"], "exp": "找两个相邻的平方数夹住 19：16＜19＜25，开方得 4＜√19＜5。", "need": null, "more": "估算 √19：① 找两个相邻的平方数夹住 19：4²＝16，5²＝25，16＜19＜25。② 开方：√16＜√19＜√25，也就是 4＜√19＜5。③ 再细一点：19 离 16 近（差 3），离 25 远（差 6），所以 √19 约 4.4，偏向 4。", "why": ["3²＝9，4²＝16，3 和 4 之间的数平方后在 9 和 16 之间，19 比 16 大，所以 √19 比 4 大。", "5²＝25，6²＝36，√19 要比 5 大的话 19 得大于 25，不对。", "把 19 本身夹在 18 和 20 之间没有用，要找的是“平方数”16 和 25，再开方。"]}, {"id": "m117", "kp": "数学/实数/无理数与估算", "q": "如图，数轴上 A、B、C、D 四个点中，最可能表示 √7 的是", "opts": ["点 C", "点 B", "点 D", "点 A"], "exp": "4＜7＜9，所以 2＜√7＜3；7 离 9 更近，√7 约是 2.6，在 2 和 3 之间偏右，是点 C。点 A 在原点左边，表示负数。", "need": null, "fig": "irr_est_q", "more": "① 4＜7＜9，开方得 2＜√7＜3，所以 √7 在 2 和 3 之间。② 7 离 9 近（差 2），离 4 远（差 3），√7 偏向 3，约 2.6。③ 看图：在 2 和 3 之间的只有 C（B 在 1 和 2 之间，D 在 3 和 4 之间，A 在 －3 和 －2 之间）。所以是点 C。", "why": ["B 在 1 和 2 之间，表示的数平方后在 1 和 4 之间，比 7 小。", "D 在 3 和 4 之间，表示的数平方后在 9 和 16 之间，比 7 大。", "A 在原点左边，表示负数，约是 －√7，不是 √7。"]}, {"id": "m118", "kp": "数学/实数/无理数与估算", "q": "√10 的整数部分是", "opts": ["3", "10", "4", "5"], "exp": "9＜10＜16，所以 3＜√10＜4，整数部分是 3，小数部分是 √10－3。", "need": null, "more": "① 找两个相邻的平方数夹住 10：3²＝9，4²＝16，9＜10＜16。② 开方：3＜√10＜4。所以 √10＝3.几，整数部分是 3。③ 小数部分＝这个数－整数部分＝√10－3。考试常连着问：“√10 的整数部分是 ＿，小数部分是 ＿”。", "why": ["10 是根号里面的数，不是 √10 的值。√10 只有 3 点多。", "4²＝16 比 10 大，所以 √10 比 4 小，整数部分不会是 4。", "5²＝25，√10 远比 5 小。"]}], "figs": {"figs": {"st": "<span class=\"figbox\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 230 165\" width=\"311\" height=\"223\" font-family=\"'Times New Roman',SimSun,serif\" font-size=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"72.0\" y1=\"135.0\" x2=\"72.0\" y2=\"24.0\" stroke=\"#888\" stroke-width=\"0.4\"/><line x1=\"104.0\" y1=\"135.0\" x2=\"104.0\" y2=\"24.0\" stroke=\"#888\" stroke-width=\"0.4\"/><line x1=\"136.0\" y1=\"135.0\" x2=\"136.0\" =\"40,34 40,130 168,130\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.6\"/><path d=\"M47.0 130.0 L47.0 123.0 L40.0 123.0\" fill=\"none\" stroke=\"#000\" stroke-width=\"1\"/><line x1=\"40.0\" y1=\"130.0\" x2=\"86.1\" y2=\"68.6\" stroke=\"#000\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><path d=\"M91.7 72.8 L87.5 78.4 L81.9 74.2\" fill=\"none\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"28.0\" y=\"86.0\" font-size=\"12\" text-anchor=\"middle\">6</text><text x=\"104.0\" y=\"146.0\" font-size=\"12\" text-anchor=\"middle\">8</text><text x=\"70.0\" y=\"104.0\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">h</text></svg></span>", "profit": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">利润怎么算</b><span style=\"display:block\">每件利润＝售价－进价</span><span style=\"display:block\">总利润＝每件利润×件数</span><span style=\"display:block\">例：进价 15 元，售价 20 元，卖 40 件：</span><span style=\"display:block\">(20－15)×40＝5×40＝200（元）</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 先算“每件赚多少”，再乘件数；不要拿售价直接乘。</span></span>", "solmean": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">“解”的意思：代进去，两边相等</b><span style=\"display:block\">x＝2，y＝－1 是 3x－ay＝8 的解</span><span style=\"display:block\">→ 代入：3×2－a×(－1)＝8</span><span style=\"display:block\">→ 6＋a＝8，a＝2</span><span style=\"display:block\">判断一组数是不是方程组的解：<b>两个方程都要代</b>，都成立才是。</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 代入负数要加括号：－a×(－1)＝＋a。</span></span>", "solve": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">代入法</b><span style=\"display:block\">y＝2x－3 ①　　3x＋2y＝8 ②</span><span style=\"display:block\">把①代入②：3x＋2(2x－3)＝8 → 7x＝14 → x＝2</span><span style=\"display:block\">代回①：y＝2×2－3＝1</span><span style=\"display:block\">验算（代入另一个方程②）：3×2＋2×1＝8 ✓</span></span><span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">加减法</b><span style=\"display:block\">3x＋4y＝10 ①　　5x－2y＝8 ②</span><span style=\"display:block\">②×2（<b>左右两边都乘</b>）：10x－4y＝16 ③</span><span style=\"display:block\">①＋③：13x＝26 → x＝2；代入①：y＝1</span><span style=\"display:block\">验算：5×2－2×1＝8 ✓</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 算出奇怪的分数，多半是哪一步乘漏了或符号错了，回头查。</span></span>", "ask": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">解完方程还没做完</b><span style=\"display:block\">① 设：去年有 x 人</span><span style=\"display:block\">② 解方程：x＝200</span><span style=\"display:block\">③ <b>回头读题目最后一句</b>：问的是“今年有多少人”</span><span style=\"display:block\">④ 再算一步：200×(1＋10%)＝220</span><span style=\"display:block\">⑤ 答：今年有 220 人。</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ x 是你自己设的量，题目问的不一定是它。</span></span>", "price": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14px;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:3px\">调价题：先列“原来 / 调价后”的表</b><table style=\"border-collapse:collapse;width:100%;background:#fff\"><tr> 调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；射向另一侧焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "判断会聚还是发散：把入射光线照原方向延长，折射光比它更靠近主光轴是会聚（凸透镜），更远离是发散（凹透镜）。", "透镜越凸，对光的偏折能力越强，焦距越短。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点：焦点以内的光源经凸透镜后仍散开，但凸透镜仍起会聚作用。凹透镜是“射向另一侧焦点”的光才平行射出。反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。", "已知物 A 和像 A′ 找焦点：从 A 画平行于主光轴的光线交透镜于 P，连 PA′（虚像连虚线再延长），与主光轴的交点就是焦点。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/无理数与估算": {"pts": ["无理数＝无限不循环小数。常见三类：开方开不尽的数（√2、√5、∛3）；含 π 的数（π、π/2）；像 0.1010010001… 这样有规律但不循环的小数。", "判断前先把能算的算出来：√9＝3、∛8＝2、√16＝4 都是整数，是有理数。", "分数、有限小数、循环小数都是有理数：22/7、3.14、0.333… 都不是无理数。", "估算 √a：找两个相邻的平方数夹住 a。9＜10＜16，所以 3＜√10＜4。", "a 离哪个平方数近，√a 就靠近哪个整数：√10 约 3.2，√15 约 3.9。", "√10 的整数部分是 3，小数部分是 √10－3。"], "warn": "22/7 约等于 π，但它是分数，是有理数；带根号的数要先看能不能开得尽。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分步硬算算错了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/坐标系中的面积": {"pts": ["求直线与坐标轴的交点：与 x 轴的交点令 y＝0；与 y 轴的交点令 x＝0。", "求两条直线的交点：把两个表达式联立成方程组。", "三角形面积：选在坐标轴上（或平行于坐标轴）的边做底，高就是第三个顶点到这条轴的距离（坐标的绝对值）。", "没有边在坐标轴上时：用一条竖直或水平的线把它分成两个三角形，或用大图形减去小图形。"], "warn": "期中第 22（2）题：底和高找错。先把三个顶点的坐标都写出来，再选底。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/方程组/方程的解的含义": {"pts": ["二元一次方程的解是一对数 (x, y)，代入后左右两边相等。", "一个二元一次方程有无数个解；方程组的解是两个方程的公共解。", "判断是不是解：分别代入每个方程，都成立才是。", "已知解求字母的值：把解代进去，得到关于这个字母的方程。", "代入负数要加括号：－a×(－1)＝＋a。"], "warn": "只代一个方程成立不算方程组的解，两个都要代。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/解方程组（代入、加减）": {"pts": ["代入法：把一个方程写成 y＝…（或 x＝…），代入另一个方程。适合有系数是 1 或 －1 的情况。", "加减法：让某个未知数的系数相等或相反，相等就相减，相反就相加。", "代入时括号要整个乘开：－2(x－3)＝－2x＋6。", "两个方程相减时，被减的方程每一项都要变号。", "方程两边同乘一个数时，等号右边的常数项也要乘。", "解完把结果代回两个方程各验算一次。"], "warn": "作业第 77 页 3 题：x＝20 时 y 应是 80，写成了 100，代回 x＋y＝100 一验算就能发现。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/问什么答什么": {"pts": ["应用题六步：审 → 设 → 列 → 解 → 验 → 答。", "解出 x、y 之后，回头读题目的最后一句，看问的是什么。", "有时问的不是 x、y 本身：问“今年”的人数而设的是“去年”；问总人数而设的是每桌人数。", "最后必须写“答：……”，带单位。", "设未知数时写清楚 x、y 各代表什么，能避免答错对象。"], "warn": "作业“古寺”题：解出 x＝208、y＝156 就停了，题目问的是僧人数 3×208＝624。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/调价、百分率应用题": {"pts": ["涨（增加）10%：乘以 1.1；降（减少）20%：乘以 0.8；打八折：乘以 0.8。", "涨 5 元：加 5；降 5 元：减 5。百分数用乘，具体的钱数用加减。", "先列表：行写“调整前、调整后”，列写两个对象，每一行得到一个方程。", "“A 比 B 少 10”写成 B－A＝10（大的减小的）。", "解完代回题目验算调整后的关系。"], "warn": "作业第 4 题不会列。不要直接盯着题目列方程，先把表填出来。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/购买与利润应用题": {"pts": ["两个等量关系：一个管“数量”，一个管“钱”。", "数量之和＝总数量：x＋y＝60。", "单价×数量之和＝总价：15x＋24y＝1080。", "求利润：每件利润×件数，两种商品分开算再相加。", "鸡兔同笼也是这一类：头数之和＝总头数，脚数之和＝总脚数。"], "warn": "第（2）问常用到第（1）问的结果，第（1）问算完先验算再往下做。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/方程组与一次函数图像": {"pts": ["每个二元一次方程都对应一条直线，如 x－y＝－1 就是 y＝x＋1。", "方程组的解 ⇔ 两条直线交点的坐标。交点 (2, 3) 对应解 x＝2，y＝3。", "求两条直线的交点：把两个表达式联立成方程组来解。", "两条直线平行（k 相等、b 不等）：方程组无解；两条直线重合：有无数组解。", "看图写解时：横坐标是 x，纵坐标是 y。"], "warn": "图像法得到的解可能只是近似值，题目要求准确时仍要用代入法或加减法。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}}};
