<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>每日练习</title>
<style>
:root { --bg:#f4f5f7; --panel:#fff; --line:#e3e5ea; --text:#1d2330; --mute:#6b7280; --math:#2563eb; --phys:#d97706; --ok:#059669; --bad:#dc2626; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font: 16px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg);
       padding: 0 0 calc(70px + env(safe-area-inset-bottom)); }
main { max-width: 640px; margin: 0 auto; padding: 14px 16px; }
h1 { font-size: 24px; margin: 6px 0 0; }
.sub { color: var(--mute); font-size: 13px; }
.hero { display: flex; align-items: flex-end; gap: 12px; }
.hero > div:first-child { flex: 1; }
.cd { text-align: right; color: var(--mute); font-size: 12px; line-height: 1.3; }
.cd b { font-size: 26px; color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.tag { display: inline-block; font-size: 12px; border-radius: 5px; padding: 0 7px; color: #fff; margin-right: 6px; vertical-align: 1px; }
.tag.数学 { background: var(--math); } .tag.物理 { background: var(--phys); } .tag.其他 { background: var(--mute); }
.dim { color: var(--mute); }
.sheet { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
.btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
a.btn, button.btn { flex: 1; min-width: 96px; text-align: center; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--text);
       border-radius: 10px; padding: 10px 8px; font: inherit; font-size: 15px; cursor: pointer; }
.btn.p { background: var(--math); border-color: var(--math); color: #fff; }
.btn:disabled { opacity: .5; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; } tr.now td { background: #fffbeb; font-weight: 600; }
td:first-child { white-space: nowrap; color: var(--mute); width: 1%; padding-right: 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-of-type { border-top: 0; } .row span.n { flex: 1; min-width: 0; } .row small { display: block; color: var(--mute); font-size: 12px; }
h3 { font-size: 13px; color: var(--mute); margin: 16px 2px 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: #fff; padding: 6px 9px; font: inherit; font-size: 13px; color: var(--mute); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.已学 { background: var(--ok); color: #fff; } .seg button.on.正在学 { background: var(--phys); color: #fff; } .seg button.on.未学 { background: #9ca3af; color: #fff; }
select, input[type=password], input[type=text] { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.msg { margin-top: 10px; font-size: 14px; } .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); display: flex;
      padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 9px 0 8px; font: inherit; font-size: 12px; color: var(--mute); }
nav button b { display: block; font-size: 20px; font-weight: 400; line-height: 1.2; }
nav button.on { color: var(--math); font-weight: 600; }
.st { flex: none; font-size: 12px; border-radius: 5px; padding: 1px 8px; color: #fff; }
.st.薄弱 { background: var(--bad); } .st.巩固中 { background: var(--phys); } .st.已掌握 { background: var(--ok); }
.hist { flex: none; letter-spacing: 1px; font-size: 13px; color: var(--mute); }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 6px 0 2px; }
.bar i { display: block; } .bar .a { background: var(--ok); } .bar .b { background: var(--phys); } .bar .c { background: var(--bad); }
.opt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 12px;
       padding: 13px 14px; margin: 9px 0; font: inherit; font-size: 16px; }
.opt.right { border-color: var(--ok); background: #ecfdf5; } .opt.wrong { border-color: var(--bad); background: #fef2f2; }
.qq { font-size: 18px; line-height: 1.6; margin: 6px 0 12px; }
.exp { background: #f8fafc; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 6px; }
.big { font-size: 44px; font-weight: 700; text-align: center; margin: 6px 0 0; }
.pts { margin: 0; padding-left: 1.2em; } .pts li { margin: 7px 0; }
.warnbox { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
.row[data-kp] { cursor: pointer; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); background: #1d2330; color: #fff;
         border-radius: 999px; padding: 7px 18px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw; }
#toast.show { opacity: .95; } #toast.bad { background: var(--bad); }
#pages canvas { display: block; width: 100%; height: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
section { display: none; } section.on { display: block; }
</style>
</head>
<body>
<main>
<section id="s-today"></section>
<section id="s-files"></section>
<section id="s-up">
  <h1>上传作业照片</h1><div class="sub">做完后拍照上传，批改完会按错题出下一份练习</div>
  <div class="card" id="keycard"><h2>第一次使用：输入口令</h2>
    <p class="dim" style="margin:0 0 8px;font-size:14px">口令找家长要，只需要输入一次。</p>
    <input type="password" id="key" placeholder="粘贴口令" autocomplete="off">
    <div class="btns"><button class="btn p" id="keysave">保存口令</button></div><div class="msg" id="keymsg"></div></div>
  <div class="card"><h2>① 这是哪一份练习？</h2><select id="which"></select>
    <h2 style="margin-top:14px">② 选照片（可以一次选多张）</h2>
    <input type="file" id="pick" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <div class="btns"><button class="btn p" id="send" disabled>上传</button></div><div class="msg" id="upmsg"></div></div>
  <div class="card"><button class="btn" id="keyreset" style="width:100%">重新输入口令</button></div>
</section>
<section id="s-prog"></section>
<section id="s-mast"></section>
<section id="s-quiz"></section>
<section id="s-kp"></section>
<section id="s-wrong"></section>
<section id="s-view">
  <div class="btns" style="margin:0 0 10px"><button class="btn" id="vback">‹ 返回</button><a class="btn p" id="vdown" download>保存到手机</a><button class="btn" id="vshare" hidden>发送到微信</button></div>
  <div class="msg" id="vtip"></div>
  <div class="sub" id="vname"></div><div class="msg" id="vmsg"></div><div id="pages"></div>
</section>
<section id="s-lock">
  <h1>🔒 答案</h1><div class="sub" id="lockname"></div>
  <div class="card"><h2>输入这份答案的密码</h2>
    <p class="dim" style="margin:0 0 8px;font-size:14px">做完并上传照片后，找家长要答案密码。家长会不定期更换密码。</p>
    <input type="text" id="code" inputmode="numeric" maxlength="20" placeholder="密码" autocomplete="off">
    <div class="btns"><button class="btn p" id="unlock">打开答案</button><button class="btn" id="lockback">返回</button></div>
    <div class="msg" id="lockmsg"></div></div>
</section>
</main>
<div id="toast"></div>
<nav>
  <button data-t="today" class="on"><b>🏠</b>今天</button>
  <button data-t="files"><b>📚</b>资料</button>
  <button data-t="up"><b>📷</b>上传</button>
  <button data-t="mast"><b>📊</b>掌握</button>
  <button data-t="prog"><b>📌</b>进度</button>
</nav>

kp": "物理/机械运动/参照物、凸面镜", "hist": [0], "status": "薄弱", "last": "2026-11-10"}, {"kp": "物理/机械运动/火车过桥", "hist": [0], "status": "薄弱", "last": "2026-11-10"}, {"kp": "物理/机械运动/速度计算与单位换算", "hist": [0], "status": "薄弱", "last": "2026-11-10"}, {"kp": "物理/物态变化/“白气”与液化", "hist": [0], "status": "薄弱", "last": "2026-11-10"}, {"kp": "物理/物态变化/沸腾与凝固实验图像", "hist": [0], "status": "薄弱", "last": "2026-11-10"}, {"kp": "物理/物态变化/熔化和凝固图像", "hist": [0], "status": "薄弱", "last": "2026-11-10"}], "quiz": [{"id": "p001", "kp": "物理/物态变化/熔化和凝固图像", "q": "晶体在熔化过程中，温度怎样变化？", "opts": ["保持不变", "不断升高", "不断降低", "先降低后升高"], "exp": "晶体熔化时不断吸热，但温度保持不变，这个温度叫熔点。图像上是一段水平线。", "need": null}, {"id": "p002", "kp": "物理/物态变化/熔化和凝固图像", "q": "下列物质中，属于晶体的是", "opts": ["海波", "玻璃", "沥青", "松香"], "exp": "海波、冰、各种金属是晶体，有固定的熔点；玻璃、沥青、松香、石蜡是非晶体。", "need": null}, {"id": "p003", "kp": "物理/物态变化/熔化和凝固图像", "q": "温度—时间图像总体是下降的，中间有一段水平线。它表示的是", "opts": ["晶体的凝固", "晶体的熔化", "非晶体的凝固", "非晶体的熔化"], "exp": "总体下降是凝固；有水平段说明是晶体。", "need": null}, {"id": "p004", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "下列现象中，由光的反射形成的是", "opts": ["水中的倒影", "小孔成像", "海市蜃楼", "日食"], "exp": "倒影是平面镜成像，属于反射。小孔成像、日食是直线传播，海市蜃楼是折射。", "need": null}, {"id": "p005", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "站在岸上看到水中的鱼，看到的其实是", "opts": ["折射形成的虚像", "反射形成的虚像", "鱼本身", "鱼的影子"], "exp": "光从水斜射入空气发生折射，看到的是比实际位置偏浅的虚像。水中的“云”才是反射。", "need": null}, {"id": "p006", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "“立竿见影”中的“影”是由什么形成的？", "opts": ["光的直线传播", "光的反射", "光的折射", "光的色散"], "exp": "影子是光沿直线传播被不透明物体挡住形成的。注意“影子”和“倒影”不同。", "need": null}, {"id": "p007", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "插入水中的筷子看起来“变弯”了，这是由于", "opts": ["光的折射", "光的反射", "光的直线传播", "平面镜成像"], "exp": "光从水斜射入空气时传播方向改变，属于折射。", "need": null}, {"id": "p008", "kp": "物理/物态变化/“白气”与液化", "q": "冬天人呼出的“白气”是", "opts": ["水蒸气液化成的小水滴", "水蒸气", "水汽化形成的气体", "小冰晶升华形成的"], "exp": "水蒸气是看不见的。看得见的“白气”都是水蒸气遇冷液化成的小水滴，液化放热。", "need": null}, {"id": "p009", "kp": "物理/物态变化/“白气”与液化", "q": "夏天打开冰箱门，门口出现“白气”。这些“白气”的来源是", "opts": ["空气中的水蒸气遇冷液化", "冰箱里的冰升华", "冰箱里的水汽化", "冰箱里的冷气"], "exp": "是冰箱外空气里的水蒸气遇到冷空气，液化成小水滴。", "need": null}, {"id": "p010", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "下列物态变化中，需要吸热的是", "opts": ["冰雪消融", "霜的形成", "露的形成", "水结成冰"], "exp": "熔化、汽化、升华吸热；凝固、液化、凝华放热。冰雪消融是熔化。", "need": null}, {"id": "p011", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "霜的形成属于哪种物态变化？", "opts": ["凝华", "凝固", "液化", "升华"], "exp": "霜是水蒸气直接变成固态小冰晶，是凝华，放热。", "need": null}, {"id": "p012", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "用干冰进行人工降雨，主要利用了干冰", "opts": ["升华吸热", "熔化吸热", "汽化吸热", "凝华放热"], "exp": "干冰（固态二氧化碳）直接变成气体，是升华，吸收大量的热。", "need": null}, {"id": "p013", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "人站在平面镜前 2 m 处，镜中的像与人相距", "opts": ["4 m", "2 m", "1 m", "8 m"], "exp": "像到镜面的距离等于物到镜面的距离，都是 2 m，所以像与人相距 4 m。", "need": null}, {"id": "p014", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "人向平面镜走近的过程中，镜中的像", "opts": ["大小不变", "变大", "变小", "先变大后变小"], "exp": "平面镜成的像与物体大小始终相等，与距离无关。", "need": null}, {"id": "p015", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "平面镜所成的像是", "opts": ["正立、等大的虚像", "正立、等大的实像", "倒立、等大的虚像", "正立、缩小的虚像"], "exp": "平面镜成正立、等大的虚像，像与物关于镜面对称。", "need": null}, {"id": "p016", "kp": "物理/声现象/音调·响度·音色", "q": "“闻其声而知其人”，依据的是声音的", "opts": ["音色", "音调", "响度", "频率"], "exp": "不同的人、不同的乐器音色不同，分辨发声体靠音色。", "need": null}, {"id": "p017", "kp": "物理/声现象/音调·响度·音色", "q": "用更大的力敲同一面鼓，主要改变的是声音的", "opts": ["响度", "音调", "音色", "传播速度"], "exp": "用力越大，振幅越大，响度越大。", "need": null}, {"id": "p018", "kp": "物理/声现象/音调·响度·音色", "q": "吹笛子时用手指按住不同的孔，是为了改变声音的", "opts": ["音调", "响度", "音色", "传播速度"], "exp": "按不同的孔改变了空气柱的长度，振动频率改变，音调改变。", "need": null}, {"id": "p019", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "在 s－t 图像中，一条水平的直线表示物体", "opts": ["静止", "做匀速直线运动", "做加速运动", "做减速运动"], "exp": "s－t 图像中水平线表示路程不随时间变化，物体静止。", "need": null}, {"id": "p020", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "在 v－t 图像中，一条水平的直线表示物体", "opts": ["做匀速直线运动", "静止", "做加速运动", "无法判断"], "exp": "v－t 图像中水平线表示速度不变，是匀速运动。先看纵轴是 s 还是 v。", "need": null}, {"id": "p021", "kp": "物理/机械运动/速度计算与单位换算", "q": "72 km/h 等于多少 m/s？", "opts": ["20 m/s", "7.2 m/s", "259.2 m/s", "2 m/s"], "exp": "km/h 换成 m/s 要除以 3.6：72÷3.6＝20。", "need": null}, {"id": "p022", "kp": "物理/机械运动/速度计算与单位换算", "q": "计算速度时，时间“8 min”应先换算成", "opts": ["480 s", "80 s", "0.8 s", "800 s"], "exp": "1 min＝60 s，8 min＝480 s。计算前先统一单位。", "need": null}, {"id": "p023", "kp": "物理/声现象/噪声等级（分贝）", "q": "为了保证休息和睡眠，声音不能超过", "opts": ["50 dB", "30 dB", "70 dB", "90 dB"], "exp": "休息和睡眠不超过 50 dB；工作和学习不超过 70 dB；保护听力不超过 90 dB。", "need": null}, {"id": "p024", "kp": "物理/机械运动/参照物、凸面镜", "q": "汽车两侧的后视镜是", "opts": ["凸面镜", "凹面镜", "平面镜", "凸透镜"], "exp": "凸面镜对光有发散作用，能扩大视野。", "need": null}, {"id": "p025", "kp": "物理/机械运动/参照物、凸面镜", "q": "坐在行驶的汽车里的乘客认为自己是静止的，他选择的参照物是", "opts": ["汽车的座椅", "路旁的树", "地面", "迎面开来的汽车"], "exp": "乘客相对座椅位置没有变化，所以相对座椅是静止的。", "need": null}, {"id": "p026", "kp": "物理/机械运动/火车过桥", "q": "长 200 m 的火车完全通过长 1000 m 的大桥，火车行驶的路程是", "opts": ["1200 m", "1000 m", "800 m", "200 m"], "exp": "完全通过：路程＝桥长＋车长＝1200 m。", "need": null}, {"id": "p027", "kp": "物理/机械运动/火车过桥", "q": "长 200 m 的火车全部在长 1000 m 的大桥上行驶，这段路程是", "opts": ["800 m", "1000 m", "1200 m", "200 m"], "exp": "全部在桥上：路程＝桥长－车长＝800 m。", "need": null}, {"id": "p028", "kp": "物理/光现象/作图规范", "q": "作光路图时，法线和光线的反向延长线应该画成", "opts": ["虚线，不带箭头", "实线，带箭头", "实线，不带箭头", "虚线，带箭头"], "exp": "只有实际光线画实线并加箭头；法线、反向延长线、虚像都画虚线。", "need": null}, {"id": "p029", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "入射光线与镜面的夹角是 30°，则反射角是", "opts": ["60°", "30°", "90°", "120°"], "exp": "入射角是光线与法线的夹角：90°－30°＝60°，反射角等于入射角。", "need": null}, {"id": "p030", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "让光逆着原来反射光线的方向射向镜面，反射后会逆着原来入射光线的方向射出。这说明", "opts": ["在反射现象中光路可逆", "反射角等于入射角", "光沿直线传播", "三线在同一平面内"], "exp": "这是“光路可逆”的标准说法。", "need": null}, {"id": "p031", "kp": "物理/光现象/平面镜成像实验", "q": "探究平面镜成像特点时，用玻璃板代替平面镜，目的是", "opts": ["便于确定像的位置", "使像更清晰", "使像更大", "减少光的反射"], "exp": "玻璃板透明，能同时看到像和后面的蜡烛，便于确定像的位置。", "need": null}, {"id": "p032", "kp": "物理/光现象/平面镜成像实验", "q": "在平面镜成像实验中，在像的位置放一块光屏，光屏上", "opts": ["不能承接到像，因为是虚像", "能承接到正立的像", "能承接到倒立的像", "能承接到缩小的像"], "exp": "平面镜成的是虚像，虚像不能用光屏承接。", "need": null}, {"id": "p033", "kp": "物理/透镜/透镜对光的作用", "q": "下列光学元件中，对光有发散作用的是", "opts": ["凹透镜", "凸透镜", "平面镜", "凹面镜"], 0", "s": "物理", "t": "期中考试", "n": "14", "kp": "物理/光现象/潜望镜（两次反射成像）", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "16-17", "kp": "物理/光现象/作图规范", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "18", "kp": "物理/物态变化/沸腾与凝固实验图像", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "20", "kp": "物理/光现象/反射定律实验、光路可逆", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "21", "kp": "物理/光现象/平面镜成像实验", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "22", "kp": "物理/机械运动/速度计算与单位换算", "pdf": null}, {"d": "2026-11-10", "s": "物理", "t": "期中考试", "n": "23", "kp": "物理/机械运动/火车过桥", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "3", "kp": "数学/位置与坐标/点到坐标轴的距离", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "4", "kp": "数学/实数/平方根与算术平方根", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "11", "kp": "数学/一次函数/自变量取值范围", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "13", "kp": "数学/勾股定理/弦图", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "14", "kp": "数学/勾股定理/勾股定理与面积", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "15", "kp": "数学/一次函数/直线与线段有公共点", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "17(3)", "kp": "数学/位置与坐标/最短路径（对称）", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "19(3)", "kp": "数学/一次函数/分段函数反求", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "20", "kp": "数学/一次函数/利润计算", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "21", "kp": "数学/实数/规律探究与分母有理化", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "22(1)", "kp": "数学/一次函数/待定系数法", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "22(2)", "kp": "数学/一次函数/坐标系中的面积", "pdf": null}, {"d": "2026-11-10", "s": "数学", "t": "期中考试", "n": "23", "kp": "数学/勾股定理/全等与勾股综合", "pdf": null}], "notes": {"物理/机械运动/停表和温度计读数": {"pts": ["停表读数＝小盘（分）＋大盘（秒）。", "先看小盘指针：没过两个数字中间的半格线，大盘读 0～30 s；过了半格线，大盘读 30～60 s。", "最后常要换算成秒：3 min 37.5 s＝3×60＋37.5＝217.5 s。", "温度计：先找 0 刻度在哪里。液柱顶端在 0 以下，数字越往下越大，是零下；读作“零下几摄氏度”或“负几摄氏度”。", "读数时看清分度值，视线与液柱上表面相平。"], "warn": "不能把“分”和“秒”直接拼成小数：4 min 7.5 s 不是 4.07，而是 247.5 s。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/参照物、凸面镜": {"pts": ["判断运动还是静止只看一件事：相对参照物，位置变没变。变了是运动，没变是静止。", "同一个物体，选不同的参照物，结论可以不同（运动和静止是相对的）。", "凸面镜：对光有发散作用，能扩大视野。例：汽车后视镜、路口的转弯镜。", "凹面镜：对光有会聚作用。例：太阳灶、手电筒的反光碗。"], "warn": "凸面镜和凹面镜容易记反：“凸”——扩大视野；“凹”——会聚光。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/s-t 和 v-t 图像": {"pts": ["第一步永远是看纵轴：是 s（路程）还是 v（速度）。", "s－t 图像：斜直线＝匀速直线运动（越陡越快）；水平线＝静止。", "v－t 图像：水平线＝匀速直线运动；斜向上的线＝加速。", "从 s－t 图像求速度：在线上取一个点，v＝s÷t。", "两条 s－t 图线相交，表示此时两物体通过的路程相同（相遇）。"], "warn": "同样是“水平线”，在 s－t 图里是静止，在 v－t 图里是匀速。多选题里常同时考两种图。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/速度计算与单位换算": {"pts": ["公式：v＝s/t；变形 s＝vt，t＝s/v。", "计算前先统一单位：min 换成 s（乘 60），km 换成 m（乘 1000）。", "1 m/s＝3.6 km/h。m/s 换 km/h 乘 3.6；km/h 换 m/s 除以 3.6。", "书写格式：解 → 公式 → 代入数据（带单位）→ 结果 → 答。", "平均速度＝总路程÷总时间，不是几个速度的平均值。"], "warn": "期中第 22 题：8 min 没有换成 480 s，后面两问全部跟着错。看到 min 先换算。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/火车过桥": {"pts": ["火车完全通过桥（隧道）：路程＝桥长＋车长。", "火车全部在桥上（完全在隧道内）：路程＝桥长－车长。", "车上的某个人通过桥：路程＝桥长（人看成一个点）。", "画一张草图，标出车头从哪里到哪里，路程就不会错。"], "warn": "“完全通过”要加车长，“全部在桥上”要减车长，两种情况都要会。第三问不会也要先写出公式，有步骤分。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/音调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；过光心的光，方向不变。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点；反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": null}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": null}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": null}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": null}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": null}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": null}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": null}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": null}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": null}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": null}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": null}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分步硬算算错了。", "pdf": null}, "数学/一次函数/坐标系中的面积": {"pts": ["求直线与坐标轴的交点：与 x 轴的交点令 y＝0；与 y 轴的交点令 x＝0。", "求两条直线的交点：把两个表达式联立成方程组。", "三角形面积：选在坐标轴上（或平行于坐标轴）的边做底，高就是第三个顶点到这条轴的距离（坐标的绝对值）。", "没有边在坐标轴上时：用一条竖直或水平的线把它分成两个三角形，或用大图形减去小图形。"], "warn": "期中第 22（2）题：底和高找错。先把三个顶点的坐标都写出来，再选底。", "pdf": null}, "数学/方程组/方程的解的含义": {"pts": ["二元一次方程的解是一对数 (x, y)，代入后左右两边相等。", "一个二元一次方程有无数个解；方程组的解是两个方程的公共解。", "判断是不是解：分别代入每个方程，都成立才是。", "已知解求字母的值：把解代进去，得到关于这个字母的方程。", "代入负数要加括号：－a×(－1)＝＋a。"], "warn": "只代一个方程成立不算方程组的解，两个都要代。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/解方程组（代入、加减）": {"pts": ["代入法：把一个方程写成 y＝…（或 x＝…），代入另一个方程。适合有系数是 1 或 －1 的情况。", "加减法：让某个未知数的系数相等或相反，相等就相减，相反就相加。", "代入时括号要整个乘开：－2(x－3)＝－2x＋6。", "两个方程相减时，被减的方程每一项都要变号。", "方程两边同乘一个数时，等号右边的常数项也要乘。", "解完把结果代回两个方程各验算一次。"], "warn": "作业第 77 页 3 题：x＝20 时 y 应是 80，写成了 100，代回 x＋y＝100 一验算就能发现。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/问什么答什么": {"pts": ["应用题六步：审 → 设 → 列 → 解 → 验 → 答。", "解出 x、y 之后，回头读题目的最后一句，看问的是什么。", "有时问的不是 x、y 本身：问“今年”的人数而设的是“去年”；问总人数而设的是每桌人数。", "最后必须写“答：……”，带单位。", "设未知数时写清楚 x、y 各代表什么，能避免答错对象。"], "warn": "作业“古寺”题：解出 x＝208、y＝156 就停了，题目问的是僧人数 3×208＝624。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/调价、百分率应用题": {"pts": ["涨（增加）10%：乘以 1.1；降（减少）20%：乘以 0.8；打八折：乘以 0.8。", "涨 5 元：加 5；降 5 元：减 5。百分数用乘，具体的钱数用加减。", "先列表：行写“调整前、调整后”，列写两个对象，每一行得到一个方程。", "“A 比 B 少 10”写成 B－A＝10（大的减小的）。", "解完代回题目验算调整后的关系。"], "warn": "作业第 4 题不会列。不要直接盯着题目列方程，先把表填出来。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/购买与利润应用题": {"pts": ["两个等量关系：一个管“数量”，一个管“钱”。", "数量之和＝总数量：x＋y＝60。", "单价×数量之和＝总价：15x＋24y＝1080。", "求利润：每件利润×件数，两种商品分开算再相加。", "鸡兔同笼也是这一类：头数之和＝总头数，脚数之和＝总脚数。"], "warn": "第（2）问常用到第（1）问的结果，第（1）问算完先验算再往下做。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/方程组与一次函数图像": {"pts": ["每个二元一次方程都对应一条直线，如 x－y＝－1 就是 y＝x＋1。", "方程组的解 ⇔ 两条直线交点的坐标。交点 (2, 3) 对应解 x＝2，y＝3。", "求两条直线的交点：把两个表达式联立成方程组来解。", "两条直线平行（k 相等、b 不等）：方程组无解；两条直线重合：有无数组解。", "看图写解时：横坐标是 x，纵坐标是 y。"], "warn": "图像法得到的解可能只是近似值，题目要求准确时仍要用代入法或加减法。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}}};

  document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === "s-view")); scrollTo(0, 0);
  $("vname").textContent = name; $("pages").innerHTML = ""; $("vmsg").className = "msg"; $("vmsg").textContent = "正在打开…";
  const isUrl = typeof src === "string", inWx = /MicroMessenger/i.test(navigator.userAgent);
  $("vshare").hidden = true; $("vdown").setAttribute("download", name + ".pdf"); $("vdown").href = isUrl ? url(src) : "#";
  $("vtip").textContent = inWx ? "在微信里不能直接保存文件：点右上角“…”→“在浏览器打开”，再点“保存到手机”。" : "";
  try {
    const buf = isUrl ? await (await fetch(url(src))).arrayBuffer() : src;
    const blob = new Blob([buf], { type: "application/pdf" });
    if (!isUrl) $("vdown").href = URL.createObjectURL(blob);
    try { const file = new File([blob], name + ".pdf", { type: "application/pdf" });
      if (!inWx && navigator.canShare && navigator.canShare({ files: [file] })) { $("vshare").hidden = false;
        $("vshare").onclick = () => navigator.share({ files: [file], title: name }).catch(() => {}); } } catch (e) {}
    await loadPdfLib();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    const w = Math.min($("pages").clientWidth || 360, 640), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (let i = 1; i <= doc.numPages; i++) {
      $("vmsg").textContent = `正在显示第 ${i} / ${doc.numPages} 页…`;
      const pg = await doc.getPage(i), vp = pg.getViewport({ scale: w * dpr / pg.getViewport({ scale: 1 }).width });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; $("pages").appendChild(c);
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
    $("vmsg").textContent = `共 ${doc.numPages} 页。`;
  } catch (err) { $("vmsg").className = "msg bad"; $("vmsg").textContent = "显示不出来（" + (err && err.message || err) + "）。可以点上面的“保存到手机”试试。"; }
}
$("vback").onclick = () => tab(viewFrom);
const nameOf = f => f.split("/").pop().replace(/\.pdf(\.enc)?$/, "").replace(/^\d{4}_/, "").replace(/_/g, " ");
/* ---- 答案：文件是加密的（AES-GCM），输入密码后在手机上解密 ---- */
let lockFile = null, lockFrom = "today";
async function decrypt(file, code) {
  const buf = new Uint8Array(await (await fetch(url(file))).arrayBuffer());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 200000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28));
}
function openLock(file) {
  lockFile = file; lockFrom = document.querySelector("nav button.on").dataset.t;
  $("lockname").textContent = file.split("/").pop().replace(/\.pdf\.enc$/, "").replace(/^\d{4}_/, "").replace(/_/g, " ");
  $("code").value = store.get("code:" + file) || ""; $("lockmsg").className = "msg"; $("lockmsg").innerHTML = "";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "s-lock")); scrollTo(0, 0);
  if ($("code").value) $("unlock").click();
}
$("lockback").onclick = () => tab(lockFrom);
$("unlock").onclick = async () => {
  const code = $("code").value.trim(), m = $("lockmsg");
  if (!code) { m.className = "msg bad"; m.textContent = "请输入密码。"; return; }
  m.className = "msg"; m.textContent = "正在打开…"; $("unlock").disabled = true;
  try {
    const pdf = await decrypt(lockFile, code);
    store.set("code:" + lockFile, code);
    $("unlock").disabled = false;
    viewPdf(pdf, nameOf(lockFile), lockFrom); return;
  } catch (err) {
    m.className = "msg bad";
    m.textContent = err && err.name === "OperationError" ? "密码不对，可能已经换了新密码，请向家长确认。" : "打不开（" + (window.crypto && crypto.subtle ? (err && err.message || err) : "这个浏览器不支持解密，请换用手机自带浏览器或 Chrome") + "）。请把这句话截图发给家长。";
  }
  $("unlock").disabled = false;
};
document.addEventListener("click", async e => {
  if (e.target.id === "redo") { const r = rng("redo" + Date.now());
    startQuiz(false, null, quizWrongIds().map(id => D.quiz.find(q => q.id === id)).filter(Boolean).map(q => [r(), q]).sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, 6)); return; }
  if (e.target.id === "kpback") { tab(kpFrom === "quiz" ? "today" : kpFrom); return; }
  const kq = e.target.closest("[data-kpquiz]");
  if (kq) { startQuiz(false, kq.dataset.kpquiz); return; }
  const kr = e.target.closest("[data-kp]");
  if (kr) { showKp(kr.dataset.kp); return; }
  const qb = e.target.closest("[data-quiz]");
  if (qb) { startQuiz(qb.dataset.quiz === "1"); return; }
  const ob = e.target.closest(".opt");
  if (ob && qz) { answerQ(+ob.dataset.o); return; }
  if (e.target.id === "qnext") { if (qz.i === qz.qs.length - 1) finishQuiz(); else { qz.i++; showQ(); scrollTo(0, 0); } return; }
  if (e.target.id === "qagain") { startQuiz(true); return; }
  if (e.target.id === "qquit" || e.target.id === "qhome") { tab("today"); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab(tb.dataset.tab); return; }
  const lk = e.target.closest("[data-lock]");
  if (lk) { openLock(lk.dataset.lock); return; }
  const vw = e.target.closest("[data-view]");
  if (vw) { viewPdf(vw.dataset.view, nameOf(vw.dataset.view)); return; }
  const up = e.target.closest("[data-up]");
  if (up) { $("which").value = up.dataset.up; tab("up"); return; }
  const seg = e.target.closest(".seg");
  if (seg && e.target.tagName === "BUTTON") { prog.items[+seg.dataset.i][2] = e.target.textContent;
    [...seg.children].forEach(b => b.classList.toggle("on", b === e.target)); queueSave(); return; }
});
/* 进度：点了就自动保存（停 1.2 秒后把最新状态存一次，连续点几行只存一次） */
let saveTimer = null, saving = false, dirty = false, toastTimer = null;
function toast(t, bad, keep) { const el = $("toast"); el.textContent = t; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); if (!keep) toastTimer = setTimeout(() => el.className = "", bad ? 5000 : 1800); }
function queueSave() {
  if (!store.get("key")) { toast("还没有输入口令，改动没有保存。请先到“上传”页输入口令", true); return; }
  dirty = true; clearTimeout(saveTimer); toast("正在保存…", false, true); saveTimer = setTimeout(doSave, 1200);
}
async function doSave() {
  if (saving) { saveTimer = setTimeout(doSave, 600); return; }
  saving = true; dirty = false;
  const t = stamp(); prog.saved = t.slice(0, 10) + "T" + t.slice(11).replace(/-/g, ":");
  try { await put(`progress/${t}.json`, b64(JSON.stringify(prog, null, 1)), "progress"); if (!dirty) toast("已保存 ✓"); }
  catch (err) { toast((err.message || "保存失败") + "，改动没有保存", true); }
  saving = false;
}
$("which").innerHTML = [...D.sheets].sort((a, b) => b.date.localeCompare(a.date)).map(s =>
  `<option value="${s.id}">${s.date.slice(5).replace("-", "/")} ${s.subject} ${s.title}</option>`).join("") + `<option value="其他">其他（学校作业、试卷等）</option>`;
/* 家长发来的专用链接（网址后面带 #k=口令）：打开一次就自动记住口令，并把它从地址栏里去掉 */
(() => { const m = location.hash.match(/[#&]k=([^&]+)/); if (!m) return;
  store.set("key", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search);
  setTimeout(() => toast("口令已自动保存 ✓ 以后直接打开就能上传"), 400); })();
renderToday(); renderFiles(); renderProg(); renderMast(); renderWrong(); flushQuiz(); keyUi(); tab("today");
/* 手机浏览器会缓存旧页面：发现服务器上有新版本就自动换成新的 */
fetch("v.txt?" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim(); const q = new URLSearchParams(location.search).get("v");
  if (v && v !== D.build && q !== v) location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});
