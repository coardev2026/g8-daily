 m（乘 1000）。", "1 m/s＝3.6 km/h。m/s 换 km/h 乘 3.6；km/h 换 m/s 除以 3.6。", "书写格式：解 → 公式 → 代入数据（带单位）→ 结果 → 答。", "平均速度＝总路程÷总时间，不是几个速度的平均值。"], "warn": "期中第 22 题：8 min 没有换成 480 s，后面两问全部跟着错。看到 min 先换算。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/火车过桥": {"pts": ["火车完全通过桥（隧道）：路程＝桥长＋车长。", "火车全部在桥上（完全在隧道内）：路程＝桥长－车长。", "车上的某个人通过桥：路程＝桥长（人看成一个点）。", "画一张草图，标出车头从哪里到哪里，路程就不会错。"], "warn": "“完全通过”要加车长，“全部在桥上”要减车长，两种情况都要会。第三问不会也要先写出公式，有步骤分。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/音调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；过光心的光，方向不变。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点；反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分步硬算算错了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/坐标系中的面积": {"pts": ["求直线与坐标轴的交点：与 x 轴的交点令 y＝0；与 y 轴的交点令 x＝0。", "求两条直线的交点：把两个表达式联立成方程组。", "三角形面积：选在坐标轴上（或平行于坐标轴）的边做底，高就是第三个顶点到这条轴的距离（坐标的绝对值）。", "没有边在坐标轴上时：用一条竖直或水平的线把它分成两个三角形，或用大图形减去小图形。"] async function shrink(file) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}

function loadPdfLib() {
  return pdfLib || (pdfLib = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "lib/pdf.min.js";
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js"; ok(); };
    sc.onerror = () => { pdfLib = null; no(new Error("显示组件加载失败")); }; document.head.appendChild(sc); }));

async function viewPdf(src, name, from) {
  viewFrom = from || (document.querySelector("nav button.on") || {dataset: {t: "today"}}).dataset.t;
  document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === "s-view")); scrollTo(0, 0);
  $("vname").textContent = name; $("pages").innerHTML = ""; $("vmsg").className = "msg"; $("vmsg").textContent = "正在打开…";
  const isUrl = typeof src === "string", inWx = /MicroMessenger/i.test(navigator.userAgent);
  $("vshare").hidden = true; $("vdown").style.display = ""; $("vdown").setAttribute("download", name + ".pdf"); $("vdown").href = isUrl ? url(src) : "#";
  $("vtip").textContent = inWx ? "在微信里不能直接保存文件：点右上角“…”→“在浏览器打开”，再点“保存到手机”。" : "";
  try {
    const buf = isUrl ? await (await fetch(url(src))).arrayBuffer() : src;
    const blob = new Blob([buf], { type: "application/pdf" });
    if (!isUrl) $("vdown").href = URL.createObjectURL(blob);
    try { const file = new File([blob], name + ".pdf", { type: "application/pdf" });
      if (!inWx && navigator.canShare && navigator.canShare({ files: [file] })) { $("vshare").hidden = false;
        $("vshare").onclick = () => navigator.share({ files: [file], title: name }).catch(() => {}); } } catch (e) {}
    await loadPdfLib();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    /* 每页按 2000 像素宽画出来再转成图片：两指放大 4～5 倍还是清楚的；画完就把画布释放掉，省内存 */
    const TW = 2000;
    for (let i = 1; i <= doc.numPages; i++) {
      $("vmsg").textContent = `正在显示第 ${i} / ${doc.numPages} 页…`;
      const pg = await doc.getPage(i), vp = pg.getViewport({ scale: TW / pg.getViewport({ scale: 1 }).width });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, "image/png"));
      if (blob) { const im = new Image(); im.src = URL.createObjectURL(blob); im.alt = `第 ${i} 页`; $("pages").appendChild(im); c.width = c.height = 0; }
      else $("pages").appendChild(c);
    }
    $("vmsg").textContent = `共 ${doc.numPages} 页。`;
  } catch (err) { $("vmsg").className = "msg bad"; $("vmsg").textContent = "显示不出来（" + (err && err.message || err) + "）。可以点上面的“保存到手机”试试。"; }
}

let lockFile = null, lockFrom = "today";
async function decrypt(file, code) {
  const buf = new Uint8Array(await (await fetch(url(file))).arrayBuffer());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 200000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28));
}

  $("lockname").textContent = file.split("/").pop().replace(/\.pdf\.enc$/, "").replace(/^\d{4}_/, "").replace(/_/g, " ");

  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "s-lock")); scrollTo(0, 0);
  if ($("code").value) $("unlock").click();
}

  }
  $("unlock").disabled = false;
};

/* 进度：点了就自动保存（停 1.2 秒后把最新状态存一次，连续点几行只存一次） */
let saveTimer = null, saving = false, dirty = false, toastTimer = null;
function toast(t, bad, keep) { const el = $("toast"); el.textContent = t; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); if (!keep) toastTimer = setTimeout(() => el.className = "", bad ? 5000 : 1800); }

/* 免登录链接：微信里的浏览器有时不保存登录状态，每次都要输密码。登录后可以生成一条带通行证的链接（#a=…），

function myLink() {
  const box = $("mylinkbox"); if (box.innerHTML) { box.innerHTML = ""; return; }
  const pass = { name: store.get("user"), role: store.get("role"), token: store.get("key"), ans: store.get("ans"), dk: store.get("dk") };
  const u = location.origin + location.pathname + "#a=" + b64(JSON.stringify(pass)).replace(/=+$/, "").replace(/[+]/g, "-").replace(/[/]/g, "_");
  box.innerHTML = `<div class="card" style="border-color:#93c5fd"><h2>我的免登录链接</h2>
    <div class="sub" style="margin-bottom:6px">在微信里每次都要重新登录时用：把这条链接发到自己的“文件传输助手”（可以置顶或收藏），以后从那里点开，就不用再输密码。</div>
    <textarea id="mylinkurl" readonly rows="3" style="width:100%;box-sizing:border-box;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all">${u}</textarea>
    <div class="btns"><button class="btn p" id="mylinkcopy">复制链接</button></div>
    <div class="dim" style="font-size:13px;margin-top:6px">⚠ 这条链接相当于${pass.role === "parent" ? "家长" : "你"}的密码，只发给自己，不要转给别人、不要发到群里。</div></div>`;
}

(() => {
  const cur = () => { const x = document.querySelector("section.on"); return x ? x.id : "s-today"; };
  let last = cur(), popping = false;
  try { history.replaceState({ sec: last }, ""); } catch (e) { return; }
  new MutationObserver(() => { const id = cur(); if (id === last) return; last = id;
    if (!popping) { try { history.pushState({ sec: id }, ""); } catch (e) {} } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
  window.addEventListener("popstate", e => { const id = (e.state && e.state.sec) || "s-today", t = id.slice(2); popping = true;
    document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === (t === "kp" ? "mast" : t === "prog" ? "files" : t)));
    last = id; setTimeout(() => { popping = false; }, 0); });
})();
