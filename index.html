let viewFrom = "today", pdfLib = null;
function loadPdfLib() {
  return pdfLib || (pdfLib = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "lib/pdf.min.js";
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js"; ok(); };
    sc.onerror = () => { pdfLib = null; no(new Error("显示组件加载失败")); }; document.head.appendChild(sc); }));
}
async function viewPdf(src, name, from) {
  viewFrom = from || (document.querySelector("nav button.on") || {dataset: {t: "today"}}).dataset.t;
  document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === "s-view")); scrollTo(0, 0);
  $("vname").textContent = name; $("pages").innerHTML = ""; $("vmsg").className = "msg"; $("vmsg").textContent = "正在打开…";
  const isUrl = typeof src === "string", inWx = /MicroMessenger/i.test(navigator.userAgent);
  $("vshare").hidden = true; $("vdown").style.display = ""; $("vdown").setAttribute("download", name + ".pdf"); $("vdown").href = isUrl ? url(src) : "#";
  $("vtip").textContent = inWx ? "在微信里不能直接保存文件：点右上角“…”→“在浏览器打开”，再点“保存到手机”。" : "";
  try {
    const buf = isUrl ? await (await fetch(url(src))).arrayBuffer() : src;
    const blob = new Blob([buf], { type: "application/pdf" });
    if (!isUrl) $("vdown").href = URL.createObjectURL(blob);
    try { const file = new File([blob], name + ".pdf", { type: "application/pdf" });
      if (!inWx && navigator.canShare && navigator.canShare({ files: [file] })) { $("vshare").hidden = false;
        $("vshare").onclick = () => navigator.share({ files: [file], title: name }).catch(() => {}); } } catch (e) {}
    await loadPdfLib();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    const w = Math.min($("pages").clientWidth || 360, 640), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (let i = 1; i <= doc.numPages; i++) {
      $("vmsg").textContent = `正在显示第 ${i} / ${doc.numPages} 页…`;
      const pg = await doc.getPage(i), vp = pg.getViewport({ scale: w * dpr / pg.getViewport({ scale: 1 }).width });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; $("pages").appendChild(c);
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
    $("vmsg").textContent = `共 ${doc.numPages} 页。`;
  } catch (err) { $("vmsg").className = "msg bad"; $("vmsg").textContent = "显示不出来（" + (err && err.message || err) + "）。可以点上面的“保存到手机”试试。"; }
}
$("vback").onclick = () => tab(viewFrom);
const nameOf = f => f.split("/").pop().replace(/\.pdf(\.enc)?$/, "").replace(/^\d{4}_/, "").replace(/_/g, " ");
/* ---- 答案：文件是加密的（AES-GCM），输入密码后在手机上解密 ---- */
let lockFile = null, lockFrom = "today";
async function decrypt(file, code) {
  const buf = new Uint8Array(await (await fetch(url(file))).arrayBuffer());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 200000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28));
}
function openLock(file) {
  lockFile = file; lockFrom = document.querySelector("nav button.on").dataset.t;
  $("lockname").textContent = file.split("/").pop().replace(/\.pdf\.enc$/, "").replace(/^\d{4}_/, "").replace(/_/g, " ");
  $("code").value = store.get("ans") || store.get("code:" + file) || ""; $("lockmsg").className = "msg"; $("lockmsg").innerHTML = "";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "s-lock")); scrollTo(0, 0);
  if ($("code").value) $("unlock").click();
}
$("lockback").onclick = () => tab(lockFrom);
$("unlock").onclick = async () => {
  const code = $("code").value.trim(), m = $("lockmsg");
  if (!code) { m.className = "msg bad"; m.textContent = "请输入密码。"; return; }
  m.className = "msg"; m.textContent = "正在打开…"; $("unlock").disabled = true;
  try {
    const pdf = await decrypt(lockFile, code);
    store.set("code:" + lockFile, code);
    $("unlock").disabled = false;
    viewPdf(pdf, nameOf(lockFile), lockFrom); return;
  } catch (err) {
    m.className = "msg bad";
    m.textContent = err && err.name === "OperationError" ? "密码不对，可能已经换了新密码，请向家长确认。" : "打不开（" + (window.crypto && crypto.subtle ? (err && err.message || err) : "这个浏览器不支持解密，请换用手机自带浏览器或 Chrome") + "）。请把这句话截图发给家长。";
  }
  $("unlock").disabled = false;
};
document.addEventListener("click", async e => {
  if (e.target.id === "actre") { loadActivity(); return; }
  const ph = e.target.closest("[data-photos]");
  if (ph) { showPhotos(ph.dataset.photos.split("|")); return; }
  if (e.target.id === "logout") { logout(); return; }
  if (e.target.id === "redo") { const r = rng("redo" + Date.now());
    startQuiz(false, null, quizWrongIds().map(id => D.quiz.find(q => q.id === id)).filter(Boolean).map(q => [r(), q]).sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, 6)); return; }
  if (e.target.id === "kpback") { tab(kpFrom === "quiz" ? "today" : kpFrom); return; }
  const kq = e.target.closest("[data-kpquiz]");
  if (kq) { startQuiz(false, kq.dataset.kpquiz); return; }
  const kr = e.target.closest("[data-kp]");
  if (kr) { showKp(kr.dataset.kp); return; }
  const qb = e.target.closest("[data-quiz]");
  if (qb) { startQuiz(qb.dataset.quiz === "1"); return; }
  const ob = e.target.closest(".opt");
  if (ob && qz) { answerQ(+ob.dataset.o); return; }
  if (e.target.id === "qnext") { if (qz.i === qz.qs.length - 1) finishQuiz(); else { qz.i++; showQ(); scrollTo(0, 0); } return; }
  if (e.target.id === "qagain") { startQuiz(true); return; }
  if (e.target.id === "qquit" || e.target.id === "qhome") { tab("today"); return; }
  const ak = e.target.closest("[data-ask]");
  if (ak) { askUp(ak.dataset.ask); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { if (tb.dataset.tab === "wrong") { WFOCUS = tb.dataset.wsheet || null; renderWrong(); }
    tab(tb.dataset.tab); if (tb.dataset.tab === "wrong") scrollTo(0, 0); return; }
  const lk = e.target.closest("[data-lock]");
  if (lk) { openLock(lk.dataset.lock); return; }
  const qi = e.target.closest("[data-qimg]");
  if (qi) { showQimg(qi); return; }
  const vw = e.target.closest("[data-view]");
  if (vw) { viewPdf(vw.dataset.view, nameOf(vw.dataset.view)); return; }
  const up = e.target.closest("[data-up]");
  if (up) { $("which").value = up.dataset.up; tab("up"); return; }
  const seg = e.target.closest(".seg");
  if (seg && e.target.tagName === "BUTTON") { prog.items[+seg.dataset.i][2] = e.target.textContent;
    [...seg.children].forEach(b => b.classList.toggle("on", b === e.target)); queueSave(); return; }
});
/* 进度：点了就自动保存（停 1.2 秒后把最新状态存一次，连续点几行只存一次） */
let saveTimer = null, saving = false, dirty = false, toastTimer = null;
function toast(t, bad, keep) { const el = $("toast"); el.textContent = t; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); if (!keep) toastTimer = setTimeout(() => el.className = "", bad ? 5000 : 1800); }
function queueSave() {
  if (!store.get("key")) { toast("还没有输入口令，改动没有保存。请先到“上传”页输入口令", true); return; }
  dirty = true; clearTimeout(saveTimer); toast("正在保存…", false, true); saveTimer = setTimeout(doSave, 1200);
}
async function doSave() {
  if (saving) { saveTimer = setTimeout(doSave, 600); return; }
  saving = true; dirty = false;
  const t = stamp(); prog.saved = t.slice(0, 10) + "T" + t.slice(11).replace(/-/g, ":"); prog.by = me() ? me().name : "";
  try { await put(`progress/${t}.json`, b64(JSON.stringify(prog, null, 1)), "progress"); if (!dirty) toast("已保存 ✓"); }
  catch (err) { toast((err.message || "保存失败") + "，改动没有保存", true); }
  saving = false;
}
$("which").innerHTML = [...D.sheets].sort((a, b) => b.date.localeCompare(a.date)).map(s =>
  `<option value="${s.id}">${s.date.slice(5).replace("-", "/")} ${s.subject} ${s.title}</option>`).join("");
/* ---- 登录：选“妈妈/孩子”+ 密码。密码正确才能解开通行证，里面带着上传用的口令 ---- */
const me = () => store.get("user") ? { name: store.get("user"), role: store.get("role") } : null;
let loginWho = null;
function loginUi() {
  const need = D.users.length && !me();
  $("login").hidden = !need; document.querySelector("nav").style.display = need ? "none" : "";
  if (need) { loginWho = loginWho || D.users[D.users.length - 1].name;
    $("who").innerHTML = D.users.map(u => `<button class="${u.name === loginWho ? "on" : ""}">${u.name}</button>`).join(""); }
}
$("who").onclick = e => { if (e.target.tagName === "BUTTON") { loginWho = e.target.textContent; loginUi(); $("pw").focus(); } };
$("pw").onkeydown = e => { if (e.key === "Enter") $("dologin").click(); };
$("dologin").onclick = async () => {
  const m = $("loginmsg"), pw = $("pw").value; if (!pw) return;
  m.className = "msg"; m.textContent = "正在登录…"; $("dologin").disabled = true;
  try {
    const buf = Uint8Array.from(atob(D.users.find(u => u.name === loginWho).blob), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 300000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const b = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28))));
    store.set("user", b.name); store.set("role", b.role); store.set("key", b.token || null); store.set("ans", b.ans || null); store.set("dk", b.dk || null); loadPriv();
    $("pw").value = ""; m.textContent = ""; loginUi(); renderToday(); keyUi(); flushQuiz(); tab("today");
  } catch (err) { m.className = "msg bad"; m.textContent = err && err.name === "OperationError" ? "密码不对。" : "登录失败（" + (err && err.message || err) + "）"; }
  $("dologin").disabled = false;
};
function logout() { PRIV = {}; SYNCQD = null; KIDQD = null; ["user", "role", "key", "ans", "dk"].forEach(k => store.set(k, null)); loginUi(); keyUi(); }
/* 家长发来的专用链接（网址后面带 #k=口令）：打开一次就自动记住口令，并把它从地址栏里去掉 */
(() => { const m = location.hash.match(/[#&]k=([^&]+)/); if (!m) return;
  store.set("key", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search);
  setTimeout(() => toast("口令已自动保存 ✓ 以后直接打开就能上传"), 400); })();
/* 以前登录时还没有这把密钥：请重新登录一次，才能看到批改说明和原题 */
if (me() && D.users.length && !store.get("dk")) { ["user", "role", "ans"].forEach(k => store.set(k, null)); }
renderToday(); renderFiles(); renderProg(); renderMast(); renderWrong(); flushQuiz(); loginUi(); keyUi(); tab("today"); loadPriv();
/* ---- 手机的“返回”键 / 返回手势：回到上一个画面，而不是直接退出页面 ---- */
(() => {
  const cur = () => { const x = document.querySelector("section.on"); return x ? x.id : "s-today"; };
  let last = cur(), popping = false;
  try { history.replaceState({ sec: last }, ""); } catch (e) { return; }
  new MutationObserver(() => { const id = cur(); if (id === last) return; last = id;
    if (!popping) { try { history.pushState({ sec: id }, ""); } catch (e) {} } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
  window.addEventListener("popstate", e => { const id = (e.state && e.state.sec) || "s-today", t = id.slice(2); popping = true;
    document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === (t === "wrong" || t === "kp" ? "mast" : t)));
    last = id; setTimeout(() => { popping = false; }, 0); });
})();
/* 手机浏览器会缓存旧页面：发现服务器上有新版本就自动换成新的 */
fetch("v.txt?" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim(); const q = new URLSearchParams(location.search).get("v");
  if (v && v !== D.build && q !== v) location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});
