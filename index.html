\"display:block\">总利润＝每件利润×件数</span><span style=\"display:block\">例：进价 15 元，售价 20 元，卖 40 件：</span><span style=\"display:block\">(20－15)×40＝5×40＝200（元）</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 先算“每件赚多少”，再乘件数；不要拿售价直接乘。</span></span>", "solmean": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">“解”的意思：代进去，两边相等</b><span style=\"display:block\">x＝2，y＝－1 是 3x－ay＝8 的解</span><span style=\"display:block\">→ 代入：3×2－a×(－1)＝8</span><span style=\"display:block\">→ 6＋a＝8，a＝2</span><span style=\"display:block\">判断一组数是不是方程组的解：<b>两个方程都要代</b>，都成立才是。</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 代入负数要加括号：－a×(－1)＝＋a。</span></span>", "solve": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">代入法</b><span style=\"display:block\">y＝2x－3 ①　　3x＋2y＝8 ②</span><span style=\"display:block\">把①代入②：3x＋2(2x－3)＝8 → 7x＝14 → x＝2</span><span style=\"display:block\">代回①：y＝2×2－3＝1</span><span style=\"display:block\">验算（代入另一个方程②）：3×2＋2×1＝8 ✓</span></span><span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">加减法</b><span style=\"display:block\">3x＋4y＝10 ①　　5x－2y＝8 ②</span><span style=\"display:block\">②×2（<b>左右两边都乘</b>）：10x－4y＝16 ③</span><span style=\"display:block\">①＋③：13x＝26 → x＝2；代入①：y＝1</span><span style=\"display:block\">验算：5×2－2×1＝8 ✓</span><span style=\"display:block;margin-top:4px;color:#b45309;fo 过”要加车长，“全部在桥上”要减车长，两种情况都要会。第三问不会也要先写出公式，有步骤分。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/音调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；射向另一侧焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "判断会聚还是发散：把入射光线照原方向延长，折射光比它更靠近主光轴是会聚（凸透镜），更远离是发散（凹透镜）。", "透镜越凸，对光的偏折能力越强，焦距越短。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点：焦点以内的光源经凸透镜后仍散开，但凸透镜仍起会聚作用。凹透镜是“射向另一侧焦点”的光才平行射出。反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。", "已知物 A 和像 A′ 找焦点：从 A 画平行于主光轴的光线交透镜于 P，连 PA′（虚像连虚线再延长），与主光轴的交点就是焦点。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/无理数与估算": {"pts": ["无理数＝无限不循环小数。常见三类：开方开不尽的数（√2、√5、∛3）；含 π 的数（π、π/2）；像 0.1010010001… 这样有规律但不循环的小数。", "判断前先把能算的算出来：√9＝3、∛8＝2、√16＝4 都是整数，是有理数。", "分数、有限小数、循环小数都是有理数：22/7、3.14、0.333… 都不是无理数。", "估算 √a：找两个相邻的平方数夹住 a。9＜10＜16，所以 3＜√10＜4。", "a 离哪个平方数近，√a 就靠近哪个整数：√10 约 3.2，√15 约 3.9。", "√10 的整数部分是 3，小数部分是 √10－3。"], "warn": "22/7 约等于 π，但它是分数，是有理数；带根号的数要先看能不能开得尽。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分 fetch("v.txt?" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim(); const q = new URLSearchParams(location.search).get("v");
  if (v && v !== D.build && q !== v) location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});
</script>
