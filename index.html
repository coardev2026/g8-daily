<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>每日练习</title>
<style>
:root { --bg:#f4f5f7; --panel:#fff; --line:#e3e5ea; --text:#1d2330; --mute:#6b7280; --math:#2563eb; --phys:#d97706; --ok:#059669; --bad:#dc2626; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font: 16px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg);
       padding: 0 0 calc(70px + env(safe-area-inset-bottom)); }
main { max-width: 640px; margin: 0 auto; padding: 14px 16px; }
h1 { font-size: 24px; margin: 6px 0 0; }
.sub { color: var(--mute); font-size: 13px; }
.hero { display: flex; align-items: flex-end; gap: 12px; }
.hero > div:first-child { flex: 1; }
.cd { text-align: right; color: var(--mute); font-size: 12px; line-height: 1.3; }
.cd b { font-size: 26px; color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.tag { display: inline-block; font-size: 12px; border-radius: 5px; padding: 0 7px; color: #fff; margin-right: 6px; vertical-align: 1px; }
.tag.数学 { background: var(--math); } .tag.物理 { background: var(--phys); } .tag.其他 { background: var(--mute); }
.dim { color: var(--mute); }
.sheet { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
.btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
a.btn, button.btn { flex: 1; min-width: 96px; text-align: center; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--text);
       border-radius: 10px; padding: 10px 8px; font: inherit; font-size: 15px; cursor: pointer; }
.btn.p { background: var(--math); border-color: var(--math); color: #fff; }
.btn:disabled { opacity: .5; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; } tr.now td { background: #fffbeb; font-weight: 600; }
td:first-child { white-space: nowrap; color: var(--mute); width: 1%; padding-right: 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-of-type { border-top: 0; } .row span.n { flex: 1; min-width: 0; } .row small { display: block; color: var(--mute); font-size: 12px; }
h3 { font-size: 13px; color: var(--mute); margin: 16px 2px 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: #fff; padding: 6px 9px; font: inherit; font-size: 13px; color: var(--mute); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.已学 { background: var(--ok); color: #fff; } .seg button.on.正在学 { background: var(--phys); color: #fff; } .seg button.on.未学 { background: #9ca3af; color: #fff; }
select, input[type=password], input[type=text] { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.pickseg { width: 100%; } .pickseg button { flex: 1; padding: 10px 2px; font-size: 15px; } .pickseg button.on { background: var(--text); color: #fff; }
.qsrc { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin: 8px 0 0; font-size: 15px; line-height: 1.7; overflow-x: auto; }
.qsrc svg { max-width: 100%; height: auto; } .qsrc p { margin: 4px 0; } .qsrc .figs { display: flex; flex-wrap: wrap; gap: 6px; } .qsrc div[style*="flex"] { flex-wrap: wrap; }
.qsrc u.b { display: inline-block; min-width: 3em; border-bottom: 1px solid #000; height: 1.1em; text-decoration: none; }
.qsrc table { border-collapse: collapse; margin: 6px 0; font-size: 13px; } .qsrc td, .qsrc th { border: 1px solid #000; padding: 2px 6px; text-align: center; font-weight: normal; }
.qsrc b.lab { display: block; font-size: 12px; color: #64748b; font-weight: normal; margin-bottom: 2px; }
.qimg { margin: 8px 0 0; } .qimg img { display: block; max-width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; }
small.kd { color: var(--ok) !important; } small.ku { color: #b45309 !important; } a.more { color: var(--math); font-size: 14px; text-decoration: underline; }
.actup + .row { border-top: 1px solid var(--line); }
.actup { max-height: 190px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-right: 4px; }
.actup::-webkit-scrollbar, .actq::-webkit-scrollbar { width: 4px; } .actup::-webkit-scrollbar-thumb, .actq::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
.shst { font-size: 13px; color: #b45309; margin-top: 8px; } .shst.done { color: var(--ok); } .shst a { color: var(--math); text-decoration: underline; }
.memo { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.msg { margin-top: 10px; font-size: 14px; } .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); display: flex;
      padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 9px 0 8px; font: inherit; font-size: 12px; color: var(--mute); }
nav button b { display: block; font-size: 20px; font-weight: 400; line-height: 1.2; }
nav button.on { color: var(--math); font-weight: 600; }
.st { flex: none; font-size: 12px; border-radius: 5px; padding: 1px 8px; color: #fff; }
.st.薄弱 { background: var(--bad); } .st.巩固中 { background: var(--phys); } .st.已掌握 { background: var(--ok); }
.hist { flex: none; letter-spacing: 1px; font-size: 13px; color: var(--mute); }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 6px 0 2px; }
.bar i { display: block; } .bar .a { background: var(--ok); } .bar .b { background: var(--phys); } .bar .c { background: var(--bad); }
.opt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 12px;
       padding: 13px 14px; margin: 9px 0; font: inherit; font-size: 16px; }
.opt.right { border-color: var(--ok); background: #ecfdf5; } .opt.wrong { border-color: var(--bad); background: #fef2f2; }
.rt { white-space: nowrap; } .rt > i { font-style: normal; } .rt > span { border-top: 1.5px solid currentColor; padding: 0 1px; margin-left: -2px; }
.rt.tall { display: inline-flex; align-items: stretch; vertical-align: middle; }
.rt.tall > i { display: inline-flex; align-items: center; transform: scaleY(1.9); }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.2; margin: 0 3px; font-size: 0.92em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 4px 1px; } .fr > span:last-child { padding-top: 1px; }
.fig { text-align: center; margin: 10px 0 12px; } .fig svg { max-width: 100%; height: auto; }
.figbox { display: inline-flex; flex-direction: column; align-items: center; max-width: 100%; margin: 4px 0; } .figbox .cap { font-size: 13px; color: var(--mute); margin-top: 2px; }
.qq { font-size: 18px; line-height: 1.6; margin: 6px 0 12px; }
.exp { background: #f8fafc; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 6px; }
.big { font-size: 44px; font-weight: 700; text-align: center; margin: 6px 0 0; }
.pts { margin: 0; padding-left: 1.2em; } .pts li { margin: 7px 0; }
.warnbox { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
.row[data-kp] { cursor: pointer; }
#login { position: fixed; inset: 0; background: var(--bg); z-index: 20; padding: 16px; overflow: auto; }
#who button { flex: 1; padding: 10px; font-size: 16px; } #who button.on { background: var(--text); color: #fff; }
.me { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); margin-bottom: 2px; }
.me button { border: 0; background: none; color: var(--math); font: inherit; padding: 4px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); background: #1d2330; color: #fff;
         border-radius: 999px; padding: 7px 18px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw; }
#toast.show { opacity: .95; } #toast.bad { background: var(--bad); }
#pages canvas { display: block; width: 100%; height: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
section { display: none; } section.on { display: block; }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card" style="max-width:380px;margin:12vh auto 0">
    <h1 style="font-size:22px;margin:0 0 4px">每日练习</h1><div class="sub" style="margin-bottom:14px">请先登录</div>
    <div class="seg" id="who" style="width:100%;margin-bottom:10px"></div>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
    <div class="btns"><button class="btn p" id="dologin">登录</button></div><div class="msg" id="loginmsg"></div>
  </div>
</div>
<main>
<section id="s-today"></section>
<section id="s-files"></section>
<section id="s-up">
  <h1>拍照上传</h1><div class="sub">练习做完拍照上传；学校作业、试卷、不会的题也可以拍了发上来</div>
  <div class="card" id="keycard"><h2>第一次使用：输入口令</h2>
    <p class="dim" style="margin:0 0 8px;font-size:14px">口令找家长要，只需要输入一次。</p>
    <input type="password" id="key" placeholder="粘贴口令" autocomplete="off">
    <div class="btns"><button class="btn p" id="keysave">保存口令</button></div><div class="msg" id="keymsg"></div></div>
  <div class="card"><h2>① 传的是什么？</h2>
    <div class="seg pickseg" id="kind"><button class="on">每日练习</button><button>学校作业</button><button>不会的题</button><button>试卷</button></div>
    <div id="k-sheet" style="margin-top:10px"><select id="which"></select></div>
    <div id="k-other" style="margin-top:10px" hidden>
      <div class="seg pickseg" id="subj"><button class="on">数学</button><button>物理</button></div>
      <input type="text" id="memo" maxlength="100" style="margin-top:10px" autocomplete="off">
      <div class="dim" id="kindtip" style="font-size:13px;margin-top:6px"></div></div>
    <h2 style="margin-top:14px">② 选照片（可以一次选多张）</h2>
    <input type="file" id="pick" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <div class="btns"><button class="btn p" id="send" disabled>上传</button></div><div class="msg" id="upmsg"></div></div>
  <div class="card"><button class="btn" id="keyreset" style="width:100%">重新输入口令</button></div>
</section>
<section id="s-prog"></section>
<section id="s-mast"></section>
<section id="s-quiz"></section>
<section id="s-kp"></section>
<section id="s-wrong"></section>
<section id="s-view">
  <div class="btns" style="margin:0 0 10px"><button class="btn" id="vback">‹ 返回</button><a class="btn p" id="vdown" download>保存到手机</a><button class="btn" id="vshare" hidden>发送到微信</button></div>
  <div class="msg" id="vtip"></div>
  <div class="sub" id="vname"></div><div class="msg" id="vmsg"></div><div id="pages"></div>
</section>
<section id="s-lock">
  <h1>🔒 答案</h1><div class="sub" id="lockname"></div>
  <div class="card"><h2>输入这份答案的密码</h2>
    <p class="dim" style="margin:0 0 8px;font-size:14px">做完并上传照片后，找家长要答案密码。家长会不定期更换密码。</p>
    <input type="text" id="code" inputmode="numeric" maxlength="20" placeholder="密码" autocomplete="off">
    <div class="btns"><button class="btn p" id="unlock">打开答案</button><button class="btn" id="lockback">返回</button></div>
    <div class="msg" id="lockmsg"></div></div>
</section>
</main>
<div id="toast"></div>
<nav>
  <button data-t="today" class="on"><b>🏠</b>今天</button>
  <button data-t="files"><b>📚</b>资料</button>
  <button data-t="up"><b>📷</b>上传</button>
  <button data-t="mast"><b>📊</b>掌握</button>
  <button data-t="prog"><b>📌</b>进度</button>
</nav>
<script>
/* 把纯文字写的根号、分数排成课本上的样子：
     √(x－2)、√16、∛(－8)  →  根号带上横线（括号去掉）
     1/√3、√3/3、(√2－1)/3、9/25、v＝s/t  →  上下排的分数
   单位（km/h、m/s、g/cm³）不动。出题、写卡片时照旧用纯文字写即可。
   用法：MathFmt.fmt(字符串)（字符串里可以有 HTML 标签）；试卷页面在 </body> 前加
     <script src="tools/mathfmt.js" data-auto><\/script>  会自动处理正文。 */
(function (g) {
  const SUP = "²³⁴⁵⁶⁷⁸⁹⁰¹⁻ⁿ₀₁₂₃₄₅₆₇₈₉ₙₓ′";
  const PAIR = { "(": ")", "[": "]" };
  const VULGAR = { "½": [1, 2], "⅓": [1, 3], "⅔": [2, 3], "¼": [1, 4], "¾": [3, 4], "⅕": [1, 5], "⅖": [2, 5], "⅗": [3, 5], "⅘": [4, 5], "⅙": [1, 6], "⅚": [5, 6], "⅛": [1, 8], "⅜": [3, 8], "⅝": [5, 8], "⅞": [7, 8] };
  let single = false;                          // 刚解析完的那一段是不是“只有一个分数”
  const escCh = c => c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c;

  function match(s, i) {                       // s[i] 是 ( 或 [，返回配对的右括号位置，没有则 -1
    const open = s[i], close = PAIR[open]; let d = 0;
    for (let j = i; j < s.length; j++) { if (s[j] === open) d++; else if (s[j] === close && --d === 0) return j; }
    return -1;
  }
  const rad = (sign, inner) => `<span class="rt${inner.includes('class="fr"') ? " tall" : ""}"><i>${sign}</i><span>${inner}</span></span>`;

  function parse(s, depth, esc) {
    const T = [];                              // 记号：{t: num|let|rad|grp|op, h: 显示内容, in: 括号里的内容}
    for (let i = 0; i < s.length;) {
      const c = s[i]; let m;
      if (SUP.includes(c) && T.length && T[T.length - 1].t !== "op") { T[T.length - 1].h += c; T[T.length - 1].sup = 1; i++; continue; }
      if (VULGAR[c]) { T.push({ t: "frc", h: `<span class="fr"><span>${VULGAR[c][0]}</span><span>${VULGAR[c][1]}</span></span>` }); i++; continue; }   // ⅓ 这种小字分数也排成上下的
      if ((m = /^\d+(\.\d+)?/.exec(s.slice(i)))) { T.push({ t: "num", h: m[0] }); i += m[0].length; continue; }
      if (c === "√" || c === "∛") {
        if (s[i + 1] === "(") { const j = match(s, i + 1);
          if (j > 0) { T.push({ t: "rad", h: rad(c, parse(s.slice(i + 2, j), depth + 1, esc)) }); i = j + 1; continue; } }
        if ((m = /^(\d+(\.\d+)?|[a-zA-Z])/.exec(s.slice(i + 1)))) { T.push({ t: "rad", h: rad(c, m[0]) }); i += 1 + m[0].length; continue; }
        T.push({ t: "op", h: c }); i++; continue;
      }
      if (PAIR[c]) { const j = match(s, i);
        if (j > 0) { const inner = parse(s.slice(i + 1, j), depth + 1, esc); T.push({ t: "grp", h: c + inner + PAIR[c], in: inner, one: single }); i = j + 1; continue; } }
      if (/[a-zA-Z]/.test(c)) { T.push({ t: "let", h: c }); i++; continue; }
      T.push({ t: "op", h: esc ? escCh(c) : c }); i++;
    }
    const atom = k => T[k] && T[k].t !== "op", is = (k, t) => T[k] && T[k].t === t;
    const body = k => T[k].t === "grp" && !T[k].sup ? T[k].in : T[k].h;   // 做分子分母时去掉最外层括号
    let out = [];
    for (let i = 0; i < T.length; i++) {
      if (!(T[i].t === "op" && T[i].h === "/" && atom(i - 1) && atom(i + 1) && out.length)) { out.push(T[i].t === "grp" && T[i].one && !T[i].sup ? T[i].in : T[i].h); continue; }   // (5/3)x：括号里只有一个分数时去掉括号
      let a = i - 1, b = i + 1;
      if (is(a, "rad") && is(a - 1, "num")) a--;                          // 2√3/3
      if (is(b, "num") && is(b + 1, "rad")) b++;                          // 1/2√3
      const word = (is(i - 1, "let") && is(i - 2, "let")) || (is(i + 1, "let") && is(i + 2, "let"));   // km/h、g/cm³
      const prev = T[a - 1] ? T[a - 1].h : "";
      const unit = is(i - 1, "let") && is(i + 1, "let") && !(a === i - 1 && ("＝=－-".includes(prev) && prev || (!prev && depth > 0)));  // m/s
      if (word || unit) { out.push(T[i].h); continue; }
      const num = a === i - 1 ? body(a) : T[a].h + T[a + 1].h, den = b === i + 1 ? body(b) : T[b].h + T[b + 1].h;
      out.length -= (i - a);
      out.push(`<span class="fr"><span>${num}</span><span>${den}</span></span>`);
      i = b;
    }
    single = out.length === 1 && out[0].startsWith('<span class="fr">');
    return out.join("");
  }

  const hasMath = s => /[√∛½⅓⅔¼¾⅕-⅞]|\S\/\S/.test(s);
  function fmt(s) {                            // 字符串里的标签原样保留，只处理文字部分
    if (typeof s !== "string" || !hasMath(s)) return s;
    return s.split(/(<[^>]+>)/).map((p, k) => k % 2 ? p : parse(p, 0, false)).join("");
  }
  function run(root) {                         // 处理页面里的文字节点（标题、日期行、图里的字不动）
    const skip = "SCRIPT,STYLE,svg,h1,.sub,.info,.rt,.fr,.nomath";
    const w = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()) { const n = w.currentNode; if (hasMath(n.nodeValue) && !n.parentElement.closest(skip)) nodes.push(n); }
    nodes.forEach(n => { const h = parse(n.nodeValue, 0, true);
      if (!h.includes("<span")) return;
      const t = document.createElement("template"); t.innerHTML = h; n.replaceWith(t.content); });
  }
  g.MathFmt = { fmt, run };

样变化？", "opts": ["保持不变", "不断升高", "不断降低", "先降低后升高"], "exp": "晶体熔化时不断吸热，但温度保持不变，这个温度叫熔点。图像上是一段水平线。", "need": null}, {"id": "p002", "kp": "物理/物态变化/熔化和凝固图像", "q": "下列物质中，属于晶体的是", "opts": ["海波", "玻璃", "沥青", "松香"], "exp": "海波、冰、各种金属是晶体，有固定的熔点；玻璃、沥青、松香、石蜡是非晶体。", "need": null}, {"id": "p003", "kp": "物理/物态变化/熔化和凝固图像", "q": "温度—时间图像总体是下降的，中间有一段水平线。它表示的是", "opts": ["晶体的凝固", "晶体的熔化", "非晶体的凝固", "非晶体的熔化"], "exp": "总体下降是凝固；有水平段说明是晶体。", "need": null, "fig": "freeze_q"}, {"id": "p004", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "下列现象中，由光的反射形成的是", "opts": ["水中的倒影", "小孔成像", "海市蜃楼", "日食"], "exp": "倒影是平面镜成像，属于反射。小孔成像、日食是直线传播，海市蜃楼是折射。", "need": null}, {"id": "p005", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "站在岸上看到水中的鱼，看到的其实是", "opts": ["折射形成的虚像", "反射形成的虚像", "鱼本身", "鱼的影子"], "exp": "光从水斜射入空气发生折射，看到的是比实际位置偏浅的虚像。水中的“云”才是反射。", "need": null, "fig": "fish"}, {"id": "p006", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "“立竿见影”中的“影”是由什么形成的？", "opts": ["光的直线传播", "光的反射", "光的折射", "光的色散"], "exp": "影子是光沿直线传播被不透明物体挡住形成的。注意“影子”和“倒影”不同。", "need": null, "fig": "shadow"}, {"id": "p007", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "插入水中的筷子看起来“变弯”了，这是由于", "opts": ["光的折射", "光的反射", "光的直线传播", "平面镜成像"], "exp": "光从水斜射入空气时传播方向改变，属于折射。", "need": null, "fig": "chopstick"}, {"id": "p008", "kp": "物理/物态变化/“白气”与液化", "q": "冬天人呼出的“白气”是", "opts": ["水蒸气液化成的小水滴", "水蒸气", "水汽化形成的气体", "小冰晶升华形成的"], "exp": "水蒸气是看不见的。看得见的“白气”都是水蒸气遇冷液化成的小水滴，液化放热。", "need": null}, {"id": "p009", "kp": "物理/物态变化/“白气”与液化", "q": "夏天打开冰箱门，门口出现“白气”。这些“白气”的来源是", "opts": ["空气中的水蒸气遇冷液化", "冰箱里的冰升华", "冰箱里的水汽化", "冰箱里的冷气"], "exp": "是冰箱外空气里的水蒸气遇到冷空气，液化成小水滴。", "need": null}, {"id": "p010", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "下列物态变化中，需要吸热的是", "opts": ["冰雪消融", "霜的形成", "露的形成", "水结成冰"], "exp": "熔化、汽化、升华吸热；凝固、液化、凝华放热。冰雪消融是熔化。", "need": null}, {"id": "p011", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "霜的形成属于哪种物态变化？", "opts": ["凝华", "凝固", "液化", "升华"], "exp": "霜是水蒸气直接变成固态小冰晶，是凝华，放热。", "need": null}, {"id": "p012", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "用干冰进行人工降雨，主要利用了干冰", "opts": ["升华吸热", "熔化吸热", "汽化吸热", "凝华放热"], "exp": "干冰（固态二氧化碳）直接变成气体，是升华，吸收大量的热。", "need": null}, {"id": "p013", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "人站在平面镜前 2 m 处，镜中的像与人相距", "opts": ["4 m", "2 m", "1 m", "8 m"], "exp": "像到镜面的距离等于物到镜面的距离，都是 2 m，所以像与人相距 4 m。", "need": null, "fig": "mirror_q13"}, {"id": "p014", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "人向平面镜走近的过程中，镜中的像", "opts": ["大小不变", "变大", "变小", "先变大后变小"], "exp": "平面镜成的像与物体大小始终相等，与距离无关。", "need": null, "fig": "mirror_q"}, {"id": "p015", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "平面镜所成的像是", "opts": ["正立、等大的虚像", "正立、等大的实像", "倒立、等大的虚像", "正立、缩小的虚像"], "exp": "平面镜成正立、等大的虚像，像与物关于镜面对称。", "need": null, "fig": "mirror_q"}, {"id": "p016", "kp": "物理/声现象/音调·响度·音色", "q": "“闻其声而知其人”，依据的是声音的", "opts": ["音色", "音调", "响度", "频率"], "exp": "不同的人、不同的乐器音色不同，分辨发声体靠音色。", "need": null}, {"id": "p017", "kp": "物理/声现象/音调·响度·音色", "q": "用更大的力敲同一面鼓，主要改变的是声音的", "opts": ["响度", "音调", "音色", "传播速度"], "exp": "用力越大，振幅越大，响度越大。", "need": null}, {"id": "p018", "kp": "物理/声现象/音调·响度·音色", "q": "吹笛子时用手指按住不同的孔，是为了改变声音的", "opts": ["音调", "响度", "音色", "传播速度"], "exp": "按不同的孔改变了空气柱的长度，振动频率改变，音调改变。", "need": null}, {"id": "p019", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "在 s－t 图像中，一条水平的直线表示物体", "opts": ["静止", "做匀速直线运动", "做加速运动", "做减速运动"], "exp": "s－t 图像中水平线表示路程不随时间变化，物体静止。", "need": null, "fig": "st_flat"}, {"id": "p020", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "在 v－t 图像中，一条水平的直线表示物体", "opts": ["做匀速直线运动", "静止", "做加速运动", "无法判断"], "exp": "v－t 图像中水平线表示速度不变，是匀速运动。先看纵轴是 s 还是 v。", "need": null, "fig": "vt_flat"}, {"id": "p021", "kp": "物理/机械运动/速度计算与单位换算", "q": "72 km/h 等于多少 m/s？", "opts": ["20 m/s", "7.2 m/s", "259.2 m/s", "2 m/s"], "exp": "km/h 换成 m/s 要除以 3.6：72÷3.6＝20。", "need": null}, {"id": "p022", "kp": "物理/机械运动/速度计算与单位换算", "q": "计算速度时，时间“8 min”应先换算成", "opts": ["480 s", "80 s", "0.8 s", "800 s"], "exp": "1 min＝60 s，8 min＝480 s。计算前先统一单位。", "need": null}, {"id": "p023", "kp": "物理/声现象/噪声等级（分贝）", "q": "为了保证休息和睡眠，声音不能超过", "opts": ["50 dB", "30 dB", "70 dB", "90 dB"], "exp": "休息和睡眠不超过 50 dB；工作和学习不超过 70 dB；保护听力不超过 90 dB。", "need": null}, {"id": "p024", "kp": "物理/机械运动/参照物、凸面镜", "q": "汽车两侧的后视镜是", "opts": ["凸面镜", "凹面镜", "平面镜", "凸透镜"], "exp": "凸面镜对光有发散作用，能扩大视野。", "need": null}, {"id": "p025", "kp": "物理/机械运动/参照物、凸面镜", "q": "坐在行驶的汽车里的乘客认为自己是静止的，他选择的参照物是", "opts": ["汽车的座椅", "路旁的树", "地面", "迎面开来的汽车"], "exp": "乘客相对座椅位置没有变化，所以相对座椅是静止的。", "need": null}, {"id": "p026", "kp": "物理/机械运动/火车过桥", "q": "长 200 m 的火车完全通过长 1000 m 的大桥，火车行驶的路程是", "opts": ["1200 m", "1000 m", "800 m", "200 m"], "exp": "完全通过：路程＝桥长＋车长＝1200 m。", "need": null, "fig": "train_q"}, {"id": "p027", "kp": "物理/机械运动/火车过桥", "q": "长 200 m 的火车全部在长 1000 m 的大桥上行驶，这段路程是", "opts": ["800 m", "1000 m", "1200 m", "200 m"], "exp": "全部在桥上：路程＝桥长－车长＝800 m。", "need": null, "fig": "train_in"}, {"id": "p028", "kp": "物理/光现象/作图规范", "q": "作光路图时，法线和光线的反向延长线应该画成", "opts": ["虚线，不带箭头", "实线，带箭头", "实线，不带箭头", "虚线，带箭头"], "exp": "只有实际光线画实线并加箭头；法线、反向延长线、虚像都画虚线。", "need": null}, {"id": "p029", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "入射光线与镜面的夹角是 30°，则反射角是", "opts": ["60°", "30°", "90°", "120°"], "exp": "入射角是光线与法线的夹角：90°－30°＝60°，反射角等于入射角。", "need": null, "fig": "reflect"}, {"id": "p030", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "让光逆着原来反射光线的方向射向镜面，反射后会逆着原来入射光线的方向射出。这说明", "opts": ["在反射现象中光路可逆", "反射角等于入射角", "光沿直线传播", "三线在同一平面内"], "exp": "这是“光路可逆”的标准说法。", "need": null}, {"id": "p031", "kp": "物理/光现象/平面镜成像实验", "q": "探究平面镜成像特点时，用玻璃板代替平面镜，目的是", "opts": ["便于确定像的位置", "使像更清晰", "使像更大", "减少光的反射"], "exp": "玻璃板透明，能同时看到像和后面的蜡烛，便于确定像的位置。", "need": null, "fig": "mirror_exp"}, {"id": "p032", "kp": "物理/光现象/平面镜成像实验", "q": "在平面镜成像实验中，在像的位置放一块光屏，光屏上", "opts": ["不能承接到像，因为是虚像", "能承接到正立的像", "能承接到倒立的像", "能承接到缩小的像"], "exp": "平面镜成的是虚像，虚像不能用光屏承接。", "need": null, "fig": "mirror_exp"}, {"id": "p033", "kp": "物理/透镜/透镜对光的作用", "q": "下列光学元件中，对光有发散作用的是", "opts": ["凹透镜", "凸透镜", "平面镜", "凹面镜"], "exp": "凹透镜（中间薄、边缘厚）对光有发散作用；凸透镜对光有会聚作用。", "need": "第5章 5.1 透镜"}, {"id": "p034", "kp": "物理/透镜/透镜对光的作用", "q": "平行于主光轴的光经过凸透镜后", "opts": ["会聚于焦点", "仍然平行", "向外发散", "沿原路返回"], "exp": "平行于主光轴的光经凸透镜折射后通过焦点。", "need": "第5章 5.1 透镜", "fig": "lens_par_q"}, {"id": "p035", "kp": "物理/透镜/凸透镜成像规律", "q": "物体放在凸透镜的二倍焦距以外，成的像是", "opts": ["倒立、缩小的实像", "倒立、放大的实像", "正立、放大的虚像", "倒立、等大的实像"], "exp": "u＞2f：倒立、缩小的实像，应用是照相机。", "need": "第5章 5.3 凸透镜成像的规律", "fig": "lens_far"}, {"id": "p036", "kp": "物理/透镜/凸透镜成像规律", "q": "投影仪成的像是", "opts": ["倒立、放大的实像", "倒立、缩小的实像", "正立、放大的虚像", "正立、放大的实像"], "exp": "f＜u＜2f：倒立、放大的实像。所以投影片要倒着放。", "need": "第5章 5.3 凸透镜成像的规律"}, {"id": "p037", "kp": "物理/透镜/凸透镜成像规律", "q": "凸透镜的焦距是 10 cm，把蜡烛放在距透镜 15 cm 处，光屏上成的像是", "opts": ["倒立、放大的实像", "倒立、缩小的实像", "正立、放大的虚像", "不能成像"], "exp": "15 cm 在 f（10 cm）和 2f（20 cm）之间，成倒立、放大的实像。", "need": "第5章 5.3 凸透镜成像的规律", "fig": "lens_mid"}, {"id": "p038", "kp": "物理/透镜/凸透镜成像规律", "q": "用放大镜看书上的字，字应该放在", "opts": ["一倍焦距以内", "一倍焦距和二倍焦距之间", "二倍焦距以外", "焦点上"], "exp": "u＜f 时成正立、放大的虚像，这就是放大镜。", "need": "第5章 5.3 凸透镜成像的规律"}, {"id": "p039", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "如图是某物体运动的 s－t 图像。0～4 s 内，物体的速度是", "opts": ["5 m/s", "20 m/s", "80 m/s", "0.2 m/s"], "exp": "0～4 s 内走了 20 m：v＝s/t＝20 m÷4 s＝5 m/s。", "need": null, "fig": "st_q"}, {"id": "p040", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "如图是某物体运动的 s－t 图像。4～8 s 内，物体", "opts": ["静止", "做匀速直线运动", "做加速运动", "速度是 5 m/s"], "exp": "4～8 s 是水平线，路程一直是 20 m 没有变，所以物体静止。", "need": null, "fig": "st_q"}, {"id": "p041", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "如图是某物体运动的 v－t 图像。0～4 s 内，物体", "opts": ["做匀速直线运动", "静止", "做加速运动", "做减速运动"], "exp": "先看纵轴：这是 v－t 图像。水平线表示速度一直是 4 m/s 不变，是匀速直线运动，不是静止。", "need": null, "fig": "vt_q"}, {"id": "p042", "kp": "物理/机械运动/s-t 和 v-t 图像", "q": "如图是某物体运动的 v－t 图像。4～8 s 内，物体", "opts": ["做加速运动", "做匀速直线运动", "静止", "做减速运动"], "exp": "v－t 图像中斜向上的线表示速度越来越大，是加速运动。", "need": null, "fig": "vt_q"}, {"id": "p043", "kp": "物理/物态变化/熔化和凝固图像", "q": "如图是某种物质熔化时温度随时间变化的图像。这种物质的熔点是", "opts": ["48 ℃", "20 ℃", "70 ℃", "无法确定"], "exp": "水平段 BC 对应的温度就是熔点：48 ℃。", "need": null, "fig": "melt_q"}, {"id": "p044", "kp": "物理/物态变化/熔化和凝固图像", "q": "如图是某种物质熔化时温度随时间变化的图像。BC 段物质处于", "opts": ["固液共存状态", "固态", "液态", "气态"], "exp": "AB 段是固态，BC 段正在熔化（固液共存，吸热但温度不变），CD 段是液态。", "need": null, "fig": "melt_q"}, {"id": "p045", "kp": "物理/物态变化/熔化和凝固图像", "q": "如图是某种物质熔化时温度随时间变化的图像。熔化过程持续了", "opts": ["4 min", "8 min", "12 min", "2 min"], "exp": "熔化从第 4 min 开始，到第 8 min 结束：8－4＝4 min。不是 8 min。", "need": null, "fig": "melt_q"}, {"id": "p046", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "如图是“探究水沸腾时温度变化的特点”实验的图像。水的沸点是", "opts": ["98 ℃", "100 ℃", "90 ℃", "94 ℃"], "exp": "水平段对应的温度是沸点：98 ℃。低于 100 ℃ 说明当时的气压低于标准大气压。", "need": null, "fig": "boil_q"}, {"id": "p047", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "如图，水沸腾以后继续加热，水的温度", "opts": ["保持不变", "继续升高", "先升高后降低", "逐渐降低"], "exp": "沸腾的特点：继续吸热，温度保持不变（图像上是一段水平线）。", "need": null, "fig": "boil_q"}, {"id": "p048", "kp": "物理/机械运动/停表和温度计读数", "q": "如图，温度计的示数是", "opts": ["－6 ℃", "6 ℃", "－4 ℃", "4 ℃"], "exp": "先找 0：液柱顶端在 0 的下面，是零下；从 0 往下数 6 小格，所以是 －6 ℃。", "need": null, "fig": "thermo"}, {"id": "p049", "kp": "物理/机械运动/停表和温度计读数", "q": "如图，停表的读数是", "opts": ["3 min 37.5 s", "3 min 7.5 s", "37.5 s", "4 min 7.5 s"], "exp": "小盘指针在 3 和 4 之间，而且过了半格，所以大盘读 30～60 s 那一圈：37.5 s。合起来是 3 min 37.5 s。", "need": null, "fig": "watch"}, {"id": "p050", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "如图，入射光线与镜面的夹角是 30°，反射角是", "opts": ["60°", "30°", "120°", "90°"], "exp": "入射角是入射光线与法线的夹角：90°－30°＝60°。反射角等于入射角，也是 60°。", "need": null, "fig": "reflect"}, {"id": "p051", "kp": "物理/物态变化/“白气”与液化", "q": "烧开水时，壶嘴上方冒出“白气”。“白气”是", "opts": ["水蒸气遇冷液化成的小水滴", "壶里冒出来的水蒸气", "水沸腾时产生的烟", "水蒸气凝华成的小冰晶"], "exp": "水蒸气是无色透明、看不见的。看得见的“白气”是水蒸气遇到较冷的空气液化成的小水滴。", "need": null}, {"id": "p052", "kp": "物理/物态变化/“白气”与液化", "q": "烧开水时，紧靠壶嘴的地方反而看不到“白气”，离壶嘴远一点才有。原因是", "opts": ["壶嘴附近温度高，水蒸气不容易液化", "壶嘴附近没有水蒸气", "壶嘴附近的水蒸气太少", "壶嘴附近的小水滴太大看不见"], "exp": "液化需要遇冷放热。壶嘴附近温度高，水蒸气不液化（看不见）；离远一点温度低了，才液化成能看见的小水滴。", "need": null}, {"id": "p053", "kp": "物理/物态变化/“白气”与液化", "q": "夏天剥开冰棒纸，冰棒周围冒“白气”。这些“白气”是", "opts": ["空气中的水蒸气遇冷液化成的小水滴", "冰棒熔化成的水", "冰棒升华成的水蒸气", "冰棒冒出的冷气"], "exp": "冰棒温度低，周围空气里的水蒸气遇冷液化成小水滴。“白气”来自空气中的水蒸气，不是来自冰棒。", "need": null}, {"id": "p054", "kp": "物理/物态变化/“白气”与液化", "q": "“白气”形成的过程中，发生的物态变化和吸放热情况是", "opts": ["液化，放热", "汽化，吸热", "液化，吸热", "升华，吸热"], "exp": "“白气”是水蒸气（气态）变成小水滴（液态），是液化；液化要放热。", "need": null}, {"id": "p055", "kp": "物理/物态变化/“白气”与液化", "q": "下列说法正确的是", "opts": ["水蒸气是看不见的，“白气”是小水滴", "“白气”就是水蒸气", "“白气”是气态的水", "水蒸气是白色的"], "exp": "水蒸气无色透明，看不见。凡是看得见的“白气”“雾”，都是液态的小水滴。", "need": null}, {"id": "p056", "kp": "物理/物态变化/“白气”与液化", "q": "冬天戴眼镜的人从室外走进温暖的室内，镜片会变模糊。镜片上的小水珠和下列哪种现象的形成原因相同", "opts": ["烧水时壶嘴冒的“白气”", "湿衣服晾干", "冰雪消融", "冬天窗玻璃上的冰花"], "exp": "室内的水蒸气遇到冷镜片液化成小水珠，和“白气”一样是液化。晾干是汽化，冰雪消融是熔化，冰花是凝华。", "need": null}, {"id": "p057", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "平静的湖面上能看到岸边树木的“倒影”。“倒影”是由什么形成的？", "opts": ["光的反射", "光的折射", "光的直线传播", "光的色散"], "exp": "平静的水面相当于平面镜，“倒影”是平面镜成像，属于光的反射。注意和“影子”（直线传播）区分。", "need": null, "fig": "daoying"}, {"id": "p058", "kp": "物理/光现象/直线传播·反射·折射的分类", "q": "下列现象中，由光的折射形成的是", "opts": ["池水看起来比实际的浅", "手影", "水中的倒影", "小孔成像"], "exp": "池底反射的光从水里斜射入空气时发生折射，看到的是变浅的虚像。手影、小孔成像是直线传播，倒影是反射。", "need": null, "fig": "pool"}, {"id": "p059", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "露的形成属于哪种物态变化？", "opts": ["液化", "凝华", "熔化", "汽化"], "exp": "露是空气中的水蒸气遇冷变成的小水珠，气态→液态，是液化（放热）。霜才是凝华。", "need": null}, {"id": "p060", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "衣柜里的樟脑丸过一段时间变小了，发生的物态变化是", "opts": ["升华", "汽化", "熔化", "凝华"], "exp": "樟脑丸由固态直接变成气态，没有经过液态，是升华（吸热）。", "need": null}, {"id": "p061", "kp": "物理/物态变化/六种物态变化与吸放热", "q": "下列物态变化中，需要放热的是", "opts": ["冬天窗玻璃上结冰花", "湿衣服晾干", "冰块化成水", "樟脑丸变小"], "exp": "冰花是水蒸气凝华形成的，凝华放热。晾干是汽化、冰化成水是熔化、樟脑丸变小是升华，这三个都吸热。", "need": null}, {"id": "p062", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "小明站在平面镜前 1.5 m 处，他的像到镜面的距离是", "opts": ["1.5 m", "3 m", "0.75 m", "0 m"], "exp": "像到镜面的距离＝物到镜面的距离＝1.5 m。3 m 是像到人的距离，题目问的是像到镜面。", "need": null, "fig": "mirror_15"}, {"id": "p063", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "小明站在平面镜前 3 m 处，他向镜面走近 1 m 后，像与他之间的距离是", "opts": ["4 m", "2 m", "6 m", "5 m"], "exp": "走近后人到镜面 3－1＝2 m，像到镜面也是 2 m，像到人 2＋2＝4 m。", "need": null, "fig": "mirror_q"}, {"id": "p064", "kp": "物理/光现象/平面镜成像的距离和大小", "q": "身高 1.6 m 的同学站在平面镜前 2 m 处，他在镜中的像高是", "opts": ["1.6 m", "0.8 m", "3.2 m", "2 m"], "exp": "平面镜成等大的像，像高＝人的身高＝1.6 m，与离镜面多远无关。", "need": null, "fig": "mirror_h"}, {"id": "p065", "kp": "物理/声现象/音调·响度·音色", "q": "“不敢高声语，恐惊天上人”中的“高”指的是声音的", "opts": ["响度", "音调", "音色", "频率"], "exp": "“高声语”是大声说话，说的是声音的大小，是响度。这里的“高”不是音调高。", "need": null}, {"id": "p066", "kp": "物理/声现象/音调·响度·音色", "q": "“女高音歌唱家”中的“高”指的是声音的", "opts": ["音调", "响度", "音色", "振幅"], "exp": "女高音的“高”是声音尖、高，指音调（振动频率高）。", "need": null}, {"id": "p067", "kp": "物理/声现象/音调·响度·音色", "q": "声音的音调由发声体振动的什么决定？", "opts": ["频率", "振幅", "时间", "材料"], "exp": "音调由频率决定，振动越快音调越高。振幅决定响度；材料、结构影响音色。", "need": null}, {"id": "p068", "kp": "物理/机械运动/速度计算与单位换算", "q": "5 m/s 等于多少 km/h？", "opts": ["18 km/h", "1.8 km/h", "50 km/h", "1.39 km/h"], "exp": "m/s 换成 km/h 要乘 3.6：5×3.6＝18 km/h。除以 3.6 是 km/h 换 m/s 时用的。", "need": null}, {"id": "p069", "kp": "物理/机械运动/速度计算与单位换算", "q": "小明用 5 min 走了 600 m，他的平均速度是", "opts": ["2 m/s", "120 m/s", "3000 m/s", "0.5 m/s"], "exp": "先换算：5 min＝300 s。v＝s/t＝600 m÷300 s＝2 m/s。直接用 600÷5 就错了。", "need": null}, {"id": "p070", "kp": "物理/机械运动/速度计算与单位换算", "q": "汽车以 20 m/s 的速度匀速行驶 5 min，通过的路程是", "opts": ["6000 m", "100 m", "4 m", "1200 m"], "exp": "5 min＝300 s。s＝vt＝20 m/s×300 s＝6000 m。", "need": null}, {"id": "p071", "kp": "物理/机械运动/速度计算与单位换算", "q": "小明跑步，前 100 m 用了 20 s，后 100 m 用了 30 s，全程的平均速度是", "opts": ["4 m/s", "4.2 m/s", "5 m/s", "3.3 m/s"], "exp": "平均速度＝总路程÷总时间＝200 m÷50 s＝4 m/s。不能把两段的速度相加除以 2。", "need": null, "fig": "run2"}, {"id": "p072", "kp": "物理/声现象/噪声等级（分贝）", "q": "为了保证工作和学习，声音不能超过", "opts": ["70 dB", "50 dB", "90 dB", "30 dB"], "exp": "记四个数：30～40 dB 理想安静环境，50 dB 睡眠，70 dB 工作学习，90 dB 保护听力。", "need": null}, {"id": "p073", "kp": "物理/声现象/噪声等级（分贝）", "q": "为了保护听力，声音不能超过", "opts": ["90 dB", "70 dB", "50 dB", "120 dB"], "exp": "保护听力不超过 90 dB；工作学习 70 dB；休息睡眠 50 dB。", "need": null}, {"id": "p074", "kp": "物理/声现象/噪声等级（分贝）", "q": "人刚能听到的最微弱的声音是", "opts": ["0 dB", "10 dB", "30 dB", "50 dB"], "exp": "0 dB 是人刚能听到的最微弱的声音，不是“没有声音”。", "need": null}, {"id": "p075", "kp": "物理/声现象/噪声等级（分贝）", "q": "分贝（dB）是表示声音什么的单位？", "opts": ["强弱（响度）的等级", "音调的高低", "音色的好坏", "传播的快慢"], "exp": "分贝表示声音强弱的等级，对应的是响度。", "need": null}, {"id": "p076", "kp": "物理/声现象/噪声等级（分贝）", "q": "在公路两旁安装隔音板，这是在哪个环节减弱噪声？", "opts": ["在传播过程中", "在声源处", "在人耳处", "三个环节都不是"], "exp": "隔音板挡在声源和人之间，是在传播过程中减弱。禁止鸣笛是在声源处，戴耳罩是在人耳处。", "need": null}, {"id": "p077", "kp": "物理/机械运动/参照物、凸面镜", "q": "小明坐在行驶的公交车上，以路旁的树为参照物，小明是", "opts": ["运动的", "静止的", "无法判断", "先静止后运动"], "exp": "相对于树，小明的位置在不断变化，所以是运动的。", "need": null}, {"id": "p078", "kp": "物理/机械运动/参照物、凸面镜", "q": "“小小竹排江中游，巍巍青山两岸走”，说“青山在走”选择的参照物是", "opts": ["竹排", "青山", "河岸", "岸边的树"], "exp": "相对于竹排，青山的位置在变化，所以说青山在“走”。不能选研究对象自己做参照物。", "need": null}, {"id": "p079", "kp": "物理/机械运动/参照物、凸面镜", "q": "加油机在空中给战斗机加油时，以加油机为参照物，战斗机是", "opts": ["静止的", "运动的", "向前运动的", "向后运动的"], "exp": "加油时两架飞机速度大小和方向都相同，相对位置不变，所以战斗机相对加油机是静止的。", "need": null}, {"id": "p080", "kp": "物理/机械运动/参照物、凸面镜", "q": "街头拐弯处安装凸面镜，作用是", "opts": ["扩大视野", "会聚光线", "成放大的像", "成实像"], "exp": "凸面镜对光有发散作用，能扩大视野。会聚光线的是凹面镜。", "need": null}, {"id": "p081", "kp": "物理/机械运动/火车过桥", "q": "长 100 m 的火车完全通过长 500 m 的隧道，火车行驶的路程是", "opts": ["600 m", "500 m", "400 m", "100 m"], "exp": "完全通过：从车头进隧道到车尾出隧道，路程＝隧道长＋车长＝500＋100＝600 m。", "need": null, "fig": "train_t"}, {"id": "p082", "kp": "物理/机械运动/火车过桥", "q": "长 100 m 的火车全部在长 500 m 的隧道内行驶，这段路程是", "opts": ["400 m", "600 m", "500 m", "100 m"], "exp": "全部在隧道内：从车尾进隧道到车头出隧道，路程＝隧道长－车长＝500－100＝400 m。", "need": null, "fig": "train_t_in"}, {"id": "p083", "kp": "物理/机械运动/火车过桥", "q": "长 200 m 的火车以 20 m/s 的速度完全通过长 1000 m 的大桥，需要的时间是", "opts": ["60 s", "50 s", "40 s", "10 s"], "exp": "路程＝1000＋200＝1200 m，t＝s/v＝1200 m÷20 m/s＝60 s。忘了加车长会得到 50 s。", "need": null, "fig": "train_q"}, {"id": "p084", "kp": "物理/机械运动/火车过桥", "q": "火车通过大桥时，坐在车上的小明从上桥到下桥，他通过的路程是", "opts": ["桥长", "桥长＋车长", "桥长－车长", "车长"], "exp": "把人看成一个点，人从桥头到桥尾，路程就是桥长，不用加减车长。", "need": null}, {"id": "p085", "kp": "物理/光现象/作图规范", "q": "作光路图时，实际光线应该画成", "opts": ["实线，带箭头", "虚线，带箭头", "实线，不带箭头", "虚线，不带箭头"], "exp": "实际光线：实线＋箭头。法线、反向延长线、辅助线：虚线，不加箭头。", "need": null}, {"id": "p086", "kp": "物理/光现象/作图规范", "q": "作平面镜成像图时，镜中的像应该画成", "opts": ["虚线", "实线", "带箭头的实线", "加粗的实线"], "exp": "平面镜成的是虚像，要用虚线画，并标上 A′、B′。", "need": null}, {"id": "p087", "kp": "物理/光现象/作图规范", "q": "作反射光路图时，法线与镜面的关系是", "opts": ["垂直，要标直角符号", "平行", "成 45° 角", "没有要求"], "exp": "法线过入射点、与镜面垂直，用虚线画，并标出直角符号。", "need": null}, {"id": "p088", "kp": "物理/光现象/作图规范", "q": "平面镜成像作图中，像点与物点的连线应该", "opts": ["画成虚线，并标出垂直符号", "画成实线并加箭头", "不用画出来", "画成与镜面平行的实线"], "exp": "像与物的连线是辅助线，画虚线；它与镜面垂直，要标垂直符号。", "need": null}, {"id": "p089", "kp": "物理/光现象/作图规范", "q": "画入射光线和反射光线时，光线应该", "opts": ["画到镜面上，不悬空也不穿过镜面", "离镜面留一小段距离", "穿过镜面继续画", "画成虚线"], "exp": "光线要正好画到镜面上的入射点。悬空或者穿过镜面都会扣分。", "need": null}, {"id": "p090", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "入射光线与法线的夹角是 40°，反射光线与入射光线的夹角是", "opts": ["80°", "40°", "50°", "100°"], "exp": "入射角 40°，反射角也是 40°，两条光线的夹角＝40°＋40°＝80°。", "need": null, "fig": "reflect40"}, {"id": "p091", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "探究光的反射定律时，把右半边纸板向后折，纸板上看不到反射光线了。这说明", "opts": ["反射光线、入射光线和法线在同一平面内", "反射光线消失了", "反射角等于入射角", "光路是可逆的"], "exp": "反射光线仍然存在，只是不在折过去的纸板上，说明三线在同一平面内。", "need": null}, {"id": "p092", "kp": "物理/光现象/反射定律实验、光路可逆", "q": "光垂直射到平面镜上，反射角是", "opts": ["0°", "90°", "45°", "180°"], "exp": "垂直入射时，入射光线和法线重合，入射角是 0°，反射角也是 0°。90° 是光线与镜面的夹角。", "need": null, "fig": "normal_in"}, {"id": "p093", "kp": "物理/光现象/平面镜成像实验", "q": "平面镜成像实验中，选用两支完全相同的蜡烛，目的是", "opts": ["便于比较像与物的大小", "便于确定像的位置", "使像更亮", "便于测量距离"], "exp": "用完全相同的蜡烛 B 去和 A 的像重合，是为了比较像与物的大小。确定像的位置靠的是玻璃板。", "need": null, "fig": "mirror_exp"}, {"id": "p094", "kp": "物理/光现象/平面镜成像实验", "q": "平面镜成像实验中，如果玻璃板没有竖直放置，会出现的问题是", "opts": ["后面的蜡烛无法与像完全重合", "看不到像", "像变小", "像变成实像"], "exp": "玻璃板倾斜时，像会偏高或偏低，不在桌面上，后面的蜡烛怎么移动都无法与像重合。", "need": null, "fig": "mirror_exp"}, {"id": "p095", "kp": "物理/光现象/平面镜成像实验", "q": "平面镜成像实验中，应选用较薄的玻璃板，原因是", "opts": ["厚玻璃板会出现两个像，影响确定像的位置", "薄玻璃板成的像更大", "薄玻璃板不反射光", "厚玻璃板不能成像"], "exp": "玻璃板的前后两个表面都会反射成像，玻璃板厚了两个像明显分开，不好确定像的位置。", "need": null, "fig": "mirror_exp"}, {"id": "p096", "kp": "物理/光现象/平面镜成像实验", "q": "平面镜成像实验中，多次改变蜡烛的位置进行实验，目的是", "opts": ["得到普遍规律", "减小误差", "使像更清晰", "求平均值"], "exp": "探究规律的实验，多次实验是为了得到普遍规律，避免偶然性。测量类实验多次测量才是为了减小误差。", "need": null, "fig": "mirror_exp"}, {"id": "p097", "kp": "物理/透镜/透镜对光的作用", "q": "下列透镜中，属于凸透镜的是", "opts": ["中间厚、边缘薄的透镜", "中间薄、边缘厚的透镜", "厚度处处相同的玻璃片", "背面镀了银的玻璃片"], "exp": "凸透镜：中间厚、边缘薄。凹透镜：中间薄、边缘厚。", "need": "第5章 5.1 透镜"}, {"id": "p098", "kp": "物理/透镜/透镜对光的作用", "q": "通过凸透镜光心的光线，传播方向", "opts": ["不变", "向主光轴偏折", "远离主光轴偏折", "沿原路返回"], "exp": "过光心的光线传播方向不变，凸透镜、凹透镜都一样。", "need": "第5章 5.1 透镜", "fig": "lens_center_q"}, {"id": "p099", "kp": "物理/透镜/透镜对光的作用", "q": "从凸透镜焦点发出的光，经过凸透镜后", "opts": ["平行于主光轴射出", "会聚于另一侧的焦点", "沿原路返回", "向外发散"], "exp": "过焦点的光经凸透镜折射后平行于主光轴。它和“平行光过焦点”正好相反（光路可逆）。", "need": "第5章 5.1 透镜", "fig": "lens_focus_q"}, {"id": "p100", "kp": "物理/透镜/透镜对光的作用", "q": "让凸透镜正对太阳光，在另一侧的纸上得到一个最小、最亮的光斑，光斑到透镜中心的距离是", "opts": ["焦距", "二倍焦距", "物距", "透镜的直径"], "exp": "太阳光可以看成平行光，会聚的最小最亮的点就是焦点，焦点到光心的距离是焦距。", "need": "第5章 5.1 透镜", "fig": "lens_sun"}, {"id": "p101", "kp": "物理/透镜/凸透镜成像规律", "q": "照相机成的像是", "opts": ["倒立、缩小的实像", "倒立、放大的实像", "正立、缩小的虚像", "正立、放大的虚像"], "exp": "照相机：物体在二倍焦距以外，成倒立、缩小的实像。", "need": "第5章 5.3 凸透镜成像的规律"}, {"id": "p102", "kp": "物理/透镜/凸透镜成像规律", "q": "做凸透镜成像实验时，用纸遮住凸透镜的上半部分，光屏上的像", "opts": ["仍然完整，只是变暗", "只剩下半部分", "只剩上半部分", "完全消失"], "exp": "透镜剩下的部分仍然能把物体每一点发出的光会聚成像，像是完整的，只是通过的光少了，像变暗。", "need": "第5章 5.3 凸透镜成像的规律", "fig": "lens_cover"}, {"id": "p103", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "水沸腾时的特点是", "opts": ["持续吸热，温度保持不变", "持续吸热，温度不断升高", "不再吸热，温度保持不变", "持续放热，温度保持不变"], "exp": "沸腾要持续吸热，但温度保持在沸点不变。", "need": null, "fig": "boil_q"}, {"id": "p104", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "实验中测得水的沸点是 98 ℃，低于 100 ℃，原因可能是", "opts": ["当地气压低于标准大气压", "烧杯里的水太多", "加热时间太短", "酒精灯火焰太大"], "exp": "气压越低，沸点越低。标准大气压下水的沸点才是 100 ℃。水多少、火大小只影响加热的时间。", "need": null, "fig": "boil_q"}, {"id": "p105", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "高压锅能更快煮熟食物，是因为锅内", "opts": ["气压高，水的沸点升高", "气压高，水的沸点降低", "气压低，水的沸点升高", "气压低，水的沸点降低"], "exp": "高压锅密封，锅内气压高，水的沸点升高（超过 100 ℃），食物熟得快。", "need": null}, {"id": "p106", "kp": "物理/物态变化/沸腾与凝固实验图像", "q": "水沸腾后撤去酒精灯，水很快停止沸腾。这说明", "opts": ["沸腾需要持续吸热", "沸腾时温度会升高", "水的沸点降低了", "沸腾不需要吸热"], "exp": "不加 有一个对应的值。", "need": null}, {"id": "m076", "kp": "数学/方程组/方程的解的含义", "q": "已知 x＝－1，y＝2 是方程 3x＋my＝1 的解，则 m 的值是", "opts": ["2", "－1", "1", "－2"], "exp": "代入：3×(－1)＋2m＝1，－3＋2m＝1，m＝2。代入负数要加括号。", "need": null}, {"id": "m077", "kp": "数学/方程组/方程的解的含义", "q": "下列哪一组数不是方程 x＋2y＝7 的解？", "opts": ["x＝2，y＝3", "x＝1，y＝3", "x＝3，y＝2", "x＝5，y＝1"], "exp": "逐个代入：2＋2×3＝8≠7，所以它不是解。其余三组代入都等于 7。", "need": null}, {"id": "m078", "kp": "数学/方程组/解方程组（代入、加减）", "q": "方程组 y＝2x，x＋y＝9 的解是", "opts": ["x＝3，y＝6", "x＝6，y＝3", "x＝2，y＝4", "x＝4.5，y＝4.5"], "exp": "把 y＝2x 代入 x＋y＝9：3x＝9，x＝3，y＝6。", "need": null}, {"id": "m079", "kp": "数学/方程组/解方程组（代入、加减）", "q": "方程组 2x＋y＝7，x－y＝2 的解是", "opts": ["x＝3，y＝1", "x＝1，y＝3", "x＝2，y＝3", "x＝3，y＝－1"], "exp": "两式相加消去 y：3x＝9，x＝3；代入 x－y＝2 得 y＝1。验算：2×3＋1＝7 ✓。", "need": null}, {"id": "m080", "kp": "数学/方程组/解方程组（代入、加减）", "q": "解方程组 3x＋2y＝8 ①，x－2y＝4 ②，①＋② 得", "opts": ["4x＝12", "2x＝12", "4x＝4", "4x－4y＝12"], "exp": "y 的系数是 2 和 －2，互为相反数，相加消去 y：3x＋x＝8＋4，即 4x＝12。", "need": null}, {"id": "m081", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 200 元，打九折后的价格是", "opts": ["180 元", "191 元", "20 元", "110 元"], "exp": "打九折就是乘 0.9：200×0.9＝180 元。", "need": null}, {"id": "m082", "kp": "数学/方程组/调价、百分率应用题", "q": "某商品原价 x 元，降价 20% 后是 160 元，可列方程", "opts": ["0.8x＝160", "x－20＝160", "0.2x＝160", "1.2x＝160"], "exp": "降价 20% 后是原价的 80%：0.8x＝160。百分数用乘，不是直接减 20。", "need": null}, {"id": "m083", "kp": "数学/方程组/调价、百分率应用题", "q": "甲商品原价 x 元，涨价 10%；乙商品原价 y 元，降价 5 元。调价后两件商品共 100 元，可列方程", "opts": ["1.1x＋(y－5)＝100", "(x＋10)＋(y－5)＝100", "1.1x＋0.95y＝100", "0.1x＋(y－5)＝100"], "exp": "涨 10% 是乘 1.1；降 5 元是减 5。百分数用乘，具体钱数用加减。", "need": null}, {"id": "m084", "kp": "数学/方程组/购买与利润应用题", "q": "买甲、乙两种笔记本共 20 本，共花 110 元。甲每本 5 元，乙每本 6 元。设甲买 x 本、乙买 y 本，方程组是", "opts": ["x＋y＝20，5x＋6y＝110", "x＋y＝110，5x＋6y＝20", "x＋y＝20，6x＋5y＝110", "x＋y＝20，11(x＋y)＝110"], "exp": "一个方程管数量：x＋y＝20；一个方程管钱：5x＋6y＝110。", "need": null}, {"id": "m085", "kp": "数学/方程组/购买与利润应用题", "q": "鸡兔同笼，共有 10 个头、28 只脚。鸡有", "opts": ["6 只", "4 只", "7 只", "5 只"], "exp": "设鸡 x 只、兔 y 只：x＋y＝10，2x＋4y＝28。解得 x＝6，y＝4。题目问的是鸡，答 6 只。", "need": null}, {"id": "m086", "kp": "数学/方程组/购买与利润应用题", "q": "甲种商品每件利润 5 元，乙种商品每件利润 8 元，卖出甲 10 件、乙 20 件，总利润是", "opts": ["210 元", "390 元", "130 元", "260 元"], "exp": "分开算再相加：5×10＋8×20＝50＋160＝210 元。", "need": null}, {"id": "m087", "kp": "数学/方程组/购买与利润应用题", "q": "买 2 支铅笔和 1 块橡皮共 5 元，买 1 支铅笔和 1 块橡皮共 3 元。一支铅笔的价格是", "opts": ["2 元", "1 元", "3 元", "1.5 元"], "exp": "设铅笔 x 元、橡皮 y 元：2x＋y＝5，x＋y＝3。两式相减得 x＝2。", "need": null}, {"id": "m088", "kp": "数学/方程组/购买与利润应用题", "q": "40 名同学去划船，大船每条坐 6 人，小船每条坐 4 人，共租了 8 条船，每条船都坐满。大船租了", "opts": ["4 条", "6 条", "2 条", "5 条"], "exp": "设大船 x 条、小船 y 条：x＋y＝8，6x＋4y＝40。解得 x＝4，y＝4。", "need": null}, {"id": "m089", "kp": "数学/方程组/方程组与一次函数图像", "q": "二元一次方程 x＋y＝3 对应的一次函数是", "opts": ["y＝－x＋3", "y＝x＋3", "y＝x－3", "y＝－x－3"], "exp": "把 x 移到右边：y＝－x＋3。", "need": "第5章 二元一次方程与一次函数"}, {"id": "m090", "kp": "数学/方程组/方程组与一次函数图像", "q": "直线 y＝2x 与直线 y＝x＋2 的交点坐标是", "opts": ["(2, 4)", "(4, 2)", "(2, 2)", "(1, 2)"], "exp": "联立：2x＝x＋2，x＝2，y＝4。交点 (2, 4)，横坐标写在前面。", "need": "第5章 二元一次方程与一次函数", "fig": "twolines_24"}, {"id": "m091", "kp": "数学/勾股定理/弦图", "q": "弦图由四个全等的直角三角形围成。若每个直角三角形的两条直角边分别是 3 和 4，则大正方形的面积是", "opts": ["25", "49", "12", "7"], "exp": "大正方形的边长是直角三角形的斜边 c，面积＝c²＝3²＋4²＝25。", "need": null}, {"id": "m092", "kp": "数学/勾股定理/弦图", "q": "弦图中每个直角三角形的两条直角边分别是 5 和 12，则中间小正方形的面积是", "opts": ["49", "7", "169", "60"], "exp": "小正方形的边长＝12－5＝7，面积＝7²＝49。7 是边长，不是面积。", "need": null}, {"id": "m093", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 13，小正方形的面积是 1。设直角三角形的两条直角边为 x、y，则 (x＋y)² 的值是", "opts": ["25", "14", "12", "5"], "exp": "x²＋y²＝13；四个三角形面积之和 2xy＝13－1＝12。所以 (x＋y)²＝x²＋y²＋2xy＝13＋12＝25。", "need": null}, {"id": "m094", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 25，每个直角三角形的面积是 6，则小正方形的面积是", "opts": ["1", "19", "13", "4"], "exp": "小正方形面积＝大正方形面积－四个三角形面积＝25－4×6＝1。", "need": null}, {"id": "m095", "kp": "数学/勾股定理/弦图", "q": "已知 x＞0，y＞0，且 (x＋y)²＝49，则 x＋y 的值是", "opts": ["7", "49", "14", "24.5"], "exp": "(x＋y)² 是 49，所以 x＋y＝√49＝7。要分清“平方”和“它本身”。", "need": null}, {"id": "m096", "kp": "数学/勾股定理/弦图", "q": "弦图中，大正方形的面积是 100，小正方形的面积是 4，则每个直角三角形的面积是", "opts": ["24", "96", "48", "26"], "exp": "四个三角形面积之和＝100－4＝96，每个是 96÷4＝24。", "need": null}, {"id": "m097", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(1, 3)、B(3, 1)。直线 y＝x＋b 与线段 AB 有公共点，则 b 的取值范围是", "opts": ["－2≤b≤2", "－2＜b＜2", "b≥－2", "b≤2"], "exp": "过 A：3＝1＋b，b＝2；过 B：1＝3＋b，b＝－2。范围在两个值之间，端点也算公共点，所以带等号：－2≤b≤2。", "need": null}, {"id": "m098", "kp": "数学/一次函数/直线与线段有公共点", "q": "直线恰好经过线段的一个端点，这时直线与线段", "opts": ["有公共点，所以范围两边要写“≤”", "没有公共点，所以范围两边写“＜”", "有两个公共点", "无法判断有没有公共点"], "exp": "端点是线段的一部分，经过端点就是有公共点。所以答案写 ≤，不要漏等号。", "need": null}, {"id": "m099", "kp": "数学/一次函数/直线与线段有公共点", "q": "直线 y＝2x＋b 经过点 A(1, 4) 时，b 的值是", "opts": ["2", "6", "－2", "3"], "exp": "把 A 代入：4＝2×1＋b，b＝2。", "need": null}, {"id": "m100", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(1, 3)、B(3, 1)。直线 y＝kx 与线段 AB 有公共点，则 k 的取值范围是", "opts": ["1/3≤k≤3", "1/3＜k＜3", "k≥3", "1≤k≤3"], "exp": "过 A：3＝k，k＝3；过 B：1＝3k，k＝1/3。范围在两个值之间并带等号，小的写左边：1/3≤k≤3。", "need": null}, {"id": "m101", "kp": "数学/一次函数/直线与线段有公共点", "q": "已知点 A(0, 2)、B(4, 2)。直线 y＝－x＋b 与线段 AB 有公共点，则 b 的取值范围是", "opts": ["2≤b≤6", "2＜b＜6", "－2≤b≤2", "b≤6"], "exp": "过 A：2＝0＋b，b＝2；过 B：2＝－4＋b，b＝6。所以 2≤b≤6。", "need": null}, {"id": "m102", "kp": "数学/一次函数/直线与线段有公共点", "q": "求“直线与线段 AB 有公共点时 b 的范围”，第一步应该", "opts": ["把 A、B 两个端点分别代入直线，各求出一个 b 的值", "只把线段的中点代入直线", "令 x＝0 求出 b", "先求线段 AB 的长度"], "exp": "两个端点各代一次，得到 b 的两个值，范围就在这两个值之间（带等号）。", "need": null}, {"id": "m103", "kp": "数学/方程组/问什么答什么", "q": "设去年有 x 人参加，解方程得 x＝200。已知今年比去年多 10%，题目问“今年有多少人参加”，应答", "opts": ["220 人", "200 人", "210 人", "20 人"], "exp": "x 是去年的人数。今年＝200×(1＋10%)＝220 人。解出 x 之后要回头看题目问的是什么。", "need": null}, {"id": "m104", "kp": "数学/方程组/问什么答什么", "q": "设每桌坐 x 人，共 8 桌且都坐满，解得 x＝6。题目问“一共有多少人”，应答", "opts": ["48 人", "6 人", "8 人", "14 人"], "exp": "x 是每桌的人数，总人数＝6×8＝48 人。", "need": null}, {"id": "m105", "kp": "数学/方程组/问什么答什么", "q": "每 3 人共用一只饭碗。设饭碗有 x 只，解得 x＝20。题目问“共有多少人”，应答", "opts": ["60 人", "20 人", "23 人", "17 人"], "exp": "x 是饭碗数，人数＝3×20＝60 人。和作业里的“古寺”题一样：解出 x 之后还要再算一步。", "need": null}, {"id": "m106", "kp": "数学/方程组/问什么答什么", "q": "解出方程组之后，接下来最应该做的是", "opts": ["回头读题目的最后一句，看问的是什么，检验后写“答”", "直接把 x、y 的值抄到答的位置", "再列一个方程组", "把 x、y 相加作为答案"], "exp": "应用题六步：审→设→列→解→验→答。问的不一定是 x、y 本身。", "need": null}, {"id": "m107", "kp": "数学/方程组/问什么答什么", "q": "鸡兔同笼，共 8 个头、22 只脚。设鸡 x 只、兔 y 只，题目问“兔有多少只”，应答", "opts": ["3 只", "5 只", "4 只", "6 只"], "exp": "x＋y＝8，2x＋4y＝22，解得 x＝5，y＝3。问的是兔，答 y＝3 只，不要答成鸡的 5 只。", "need": null}, {"id": "m108", "kp": "数学/方程组/问什么答什么", "q": "设甲的速度是 x km/h，解得 x＝12。题目问“甲 3 小时走了多少千米”，应答", "opts": ["36 km", "12 km", "4 km", "15 km"], "exp": "x 是速度，路程＝速度×时间＝12×3＝36 km。", "need": null}, {"id": "m109", "kp": "数学/勾股定理/全等与勾股综合", "q": "下列条件中，不能判定两个三角形全等的是", "opts": ["两边和其中一边的对角分别相等（SSA）", "三边分别相等（SSS）", "两边和它们的夹角分别相等（SAS）", "两角和它们的夹边分别相等（ASA）"], "exp": "全等的判定有 SSS、SAS、ASA、AAS，直角三角形还有 HL。“边边角”不能判定全等。", "need": null}, {"id": "m110", "kp": "数学/勾股定理/全等与勾股综合", "q": "只能用来判定两个直角三角形全等的方法是", "opts": ["HL（斜边和一条直角边分别相等）", "SSS", "SAS", "AAS"], "exp": "HL 是直角三角形特有的判定方法；SSS、SAS、AAS 对所有三角形都适用。", "need": null}, {"id": "m111", "kp": "数学/勾股定理/全等与勾股综合", "q": "△ABC 中，∠ACB＝90°，AC＝BC。直线 l 经过点 C，A、B 在 l 的同侧，AD⊥l 于 D，BE⊥l 于 E。若 AD＝3，BE＝4，则 DE 的长是", "opts": ["7", "1", "5", "12"], "exp": "“一线三直角”：△ADC≌△CEB（AAS），所以 CD＝BE＝4，CE＝AD＝3，DE＝CD＋CE＝7。", "need": null}, {"id": "m112", "kp": "数学/勾股定理/全等与勾股综合", "q": "△ABC 中，∠ACB＝90°，AC＝BC。直线 l 经过点 C，AD⊥l 于 D，BE⊥l 于 E，AD＝3，BE＝4。则 AC 的长是", "opts": ["5", "7", "25", "√7"], "exp": "△ADC≌△CEB，所以 CD＝BE＝4。在 Rt△ADC 中，AC²＝AD²＋CD²＝9＋16＝25，AC＝5。", "need": null}, {"id": "m113", "kp": "数学/勾股定理/全等与勾股综合", "q": "长方形 ABCD 中，AB＝8，BC＝10。点 E 在 CD 上，沿 AE 折叠，使点 D 落在 BC 边上的点 F 处。则 CE 的长是", "opts": ["3", "4", "5", "6"], "exp": "AF＝AD＝10，BF＝√(10²－8²)＝6，FC＝4。设 CE＝x，则 EF＝DE＝8－x。在 Rt△ECF 中：x²＋4²＝(8－x)²，解得 x＝3。", "need": null}, {"id": "m114", "kp": "数学/勾股定理/全等与勾股综合", "q": "直角三角形的两条直角边分别是 6 和 8，则斜边上的高是", "opts": ["4.8", "5", "10", "2.4"], "exp": "斜边＝10。用面积：½×6×8＝½×10×h，h＝4.8。", "need": null}], "figs": {"figs": {"st": "<span class=\"figbox\"><svg xmlns=\"http://www.w3.org/2000/svg\" vie pts": ["公式：v＝s/t；变形 s＝vt，t＝s/v。", "计算前先统一单位：min 换成 s（乘 60），km 换成 m（乘 1000）。", "1 m/s＝3.6 km/h。m/s 换 km/h 乘 3.6；km/h 换 m/s 除以 3.6。", "书写格式：解 → 公式 → 代入数据（带单位）→ 结果 → 答。", "平均速度＝总路程÷总时间，不是几个速度的平均值。"], "warn": "期中第 22 题：8 min 没有换成 480 s，后面两问全部跟着错。看到 min 先换算。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/火车过桥": {"pts": ["火车完全通过桥（隧道）：路程＝桥长＋车长。", "火车全部在桥上（完全在隧道内）：路程＝桥长－车长。", "车上的某个人通过桥：路程＝桥长（人看成一个点）。", "画一张草图，标出车头从哪里到哪里，路程就不会错。"], "warn": "“完全通过”要加车长，“全部在桥上”要减车长，两种情况都要会。第三问不会也要先写出公式，有步骤分。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/音调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；过光心的光，方向不变。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点；反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分步硬算算错了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/坐标系中的面积": {"pts": ["求直线与坐标轴的交点：与 x 轴的交点令 y＝0；与 y 轴的交点令 x＝0。", "求两条直线的交点：把两个表达式联立成方程组。", "三角形面积：选在坐标轴上（或平行于坐标轴）的边做底，高就是第三个顶   const vw = e.target.closest("[data-view]");
  if (vw) { viewPdf(vw.dataset.view, nameOf(vw.dataset.view)); return; }
  const up = e.target.closest("[data-up]");
  if (up) { $("which").value = up.dataset.up; tab("up"); return; }
  const seg = e.target.closest(".seg");
  if (seg && e.target.tagName === "BUTTON") { prog.items[+seg.dataset.i][2] = e.target.textContent;
    [...seg.children].forEach(b => b.classList.toggle("on", b === e.target)); queueSave(); return; }
});
/* 进度：点了就自动保存（停 1.2 秒后把最新状态存一次，连续点几行只存一次） */
let saveTimer = null, saving = false, dirty = false, toastTimer = null;
function toast(t, bad, keep) { const el = $("toast"); el.textContent = t; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); if (!keep) toastTimer = setTimeout(() => el.className = "", bad ? 5000 : 1800); }
function queueSave() {
  if (!store.get("key")) { toast("还没有输入口令，改动没有保存。请先到“上传”页输入口令", true); return; }
  dirty = true; clearTimeout(saveTimer); toast("正在保存…", false, true); saveTimer = setTimeout(doSave, 1200);
}
async function doSave() {
  if (saving) { saveTimer = setTimeout(doSave, 600); return; }
  saving = true; dirty = false;
  const t = stamp(); prog.saved = t.slice(0, 10) + "T" + t.slice(11).replace(/-/g, ":"); prog.by = me() ? me().name : "";
  try { await put(`progress/${t}.json`, b64(JSON.stringify(prog, null, 1)), "progress"); if (!dirty) toast("已保存 ✓"); }
  catch (err) { toast((err.message || "保存失败") + "，改动没有保存", true); }
  saving = false;
}
$("which").innerHTML = [...D.sheets].sort((a, b) => b.date.localeCompare(a.date)).map(s =>
  `<option value="${s.id}">${s.date.slice(5).replace("-", "/")} ${s.subject} ${s.title}</option>`).join("");
/* ---- 登录：选“妈妈/孩子”+ 密码。密码正确才能解开通行证，里面带着上传用的口令 ---- */
const me = () => store.get("user") ? { name: store.get("user"), role: store.get("role") } : null;
let loginWho = null;
function loginUi() {
  const need = D.users.length && !me();
  $("login").hidden = !need; document.querySelector("nav").style.display = need ? "none" : "";
  if (need) { loginWho = loginWho || D.users[D.users.length - 1].name;
    $("who").innerHTML = D.users.map(u => `<button class="${u.name === loginWho ? "on" : ""}">${u.name}</button>`).join(""); }
}
$("who").onclick = e => { if (e.target.tagName === "BUTTON") { loginWho = e.target.textContent; loginUi(); $("pw").focus(); } };
$("pw").onkeydown = e => { if (e.key === "Enter") $("dologin").click(); };
$("dologin").onclick = async () => {
  const m = $("loginmsg"), pw = $("pw").value; if (!pw) return;
  m.className = "msg"; m.textContent = "正在登录…"; $("dologin").disabled = true;
  try {
    const buf = Uint8Array.from(atob(D.users.find(u => u.name === loginWho).blob), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 300000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const b = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28))));
    store.set("user", b.name); store.set("role", b.role); store.set("key", b.token || null); store.set("ans", b.ans || null); store.set("dk", b.dk || null); loadPriv();
    $("pw").value = ""; m.textContent = ""; loginUi(); renderToday(); keyUi(); flushQuiz(); tab("today");
  } catch (err) { m.className = "msg bad"; m.textContent = err && err.name === "OperationError" ? "密码不对。" : "登录失败（" + (err && err.message || err) + "）"; }
  $("dologin").disabled = false;
};
function logout() { PRIV = {}; SYNCQD = null; KIDQD = null; ["user", "role", "key", "ans", "dk"].forEach(k => store.set(k, null)); loginUi(); keyUi(); }
/* 家长发来的专用链接（网址后面带 #k=口令）：打开一次就自动记住口令，并把它从地址栏里去掉 */
(() => { const m = location.hash.match(/[#&]k=([^&]+)/); if (!m) return;
  store.set("key", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search);
  setTimeout(() => toast("口令已自动保存 ✓ 以后直接打开就能上传"), 400); })();
/* 以前登录时还没有这把密钥：请重新登录一次，才能看到批改说明和原题 */
if (me() && D.users.length && !store.get("dk")) { ["user", "role", "ans"].forEach(k => store.set(k, null)); }
renderToday(); renderFiles(); renderProg(); renderMast(); renderWrong(); flushQuiz(); loginUi(); keyUi(); tab("today"); loadPriv();
/* ---- 手机的“返回”键 / 返回手势：回到上一个画面，而不是直接退出页面 ---- */
(() => {
  const cur = () => { const x = document.querySelector("section.on"); return x ? x.id : "s-today"; };
  let last = cur(), popping = false;
  try { history.replaceState({ sec: last }, ""); } catch (e) { return; }
  new MutationObserver(() => { const id = cur(); if (id === last) return; last = id;
    if (!popping) { try { history.pushState({ sec: id }, ""); } catch (e) {} } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
  window.addEventListener("popstate", e => { const id = (e.state && e.state.sec) || "s-today", t = id.slice(2); popping = true;
    document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === (t === "wrong" || t === "kp" ? "mast" : t)));
    last = id; setTimeout(() => { popping = false; }, 0); });
})();
/* 手机浏览器会缓存旧页面：发现服务器上有新版本就自动换成新的 */
fetch("v.txt?" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim(); const q = new URLSearchParams(location.search).get("v");
  if (v && v !== D.build && q !== v) location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});
</script>
