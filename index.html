ext><text x=\"198.0\" y=\"16.0\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">D</text><text x=\"126.0\" y=\"164.0\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">F</text><text x=\"201.0\" y=\"104.0\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">E</text><text x=\"18.0\" y=\"88.0\" font-size=\"12\" text-anchor=\"middle\">8</text><text x=\"110.0\" y=\"14.0\" font-size=\"12\" text-anchor=\"middle\">10</text></svg></span>", "alt_q": "<span class=\"figbox\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 160\" width=\"297\" height=\"216\" font-family=\"'Times New Roman',SimSun,serif\" font-size=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"40,34 40,130 168,130\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.6\"/><path d=\"M47.0 130.0 L47.0 123.0 L40.0 123.0\" fill=\"none\" stroke=\"#000\" stroke-width=\"1\"/><line x1=\"40.0\" y1=\"130.0\" x2=\"86.1\" y2=\"68.6\" stroke=\"#000\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><path d=\"M91.7 72.8 L87.5 78.4 L81.9 74.2\" fill=\"none\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"28.0\" y=\"86.0\" font-size=\"12\" text-anchor=\"middle\">6</text><text x=\"104.0\" y=\"146.0\" font-size=\"12\" text-anchor=\"middle\">8</text><text x=\"70.0\" y=\"104.0\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">h</text></svg></span>", "profit": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">利润怎么算</b><span style=\"display:block\">每件利润＝售价－进价</span><span style=\"display:block\">总利润＝每件利润×件数</span><span style=\"display:block\">例：进价 15 元，售价 20 元，卖 40 件：</span><span style=\"display:block\">(20－15)×40＝5×40＝200（元）</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 先算“每件赚多少”，再乘件数；不要拿售价直接乘。</span></span>", "solmean": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">“解”的意思：代进去，两边相等</b><span style=\"display:block\">x＝2，y＝－1 是 3x－ay＝8 的解</span><span style=\"display:block\">→ 代入：3×2－a×(－1)＝8</span><span style=\"display:block\">→ 6＋a＝8，a＝2</span><span style=\"display:block\">判断一组数是不是方程组的解：<b>两个方程都要代</b>，都成立才是。</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 代入负数要加括号：－a×(－1)＝＋a。</span></span>", "solve": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">代入法</b><span style=\"display:block\">y＝2x－3 ①　　3x＋2y＝8 ②</span><span style=\"display:block\">把①代入②：3x＋2(2x－3)＝8 → 7x＝14 → x＝2</span><span style=\"display:block\">代回①：y＝2×2－3＝1</span><span style=\"display:block\">验算（代入另一个方程②）：3×2＋2×1＝8 ✓</span></span><span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">加减法</b><span style=\"display:block\">3x＋4y＝10 ①　　5x－2y＝8 ②</span><span style=\"display:block\">②×2（<b>左右两边都乘</b>）：10x－4y＝16 ③</span><span style=\"display:block\">①＋③：13x＝26 → x＝2；代入①：y＝1</span><span style=\"display:block\">验算：5×2－2×1＝8 ✓</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 算出奇怪的分数，多半是哪一步乘漏了或符号错了，回头查。</span></span>", "ask": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14.5px;line-height:1.75;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:2px\">解完方程还没做完</b><span style=\"display:block\">① 设：去年有 x 人</span><span style=\"display:block\">② 解方程：x＝200</span><span style=\"display:block\">③ <b>回头读题目最后一句</b>：问的是“今年有多少人”</span><span style=\"display:block\">④ 再算一步：200×(1＋10%)＝220</span><span style=\"display:block\">⑤ 答：今年有 220 人。</span><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ x 是你自己设的量，题目问的不一定是它。</span></span>", "price": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14px;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:3px\">调价题：先列“原来 / 调价后”的表</b><table style=\"border-collapse:collapse;width:100%;background:#fff\"><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\"></td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">甲</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">乙</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">合计</td></tr><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">原来</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">x</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">y</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">x＋y＝300</td></tr><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">调价后</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">0.9x</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">1.2y</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">0.9x＋1.2y＝330</td></tr></table><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 降 10% 是 ×(1－10%)＝×0.9；涨 20% 是 ×(1＋20%)＝×1.2。表的每一行就是一个方程。</span></span>", "buy": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14px;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:3px\">购买题：一个方程管“件数”，一个方程管“钱数”</b><table style=\"border-collapse:collapse;width:100%;background:#fff\"><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\"></td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">甲</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">乙</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">合计</td></tr><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">件数</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">x</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">y</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">x＋y＝60</td></tr><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">钱数（元）</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">15x</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">24y</td><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center\">15x＋24y＝1080</td></tr></table><span style=\"display:block;margin-top:4px;color:#b45309;font-size:13.5px\">★ 钱数＝单价×件数。求利润再用：(售价－进价)×件数。</span></span>", "irr_kind": "<span class=\"figbox\" style=\"display:block;text-align:left;font-size:14px;margin:6px 0\"><b style=\"display:block;color:#2563eb;font-size:13px;margin-bottom:3px\">哪些是无理数（先把能算的算出来再判断）</b><table style=\"border-collapse:collapse;width:100%;background:#fff\"><tr><td style=\"border:1px solid #94a3b8;padding:4px 8px;text-align:center;background:#f1f5f9;font-weight:600\">是无理数</td><td style=\"border:1px solid #94a3b8;paddin fb3/57O6W1pFy4zlQeQmCSCdlaUFLsHbacVCHtXf6tuYLOQE5fV38gdqGFr9qmXqjsRUO+L5XqRw1ahc0nG8lSQdpo2BC+jUPig5JDWQVNZkCZYIwuvP1Sx948V08VHQqHYlOeO910OAR6luppFqes6Mdupy5Z3YEjWz8kKA==", "notes": {"物理/机械运动/停表和温度计读数": {"pts": ["停表读数＝小盘（分）＋大盘（秒）。", "先看小盘指针：没过两个数字中间的半格线，大盘读 0～30 s；过了半格线，大盘读 30～60 s。", "最后常要换算成秒：3 min 37.5 s＝3×60＋37.5＝217.5 s。", "温度计：先找 0 刻度在哪里。液柱顶端在 0 以下，数字越往下越大，是零下；读作“零下几摄氏度”或“负几摄氏度”。", "读数时看清分度值，视线与液柱上表面相平。"], "warn": "不能把“分”和“秒”直接拼成小数：4 min 7.5 s 不是 4.07，而是 247.5 s。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/参照物、凸面镜": {"pts": ["判断运动还是静止只看一件事：相对参照物，位置变没变。变了是运动，没变是静止。", "同一个物体，选不同的参照物，结论可以不同（运动和静止是相对的）。", "凸面镜：对光有发散作用，能扩大视野。例：汽车后视镜、路口的转弯镜。", "凹面镜：对光有会聚作用。例：太阳灶、手电筒的反光碗。"], "warn": "凸面镜和凹面镜容易记反：“凸”——扩大视野；“凹”——会聚光。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/s-t 和 v-t 图像": {"pts": ["第一步永远是看纵轴：是 s（路程）还是 v（速度）。", "s－t 图像：斜直线＝匀速直线运动（越陡越快）；水平线＝静止。", "v－t 图像：水平线＝匀速直线运动；斜向上的线＝加速。", "从 s－t 图像求速度：在线上取一个点，v＝s÷t。", "两条 s－t 图线相交，表示此时两物体通过的路程相同（相遇）。"], "warn": "同样是“水平线”，在 s－t 图里是静止，在 v－t 图里是匀速。多选题里常同时考两种图。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/速度计算与单位换算": {"pts": ["公式：v＝s/t；变形 s＝vt，t＝s/v。", "计算前先统一单位：min 换成 s（乘 60），km 换成 m（乘 1000）。", "1 m/s＝3.6 km/h。m/s 换 km/h 乘 3.6；km/h 换 m/s 除以 3.6。", "书写格式：解 → 公式 → 代入数据（带单位）→ 结果 → 答。", "平均速度＝总路程÷总时间，不是几个速度的平均值。"], "warn": "期中第 22 题：8 min 没有换成 480 s，后面两问全部跟着错。看到 min 先换算。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/机械运动/火车过桥": {"pts": ["火车完全通过桥（隧道）：路程＝桥长＋车长。", "火车全部在桥上（完全在隧道内）：路程＝桥长－车长。", "车上的某个人通过桥：路程＝桥长（人看成一个点）。", "画一张草图，标出车头从哪里到哪里，路程就不会错。"], "warn": "“完全通过”要加车长，“全部在桥上”要减车长，两种情况都要会。第三问不会也要先写出公式，有步骤分。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/音调·响度·音色": {"pts": ["音调：声音的高低，由振动的频率决定。振动越快，音调越高。", "响度：声音的大小（强弱），由振幅决定，还和离发声体的远近有关。", "音色：声音的特色，用来分辨是谁（什么乐器）发出的声音。", "改变音调的做法：按笛子不同的孔、按琴弦的不同位置、换粗细或长短不同的弦、往瓶里装不同量的水。", "改变响度的做法：用更大的力敲、吹、拨。"], "warn": "“声音大”说的是响度，“声音尖、细、低沉”说的是音调。按笛孔改变的是音调，不是音色。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/声现象/噪声等级（分贝）": {"pts": ["分贝（dB）是表示声音强弱（响度）等级的单位。", "0 dB：人刚能听到的最微弱的声音。", "30～40 dB：较为理想的安静环境。", "为了保证休息和睡眠，不超过 50 dB；保证工作和学习，不超过 70 dB；保护听力，不超过 90 dB。", "减弱噪声的三个途径：在声源处、在传播过程中、在人耳处。"], "warn": "记四个数：30～40 理想，50 睡眠，70 学习，90 听力。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/熔化和凝固图像": {"pts": ["熔化要吸热，图像总体上升；凝固要放热，图像总体下降。", "晶体：有固定的熔点，图像中间有一段水平线（温度不变）。非晶体：没有水平段。", "水平段对应的温度就是熔点（凝固点）；水平段的长度就是熔化（凝固）用的时间。", "水平段之前是固态，水平段中是固液共存，之后是液态（熔化时）。", "常见晶体：冰、海波、各种金属。常见非晶体：玻璃、沥青、松香、石蜡。"], "warn": "先看“升还是降”定熔化还是凝固，再看“有没有平台”定晶体还是非晶体。期中第 2 题把下降的图当成了熔化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/“白气”与液化": {"pts": ["水蒸气是无色透明的气体，人眼看不见。", "凡是看得见的“白气”“白雾”“雾”，都是水蒸气遇冷液化成的小水滴，是液态。", "液化要放热。", "判断来源：烧水壶嘴的“白气”——壶里出来的热水蒸气遇冷；冰棍、冰箱门口的“白气”——周围空气里的水蒸气遇冷。"], "warn": "“白气不是气”。选项里写“白气是水蒸气”一定是错的。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/六种物态变化与吸放热": {"pts": ["固→液：熔化（吸热）；液→固：凝固（放热）。", "液→气：汽化（吸热），包括蒸发和沸腾；气→液：液化（放热）。", "固→气：升华（吸热）；气→固：凝华（放热）。", "吸热的三个：熔化、汽化、升华（都是往“更散”的状态变）。", "常见例子：露、雾、“白气”——液化；霜、雪、冰花、雾凇——凝华；樟脑丸变小、干冰变没、冬天冰冻的衣服变干——升华。"], "warn": "霜和冰花是凝华，不是凝固；露和雾是液化。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/物态变化/沸腾与凝固实验图像": {"pts": ["水沸腾的特点：持续吸热，温度保持不变。这个不变的温度就是沸点。", "沸点和气压有关：气压越高，沸点越高（高压锅）；气压低于标准大气压时，水的沸点低于 100 ℃。", "水里加盐后，沸点升高，凝固点降低。", "从图像读时间：找到水平段的起点和终点，两个时刻相减。", "实验题的填空要用课本上的说法，最后一空不要空着。"], "warn": "期中第 18 题：把“盐水的沸点升高”写成了降低；凝固持续的时间要用终点时刻减起点时刻。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/直线传播·反射·折射的分类": {"pts": ["光的直线传播：影子、手影、日食、月食、小孔成像、激光准直、排队看齐。", "光的反射：水中的倒影、平面镜成像、看见不发光的物体、自行车尾灯、潜望镜。", "光的折射：水中的筷子变弯、池水变浅、看到水里的鱼、海市蜃楼、彩虹（色散）、放大镜。", "口诀：“影”是直线传播，“倒影、镜子”是反射，“隔着水或玻璃看东西”是折射。"], "warn": "水中的“云、树、桥”是倒影（反射）；水中的“鱼、石头”是折射。“影子”和“倒影”不是一回事。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像的距离和大小": {"pts": ["平面镜成正立、等大的虚像。", "像和物到镜面的距离相等；像和物的连线与镜面垂直。", "像的大小只由物体的大小决定，与物体离镜面的远近无关。", "像到物的距离＝物到镜面距离的 2 倍。", "视力表问题：先求视力表的像到镜面的距离，再加上（或减去）人到镜面的距离。"], "warn": "人走近镜子，像不会变大（只是看起来大）。看清题目问的是“像到镜面”还是“像到人”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/平面镜成像实验": {"pts": ["用玻璃板代替平面镜：便于确定像的位置。", "用两支完全相同的蜡烛：便于比较像与物的大小。", "玻璃板要竖直放置（垂直于桌面），否则后面的蜡烛无法与像重合。", "选较薄的玻璃板：避免出现两个像；在较暗的环境中做：像更清晰。", "在像的位置放光屏，光屏上承接不到像，说明平面镜成的是虚像。", "多次改变蜡烛位置做实验：为了得到普遍规律。"], "warn": "这些都是固定说法，要按原话写。用不透明的纸挡在玻璃板后面，从前面看仍然能看到完整的像。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/反射定律实验、光路可逆": {"pts": ["反射定律：反射光线、入射光线和法线在同一平面内；反射光线和入射光线分居法线两侧；反射角等于入射角。", "入射角、反射角都是光线与法线的夹角，不是与镜面的夹角。", "把纸板向后折，看不到反射光线，说明三线在同一平面内（反射光线仍然存在）。", "让光逆着反射光线的方向射入，会逆着原来的入射光线射出：在反射现象中，光路是可逆的。", "为了显示光路，可以让光贴着纸板入射，或在空气中喷烟雾。"], "warn": "只能说“反射角等于入射角”，不能说“入射角等于反射角”。题目给的是与镜面的夹角时，先用 90° 去减。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/潜望镜（两次反射成像）": {"pts": ["潜望镜由两块互相平行、与水平方向成 45° 的平面镜组成。", "光经过两次反射进入人眼，利用的是光的反射。", "每次反射都成正立、等大的虚像；两次反射后看到的仍是正立、等大的虚像。", "分析方法：先求物体在第一块镜中的像，再把这个像当作“物体”，求它在第二块镜中的像。"], "warn": "两次成像要一步一步来，每一步都用“像和物关于镜面对称”。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/光现象/作图规范": {"pts": ["用直尺和铅笔作图。", "实际光线：实线，加箭头。", "法线、光线的反向延长线、虚像、辅助线：虚线，不加箭头。", "法线与镜面（界面）垂直，要标直角符号。", "平面镜成像作图：作对称点，像与物的连线画虚线并标垂直符号，像用虚线画，标上字母 A′、B′。", "光线要画到镜面（界面）上，不能悬空，也不能穿过去。"], "warn": "期中两道作图题各扣 1 分，都是因为虚实线、箭头、垂直符号没画全。画完按这六条检查一遍。", "pdf": "物理/知识点/物理知识点总结_前四章.pdf"}, "物理/透镜/透镜对光的作用": {"pts": ["凸透镜：中间厚、边缘薄，对光有会聚作用。", "凹透镜：中间薄、边缘厚，对光有发散作用。", "凸透镜三条特殊光线：平行于主光轴的光，折射后过焦点；过焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "凹透镜：平行于主光轴的光，折射后发散，反向延长线过同侧的焦点；射向另一侧焦点的光，折射后平行于主光轴；过光心的光，方向不变。", "判断会聚还是发散：把入射光线照原方向延长，折射光比它更靠近主光轴是会聚（凸透镜），更远离是发散（凹透镜）。", "透镜越凸，对光的偏折能力越强，焦距越短。", "粗测焦距：让凸透镜正对太阳光，找到最小、最亮的光斑，光斑到透镜的距离就是焦距。"], "warn": "“会聚”是指比原来更靠拢，不一定相交于一点：焦点以内的光源经凸透镜后仍散开，但凸透镜仍起会聚作用。凹透镜是“射向另一侧焦点”的光才平行射出。反向延长线要画虚线。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "物理/透镜/凸透镜成像规律": {"pts": ["u＞2f：倒立、缩小的实像，f＜v＜2f（照相机）。", "u＝2f：倒立、等大的实像，v＝2f（可用来测焦距）。", "f＜u＜2f：倒立、放大的实像，v＞2f（投影仪）。", "u＜f：正立、放大的虚像，像和物在同一侧（放大镜）。", "口诀：一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。", "实验：烛焰、凸透镜、光屏的中心调到同一高度，使像成在光屏中央。", "已知物 A 和像 A′ 找焦点：从 A 画平行于主光轴的光线交透镜于 P，连 PA′（虚像连虚线再延长），与主光轴的交点就是焦点。"], "warn": "遮住透镜的一部分，光屏上仍是完整的像，只是变暗。蜡烛变短，像向上移。", "pdf": "物理/知识点/物理知识点总结_第五章透镜.pdf"}, "数学/位置与坐标/点到坐标轴的距离": {"pts": ["点 P(x, y) 到 x 轴的距离＝|y|；到 y 轴的距离＝|x|。", "记法：到哪条轴的距离，看的是“另一个”坐标。", "四个象限的符号：第一 (＋,＋)，第二 (－,＋)，第三 (－,－)，第四 (＋,－)。", "做题顺序：先由距离定出 |x|、|y|，再由象限定正负号。", "x 轴上的点纵坐标为 0；y 轴上的点横坐标为 0。"], "warn": "期中第 3 题：把“到 x 轴的距离”当成了横坐标，x 和 y 写反了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/位置与坐标/最短路径（对称）": {"pts": ["A、B 在直线 l 同侧，在 l 上找点 P 使 PA＋PB 最小（将军饮马）。", "做法：作 B 关于 l 的对称点 B′，连接 AB′，与 l 的交点就是 P。", "最小值＝线段 AB′ 的长，常用勾股定理计算。", "关于 x 轴对称：横坐标不变，纵坐标变相反数；关于 y 轴对称：纵坐标不变，横坐标变相反数。", "作图要保留痕迹：对称点、连线都要画出来。"], "warn": "不能直接连接 AB，也不能凭感觉取点。必须先作对称点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/平方根与算术平方根": {"pts": ["正数 a 的平方根有两个：±√a；算术平方根只有一个：√a（正的那个）。", "根号 √ 本身只表示算术平方根，结果不带 ±。√16＝4，不是 ±4。", "题目写“平方根”三个字，答案才带 ±。16 的平方根是 ±4。", "0 的平方根是 0；负数没有平方根。", "立方根：每个数都只有一个立方根，符号和原数相同。－8 的立方根是 －2。", "“√16 的平方根”要算两步：先 √16＝4，再求 4 的平方根 ±2。"], "warn": "期中第 4 题：√(9/25)＝3/5，写成了 ±3/5。看到根号就不写 ±。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/无理数与估算": {"pts": ["无理数＝无限不循环小数。常见三类：开方开不尽的数（√2、√5、∛3）；含 π 的数（π、π/2）；像 0.1010010001… 这样有规律但不循环的小数。", "判断前先把能算的算出来：√9＝3、∛8＝2、√16＝4 都是整数，是有理数。", "分数、有限小数、循环小数都是有理数：22/7、3.14、0.333… 都不是无理数。", "估算 √a：找两个相邻的平方数夹住 a。9＜10＜16，所以 3＜√10＜4。", "a 离哪个平方数近，√a 就靠近哪个整数：√10 约 3.2，√15 约 3.9。", "√10 的整数部分是 3，小数部分是 √10－3。"], "warn": "22/7 约等于 π，但它是分数，是有理数；带根号的数要先看能不能开得尽。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/实数/规律探究与分母有理化": {"pts": ["分母有理化：分子分母同乘一个式子，把分母里的根号去掉。", "1/√a：同乘 √a，得 √a/a。", "1/(√a＋√b)：同乘 (√a－√b)，分母用平方差公式变成 a－b。", "常见结论：1/(√(n＋1)＋√n)＝√(n＋1)－√n，一串这样的式子相加，中间的项会互相抵消。", "找规律的题：把前三四项按同样的格式写整齐，看哪个数在变、和序号是什么关系。"], "warn": "期中第 21 题：下标和根号里的数对应错了（S₆ 应是 √6/2）。写规律时把序号 n 代进去验算前两项。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/勾股定理与面积": {"pts": ["直角三角形中：a²＋b²＝c²，c 是斜边（最长的边）。", "已知两直角边求斜边：c＝√(a²＋b²)；已知斜边和一直角边：b＝√(c²－a²)。", "逆定理：如果三边满足 a²＋b²＝c²，这个三角形是直角三角形（用来“判断”直角）。", "常见勾股数：3、4、5；5、12、13；6、8、10；8、15、17。", "求不规则图形的面积：割成几个直角三角形，或用大图形减去小图形。"], "warn": "先确定哪条边是斜边。期中第 14 题要先用勾股定理求边长，再用逆定理证明是直角三角形，才能算面积。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/弦图": {"pts": ["弦图：四个全等的直角三角形围成一个大正方形，中间是一个小正方形。", "设直角边为 x、y（x＞y），斜边为 c：大正方形面积＝c²＝x²＋y²。", "小正方形的边长＝x－y，面积＝(x－y)²。", "四个三角形的面积之和＝2xy＝大正方形面积－小正方形面积。", "(x＋y)²＝x²＋y²＋2xy，可以由上面几个量求出。"], "warn": "期中第 13 题：(x＋y)²＝119，所以 x＋y＝√119，不是 119。平方和本身要分清。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/勾股定理/全等与勾股综合": {"pts": ["最后一道大题通常三问：第（1）问证全等或求一条线段，第（2）问沿用第（1）问的方法，第（3）问是变化或综合。", "证全等的常用条件：SSS、SAS、ASA、AAS，直角三角形还有 HL。", "看到“等腰直角”“正方形”“90°”，想到构造全等三角形（一线三直角）。", "求线段长：把它放进直角三角形，设未知数，用勾股定理列方程。", "不会证的也要把已知条件、能得到的结论一条一条写出来。"], "warn": "期中第 23 题（2）（3）问空着。第（2）问一般就是第（1）问方法的重复，至少写出“同（1）可证……”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/自变量取值范围": {"pts": ["分母不能为 0：y＝1/(x－2)，x≠2。", "根号下不能是负数：y＝√(x－2)，x≥2。", "根号在分母里：既不能是负数又不能是 0，y＝1/√(x－2)，x＞2。", "既有根号又有分母：两个条件都要写，用“且”连接，如 x≥1 且 x≠3。", "实际问题还要让实际意义成立（人数是正整数、时间不为负等）。"], "warn": "期中第 11 题：根号在分母里要写 ＞，不能写 ≥。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/直线与线段有公共点": {"pts": ["直线 y＝kx＋b 与线段 AB 有公共点，求 b（或 k）的范围。", "做法：把线段的两个端点分别代入直线，各求出一个值，范围就在这两个值之间。", "“有公共点”包含经过端点的情况，所以两边都写 ≤。", "写答案时小的在左、大的在右，如 －6≤b≤－2。"], "warn": "期中第 15 题：写成了 －2＜b＜0，漏了等号。端点也是公共点。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/待定系数法": {"pts": ["求一次函数表达式：设 y＝kx＋b，把已知的两个点代入，得到关于 k、b 的方程组，解出来。", "如果已知 b（直线与 y 轴的交点），只需要再代一个点求 k。", "正比例函数 y＝kx 只需要一个点。", "求完之后，一定再代一个已知点进去验算。"], "warn": "期中第 22（1）题：符号算错，k 应为 －1/3 却写成 1/3，后面两问全丢。验算只要 10 秒。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/利润计算": {"pts": ["每件利润＝售价－进价（成本）。", "总利润＝每件利润×销售量。", "也可以算：总利润＝总收入－总成本，两种算法结果相同。", "从图像或表格里读数时，看清哪个是成本、哪个是售价、哪个是销量。"], "warn": "期中第 20（1）题：没有先减成本就直接相乘。先算“每件赚多少”。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/分段函数反求": {"pts": ["分段计费（水费、电费、出租车）：每一档有自己的表达式。", "超过部分的写法：基础费用＋单价×(x－起点)。例：y＝50＋4(x－20)。", "已知费用求用量（反求）：第一步先算每一档的最大费用，判断这个费用落在哪一档。", "第二步只用那一档的表达式列方程求 x。", "求完代回去验算费用对不对。"], "warn": "期中第 19（3）题：没有先判断在哪一档，分步硬算算错了。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/一次函数/坐标系中的面积": {"pts": ["求直线与坐标轴的交点：与 x 轴的交点令 y＝0；与 y 轴的交点令 x＝0。", "求两条直线的交点：把两个表达式联立成方程组。", "三角形面积：选在坐标轴上（或平行于坐标轴）的边做底，高就是第三个顶点到这条轴的距离（坐标的绝对值）。", "没有边在坐标轴上时：用一条竖直或水平的线把它分成两个三角形，或用大图形减去小图形。"], "warn": "期中第 22（2）题：底和高找错。先把三个顶点的坐标都写出来，再选底。", "pdf": "数学/知识点/数学知识点总结_前四章.pdf"}, "数学/方程组/方程的解的含义": {"pts": ["二元一次方程的解是一对数 (x, y)，代入后左右两边相等。", "一个二元一次方程有无数个解；方程组的解是两个方程的公共解。", "判断是不是解：分别代入每个方程，都成立才是。", "已知解求字母的值：把解代进去，得到关于这个字母的方程。", "代入负数要加括号：－a×(－1)＝＋a。"], "warn": "只代一个方程成立不算方程组的解，两个都要代。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/解方程组（代入、加减）": {"pts": ["代入法：把一个方程写成 y＝…（或 x＝…），代入另一个方程。适合有系数是 1 或 －1 的情况。", "加减法：让某个未知数的系数相等或相反，相等就相减，相反就相加。", "代入时括号要整个乘开：－2(x－3)＝－2x＋6。", "两个方程相减时，被减的方程每一项都要变号。", "方程两边同乘一个数时，等号右边的常数项也要乘。", "解完把结果代回两个方程各验算一次。"], "warn": "作业第 77 页 3 题：x＝20 时 y 应是 80，写成了 100，代回 x＋y＝100 一验算就能发现。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/问什么答什么": {"pts": ["应用题六步：审 → 设 → 列 → 解 → 验 → 答。", "解出 x、y 之后，回头读题目的最后一句，看问的是什么。", "有时问的不是 x、y 本身：问“今年”的人数而设的是“去年”；问总人数而设的是每桌人数。", "最后必须写“答：……”，带单位。", "设未知数时写清楚 x、y 各代表什么，能避免答错对象。"], "warn": "作业“古寺”题：解出 x＝208、y＝156 就停了，题目问的是僧人数 3×208＝624。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/调价、百分率应用题": {"pts": ["涨（增加）10%：乘以 1.1；降（减少）20%：乘以 0.8；打八折：乘以 0.8。", "涨 5 元：加 5；降 5 元：减 5。百分数用乘，具体的钱数用加减。", "先列表：行写“调整前、调整后”，列写两个对象，每一行得到一个方程。", "“A 比 B 少 10”写成 B－A＝10（大的减小的）。", "解完代回题目验算调整后的关系。"], "warn": "作业第 4 题不会列。不要直接盯着题目列方程，先把表填出来。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/购买与利润应用题": {"pts": ["两个等量关系：一个管“数量”，一个管“钱”。", "数量之和＝总数量：x＋y＝60。", "单价×数量之和＝总价：15x＋24y＝1080。", "求利润：每件利润×件数，两种商品分开算再相加。", "鸡兔同笼也是这一类：头数之和＝总头数，脚数之和＝总脚数。"], "warn": "第（2）问常用到第（1）问的结果，第（1）问算完先验算再往下做。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}, "数学/方程组/方程组与一次函数图像": {"pts": ["每个二元一次方程都对应一条直线，如 x－y＝－1 就是 y＝x＋1。", "方程组的解 ⇔ 两条直线交点的坐标。交点 (2, 3) 对应解 x＝2，y＝3。", "求两条直线的交点：把两个表达式联立成方程组来解。", "两条直线平行（k 相等、b 不等）：方程组无解；两条直线重合：有无数组解。", "看图写解时：横坐标是 x，纵坐标是 y。"], "warn": "图像法得到的解可能只是近似值，题目要求准确时仍要用代入法或加减法。", "pdf": "数学/知识点/数学知识点总结_第五章二元一次方程组.pdf"}}};

  store.set("key", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search);
  setTimeout(() => toast("口令已自动保存 ✓ 以后直接打开就能上传"), 400); })();
/* 以前登录时还没有这把密钥：请重新登录一次，才能看到批改说明和原题 */
if (me() && D.users.length && !store.get("dk")) { ["user", "role", "ans"].forEach(k => store.set(k, null)); }
renderToday(); renderFiles(); renderProg(); renderMast(); renderWrong(); flushQuiz(); loginUi(); keyUi(); tab("today"); loadPriv();
/* ---- 手机的“返回”键 / 返回手势：回到上一个画面，而不是直接退出页面 ---- */
(() => {
  const cur = () => { const x = document.querySelector("section.on"); return x ? x.id : "s-today"; };
  let last = cur(), popping = false;
  try { history.replaceState({ sec: last }, ""); } catch (e) { return; }
  new MutationObserver(() => { const id = cur(); if (id === last) return; last = id;
    if (!popping) { try { history.pushState({ sec: id }, ""); } catch (e) {} } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
  window.addEventListener("popstate", e => { const id = (e.state && e.state.sec) || "s-today", t = id.slice(2); popping = true;
    document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === (t === "kp" ? "mast" : t === "prog" ? "files" : t)));
    last = id; setTimeout(() => { popping = false; }, 0); });
})();
/* 手机浏览器会缓存旧页面：发现服务器上有新版本就自动换成新的 */
fetch("v.txt?" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim(); const q = new URLSearchParams(location.search).get("v");
  if (v && v !== D.build && q !== v) location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});
</script>
